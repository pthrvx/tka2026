<\/h4><pre>total = 0\nuntuk i = 1 sampai 5\n    jika i mod 2 = 1\n        total = total + i\ncetak total<\/pre><p>Telusuri satu per satu. i = 1 membuat total 1. i = 2 dilewati. i = 3 membuat total 4. i = 4 dilewati. i = 5 membuat total 9. Hasil cetak: 9. Operator mod adalah sisa bagi, jadi i mod 2 = 1 berarti i ganjil.<\/p><h4>Kesalahan yang sering terjadi<\/h4><ul><li>Menebak output tanpa menelusuri nilai variabel langkah demi langkah.<\/li><li>Tertukar antara memberi nilai ke variabel dan membandingkan dua nilai.<\/li><li>Salah menghitung berapa kali perulangan berjalan.<\/li><\/ul><h4>Cek pemahaman<\/h4><p>Buat tabel kecil berisi nilai tiap variabel pada setiap putaran. Kebiasaan ini membuat soal kode jauh lebih mudah dijawab.<\/p>"},{"s":"basis-data","t":"Basis Data","m":3,"sr":"buatan","h":"<p>Primary key adalah pengenal unik. Relasi one-to-many berarti satu data terhubung banyak data.<\/p>"},{"s":"pengujian","t":"Pengujian","m":3,"sr":"buatan","h":"<p>Black-box testing menguji fungsi tanpa melihat kode; white-box testing menguji logika kode.<\/p>"}],"qs":[{"q":"<p>Tahap SDLC yang menentukan tujuan, jadwal, dan anggaran adalah …<\/p>","t":"s","o":["Planning","Analysis","Design","Testing","Maintenance"],"a":[0],"e":"Planning adalah perencanaan proyek.","ks":""},{"q":"<p>“Aplikasi harus dapat menampilkan data siswa” termasuk …<\/p>","t":"s","o":["Kebutuhan fungsional","Kebutuhan nonfungsional","Kebutuhan perangkat keras","Kebutuhan jaringan","Kebutuhan desain grafis"],"a":[0],"e":"Kebutuhan fungsional menjelaskan fitur sistem.","ks":""},{"q":"<p>Simbol belah ketupat pada flowchart digunakan untuk …<\/p>","t":"s","o":["Mulai/selesai","Input/output","Proses","Keputusan","Konektor"],"a":[3],"e":"Belah ketupat untuk percabangan/keputusan.","ks":""},{"q":"<p>Hasil pseudocode:<br>a=10<br>b=3<br>c=a mod b<br>print c<\/p>","t":"s","o":["1","2","3","4","10"],"a":[0],"e":"10 mod 3 = 1.","ks":""},{"q":"<p>Output perulangan:<br>for i=1 to 4 do<br> print i*2<br>endfor<\/p>","
