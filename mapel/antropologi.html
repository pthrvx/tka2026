<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Antropologi | Persiapan TKA</title><link rel="stylesheet" href="../assets/app.css?v=1792139313"><link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,700&display=swap" rel="stylesheet"><script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("tka2_set")).theme||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script></head><body><header class="hd w" id="hd"></header><main class="w" id="app"></main><footer class="ft"><div class="w"><p>Website ini dibuat dan dikelola oleh <b>Putra</b>.</p><p class="so"><a href="https://instagram.com/pthrvx" target="_blank" rel="noopener">Instagram</a><a href="https://github.com/pthrvx" target="_blank" rel="noopener">GitHub</a><a href="https://www.tiktok.com/@pthrvx" target="_blank" rel="noopener">TikTok</a></p><p>© 2026 Putra. Soal dan materi untuk latihan mandiri, bukan soal resmi TKA.</p></div></footer><script>window.M={"id":"antropologi","name":"Antropologi","tl":"Sumber modul: kisi-kisi resmi Pusmendik dan materi latihan buatan.","mods":[{"s":"kisi-kisi-resmi","t":"Kisi-kisi Resmi Antropologi","m":3,"sr":"resmi","h":"<h4>Definisi<\/h4><p>TKA Antropologi memberikan gambaran holistik mengenai kemampuan murid dalam memahami, menganalisis, dan mengaplikasikan antropologi sebagai disiplin keilmuan. Murid diuji pada aspek konseptual dan praktis: menerapkan metode serta cara berpikir antropologis dalam menganalisis problematika sosial dan budaya.<\/p><p>Pada jenjang SMA, pembelajaran antropologi berorientasi pada pengembangan kemampuan murid mengidentifikasi, menelusuri, dan mengungkap makna di balik fenomena sosial budaya. Dalam konteks masyarakat digital dan multikultural, pendekatan antropologi membekali murid dengan prinsip ilmiah untuk memahami dinamika sosial budaya secara holistik.<\/p><h4>Muatan<\/h4><p>Materi merupakan irisan Kurikulum 2013 dan Kurikulum Merdeka:<\/p><ol><li>Pengantar dan Ruang Lingkup Antropologi.<\/li><li>Etnografi.<\/li><li>Masyarakat Multikultural.<\/li><li>Perubahan Sosial Budaya.<\/li><li>Antropologi Sosial dan Antropologi Budaya.<\/li><li>Kearifan Lokal dan Tradisi Lisan.<\/li><\/ol><h4>Kompetensi<\/h4><ol><li>Pemahaman: mengenali, mengingat, memahami konsep dasar antropologi: kebudayaan, sistem sosial, etnografi, perubahan budaya.<\/li><li>Penerapan: menerapkan konsep untuk menganalisis fenomena sosial budaya; menghubungkan teori dengan realitas, mengidentifikasi pola, membandingkan budaya.<\/li><li>Penalaran: merefleksi dan mengevaluasi teori/perspektif antropologi secara kritis; menyusun pemikiran baru; sintesis konsep; interpretasi baru fenomena budaya.<\/li><\/ol><h4>Matriks Asesmen<\/h4><ol><li>Pengantar dan Ruang Lingkup Antropologi<\/li><li>Konsep Dasar dan Sejarah Perkembangan Antropologi: mendeskripsikan dan menganalisis konsep dasar dan sejarah perkembangan antropologi.<\/li><li>Prinsip Dasar dan Pendekatan Antropologi: mengidentifikasi dan menganalisis prinsip dasar untuk menjelaskan fenomena sosial budaya.<\/li><li>Ruang Lingkup (Antropologi Ragawi, Arkeologi, Etnologi Bahasa): menjelaskan dan menganalisis keterkaitan cabang antropologi.<\/li><\/ol><ol><li>Etnografi<\/li><li>Pengertian Etnografi: menjelaskan konsep etnografi sebagai metode penelitian.<\/li><li>Metode dan Proses Penelitian Etnografi: menjelaskan dan menganalisis jenis metode penelitian etnografi.<\/li><li>Pemanfaatan Hasil Penelitian secara Kritis: menganalisis pemanfaatan hasil etnografi.<\/li><li>Penerapan dalam Kehidupan Sehari-hari: menjelaskan penerapan etnografi.<\/li><\/ol><ol><li>Masyarakat Multikultural<\/li><li>Jenis Multikulturalisme: mengidentifikasi dan menganalisis keberagaman Indonesia sebagai masyarakat multikultural.<\/li><li>Multikultural Indonesia dan Global: mendeskripsikan konsep dan jenis multikulturalisme.<\/li><\/ol><ol><li>Perubahan Sosial Budaya<\/li><li>Konsep, Bentuk, Faktor: mendeskripsikan dan menganalisis.<\/li><li>Dampak dan Respon Masyarakat: menjelaskan dan menganalisis.<\/li><\/ol><ol><li>Antropologi Sosial dan Budaya<\/li><li>Pengertian dan Cakupan: memahami ruang lingkup kajian.<\/li><li>Antropologi Terapan dan Studi Kasus: menjelaskan dan menganalisis kajian terapan serta studi kasus.<\/li><\/ol><ol><li>Kearifan Lokal dan Tradisi Lisan<\/li><li>Definisi dan Bentuk Kearifan Lokal: memahami.<\/li><li>Peran Kearifan Lokal: menjelaskan dan menganalisis.<\/li><li>Jenis dan Fungsi Tradisi Lisan: menjelaskan dan menganalisis.<\/li><li>Tantangan di Era Modern: menjelaskan dan menganalisis.<\/li><\/ol><h4>Contoh Soal Resmi<\/h4><p>Konteks: murid mengamati komunitas adat yang melakukan ritual panen turun-temurun dan menolak teknologi pertanian modern.<\/p><p>Soal 1<\/p><ul><li>Kompetensi: mengidentifikasi dan menganalisis prinsip dasar antropologi.<\/li><li>Bentuk soal: PGK Kategori.<\/li><li>Kunci: A. Tepat, B. Tidak Tepat, C. Tepat.<\/li><li>Pertanyaan: pernyataan yang mencerminkan penerapan prinsip dasar antropologi.<\/li><\/ul><p>Konteks: buku etnografi \"Tempat Terbaik di Dunia\" tentang komunitas kolong jembatan Jakarta.<\/p><p>Soal 2<\/p><ul><li>Kompetensi: menjelaskan dan menganalisis jenis metode penelitian etnografi.<\/li><li>Bentuk soal: PGK MCMA.<\/li><li>Kunci: A, B, D.<\/li><li>Pertanyaan: pernyataan yang sesuai prinsip dasar penelitian etnografis.<\/li><\/ul><p>Soal 3<\/p><ul><li>Kompetensi: mengidentifikasi dan menganalisis keberagaman masyarakat Indonesia sebagai multikultural.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: E.<\/li><li>Pertanyaan: contoh penerapan keberagaman multikultural dalam kehidupan sehari-hari.<\/li><\/ul><p>Konteks: tradisi Subak di Bali dan tantangan modernisasi.<\/p><p>Soal 4<\/p><ul><li>Kompetensi: menjelaskan dan menganalisis tantangan kearifan lokal dan tradisi lisan di era modern.<\/li><li>Bentuk soal: PGK Kategori.<\/li><li>Kunci: A. Sesuai, B. Tidak Sesuai, C. Sesuai.<\/li><li>Pertanyaan: fungsi kearifan lokal dalam masyarakat.<\/li><\/ul><p>Konteks: rumah adat Mbaru Niang di NTT dan gotong royong.<\/p><p>Soal 5<\/p><ul><li>Kompetensi: menganalisis studi kasus antropologi terapan.<\/li><li>Bentuk soal: PGK MCMA.<\/li><li>Kunci: A, B, D.<\/li><li>Pertanyaan: bentuk penerapan antropologi sosial dan budaya sebagai antropologi terapan.<\/li><\/ul>"},{"s":"budaya","t":"Budaya","m":3,"sr":"buatan","h":"<p>Budaya adalah keseluruhan sistem gagasan, tindakan, dan karya manusia yang dipelajari serta diwariskan.<\/p>"},{"s":"unsur-budaya","t":"Unsur Budaya","m":3,"sr":"buatan","h":"<p>Unsur budaya: bahasa, pengetahuan, sistem sosial, peralatan hidup, seni, dan religi.<\/p>"},{"s":"globalisasi","t":"Globalisasi","m":3,"sr":"buatan","h":"<p>Globalisasi dapat memperkuat maupun mengikis budaya lokal.<\/p>"}],"qs":[{"q":"<p>Ilmu yang mempelajari manusia dan budayanya adalah …<\/p>","t":"s","o":["Antropologi","Sosiologi","Ekonomi","Geografi","Sejarah"],"a":[0],"e":"Antropologi mempelajari manusia dan budaya.","ks":""},{"q":"<p>Keseluruhan sistem yang dipelajari dan diwariskan disebut …<\/p>","t":"s","o":["Budaya","Ekonomi","Politik","Teknologi","Agama"],"a":[0],"e":"Budaya diwariskan antargenerasi.","ks":""},{"q":"<p>Bahasa termasuk unsur budaya berupa …<\/p>","t":"s","o":["Sistem simbol","Sistem ekonomi","Sistem politik","Teknologi","Religi"],"a":[0],"e":"Bahasa adalah sistem simbol komunikasi.","ks":""},{"q":"<p>Pilih semua unsur budaya.<\/p>","t":"m","o":["Bahasa","Pengetahuan","Seni","Religi","Cuaca"],"a":[0,1,2,3],"e":"Cuaca bukan unsur budaya.","ks":""},{"q":"<p>Pilih semua bentuk keberagaman budaya Indonesia.<\/p>","t":"m","o":["Bahasa daerah","Tarian tradisional","Upacara adat","Makanan khas","Satu bahasa wajib untuk semua"],"a":[0,1,2,3],"e":"Keberagaman mencakup bahasa, seni, adat, dan kuliner.","ks":""},{"q":"<p>Ilmu yang mempelajari manusia dan budaya adalah …<\/p>","t":"s","o":["Ant
