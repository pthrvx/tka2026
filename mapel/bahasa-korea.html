si: menata ulang/mengelompokkan isi teks.<\/li><li>Pemahaman inferensial: menyimpulkan makna tersirat.<\/li><\/ol><h4>Matriks Asesmen<\/h4><ol><li>Pemahaman Literal<\/li><li>Memahami huruf.<\/li><li>Memahami fakta/informasi tersurat pada kalimat/teks sederhana.<\/li><\/ol><ol><li>Reorganisasi<\/li><li>Menyusun urutan kata/kalimat.<\/li><li>Mengkategorikan fakta/informasi.<\/li><\/ol><ol><li>Pemahaman Inferensial<\/li><li>Menyimpulkan fakta/informasi tersirat.<\/li><li>Menyimpulkan sebab-akibat/perbandingan.<\/li><li>Mengaplikasikan tata bahasa negasi, kini, lampau, akan datang.<\/li><\/ol><h4>Contoh Soal Resmi<\/h4><p>Soal 1<\/p><ul><li>Kompetensi: Pemahaman Literal.<\/li><li>Subkompetensi: memahami fakta/informasi tersurat.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: B.<\/li><li>Pertanyaan: 이 메모를 쓴 사람은 누구입니까? (Siapa penulis memo ini?)<\/li><\/ul><p>Soal 2<\/p><ul><li>Kompetensi: Pemahaman Inferensial.<\/li><li>Subkompetensi: menyimpulkan fakta/informasi tersirat.<\/li><li>Bentuk soal: PGK MCMA.<\/li><li>Kunci: A, B.<\/li><li>Pertanyaan: mana kesimpulan yang tepat terkait memo.<\/li><\/ul><p>Soal 3<\/p><ul><li>Kompetensi: Reorganisasi.<\/li><li>Subkompetensi: menyusun urutan kata/kalimat.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: C.<\/li><li>Konteks: paragraf tentang mendengarkan musik.<\/li><\/ul><p>Soal 4<\/p><ul><li>Kompetensi: Pemahaman Literal.<\/li><li>Subkompetensi: memahami fakta/informasi tersurat.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: E.<\/li><li>Konteks: rutinitas harian Minsoo.<\/li><\/ul><p>Soal 5<\/p><ul><li>Kompetensi: Pemahaman Inferensial.<\/li><li>Subkompetensi: menyimpulkan fakta/informasi tersirat.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: C.<\/li><li>Pertanyaan: 밤 9 시에 민수가 한 일은 무엇인가요? (Apa yang Minsoo lakukan pukul 9 malam?)<\/li><\/ul><p>Soal 6<\/p><ul><li>Kompetensi: Pemahaman Literal.<\/li><li>Subkompetensi: memahami fakta/informasi tersurat.<\/li><li>Bentuk soal: PGK Kategori.<\/li><li>Kunci: A. Salah, B. Benar, C. Benar.<\/li><li>Pertanyaan: 그 사람은 한국에 누구와 가고 싶습니까? (Dengan siapa ia ingin ke Korea?)<\/li><li>Pernyataan: 친구들 (teman), 엄마 (ibu), 동생 (adik).<\/li><\/ul>"},{"s":"hangul","t":"Hangul","m":3,"sr":"buatan","h":"<p>Hangul adalah aksara Korea. Terdiri atas konsonan dan vokal.<\/p>"},{"s":"sapaan","t":"Sapaan","m":3,"sr":"buatan","h":"<p>Annyeonghaseyo = halo. Gamsahamnida = terima kasih. Annyeonghi gaseyo = selamat tinggal.<\/p>"},{"s":"kalimat-sederhana","t":"Kalimat Sederhana","m":3,"sr":"buatan","h":"<p>Jeoneun haksaeng-ieyо = saya adalah pelajar.<\/p>"}],"qs":[{"q":"<p>Aksara Korea disebut …<\/p>","t":"s","o":["Hangul","Hiragana","Katakana","Kanji","Pinyin"],"a":[0],"e":"Hangul adalah aksara Korea."},{"q":"<p>“Annyeonghaseyo” berarti …<\/p>","t":"s","o":["Halo","Terima kasih","Maaf","Sampai jumpa","Selamat malam"],"a":[0],"e":"Annyeonghaseyo berarti halo."},{"q":"<p>“Gamsahamnida” berarti …<\/p>","t":"s","o":["Terima kasih","Halo","Maaf","Sampai jumpa","Ya"],"a":[0],"e":"Gamsahamnida berarti terima kasih."},{"q":"<p>PGK. Pilih semua sapaan Korea.<\/p>","t":"m","o":["Annyeonghaseyo","Annyeonghi gaseyo","Gamsahamnida","Mianhamnida","Hello"],"a":[0,1,2,3],"e":"Hello adalah bahasa Inggris."},{"q":"<p>PGK. Pilih semua unsur Hangul.<\/p>","t":"m","o":["Konsonan","Vokal","Suku kata","Aksara","Angka Arab"],"a":[0,1,2],"e":"Angka Arab bukan unsur Hangul."},{"q":"<p>“Jeoneun … imnida” berarti …<\/p>","t":"s","o":["Nama saya …","Saya dari …","Saya suka …","Saya punya …","Saya pergi …"],"a":[0],"e":"Jeoneun … imnida = nama saya."},{"q":"<p>“Eotteoke jinaeseyo?” berarti …<\/p>","t":"s","o":["Apa kabar?","Siapa nama?","Dari mana?","Ke mana?","Berapa umur?"],"a":[0],"e":"Eotteoke jinaeseyo = apa kabar."},{"q":"<p>“Jal jinaeyo” berarti …<\/p>","t":"s","o":["Saya baik","Saya sakit","Saya lelah","Saya lapar","Saya lelah"],"a":[0],"e":"Jal jinaeyo = saya baik."},{"q":"<p>“Joesonghamnida” berarti …<\/p>","t":"s","o":["Maaf","Terima kasih","Ya","Tidak","Selamat tinggal"],"a":[0],"e":"Joesonghamnida = maaf."},{"q"
