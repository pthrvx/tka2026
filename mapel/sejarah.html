<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sejarah | Persiapan TKA</title><link rel="stylesheet" href="../assets/app.css"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet"><script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("tka2_set")).theme||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script></head><body><header class="hd w" id="hd"></header><main class="w" id="app"></main><footer class="ft"><div class="w"><p>Website ini dibuat dan dikelola oleh <b>Putra</b>.</p><p class="so"><a href="https://instagram.com/pthrvx" target="_blank" rel="noopener">Instagram</a><a href="https://github.com/pthrvx" target="_blank" rel="noopener">GitHub</a><a href="https://www.tiktok.com/@pthrvx" target="_blank" rel="noopener">TikTok</a></p><p>© 2026 Putra. Soal dan materi untuk latihan mandiri, bukan soal resmi TKA.</p></div></footer><script>window.M={"id":"sejarah","name":"Sejarah","tl":"Sumber modul: kisi-kisi resmi Pusmendik dan materi latihan buatan.","mods":[{"s":"kisi-kisi-resmi","t":"Kisi-kisi Resmi Sejarah","m":3,"sr":"resmi","h":"<h4>Definisi<\/h4><p>TKA Sejarah bertujuan mengukur kemampuan murid memahami dan mengkaji peristiwa sejarah dalam konteks ruang dan waktu, serta mengembangkan kemampuan berpikir historis: menganalisis, mengkritisi, menghubungkan, menginterpretasi, merefleksikan peristiwa dengan konteks sosial, ekonomi, politik, budaya, dan jiwa zaman.<\/p><p>Fokus: memahami perubahan dan keberlanjutan sejarah, serta sebab-akibat peristiwa penting sejak periode Hindu-Buddha hingga Reformasi.<\/p><h4>Muatan<\/h4><ol><li>Pengantar Ilmu Sejarah.<\/li><li>Periode Kerajaan Hindu-Buddha dan Islam.<\/li><li>Perlawanan terhadap Bangsa Eropa.<\/li><li>Pergerakan Nasional sampai Proklamasi Kemerdekaan.<\/li><li>Revolusi Kemerdekaan Indonesia sampai Demokrasi Terpimpin.<\/li><li>Orde Baru sampai Reformasi.<\/li><\/ol><p>Karakteristik soal: menggunakan bacaan/ilustrasi berbasis sumber primer/sekunder (dokumen, peta, tabel, foto) untuk analisis kronologi, sebab-akibat, kesinambungan-perubahan.<\/p><h4>Kompetensi<\/h4><ol><li>Pemahaman: mengenali, mengingat, mengidentifikasi konsep dan informasi sejarah faktual; tokoh, peristiwa, tanggal, tempat, istilah.<\/li><li>Penerapan: menganalisis, menginterpretasi data/fakta/sumber, menyusun kronologi, menjelaskan sebab-akibat, membandingkan peristiwa.<\/li><li>Penalaran: berpikir kritis, mengevaluasi, merefleksikan sumber, menjawab inferensial, menyusun argumentasi berbasis bukti.<\/li><\/ol><h4>Matriks Asesmen<\/h4><ol><li>Pengantar Ilmu Sejarah<\/li><li>Konsep dasar sejarah: perubahan, keberlanjutan, sebab-akibat.<\/li><li>Fenomena sejarah dalam kehidupan sehari-hari.<\/li><li>Sumber sejarah: fungsi dan perbedaan primer vs sekunder.<\/li><\/ol><ol><li>Periode Kerajaan Hindu-Buddha dan Islam<\/li><li>Kehidupan religi, budaya, politik, ekonomi masa Hindu-Buddha.<\/li><li>Kehidupan religi, budaya, politik, ekonomi masa kerajaan Islam.<\/li><\/ol><ol><li>Perlawanan terhadap Bangsa Eropa<\/li><li>Proses kedatangan bangsa Eropa.<\/li><li>Perlawanan sebelum abad ke-20.<\/li><\/ol><ol><li>Pergerakan Nasional sampai Proklamasi<\/li><li>Pergerakan Nasional Indonesia.<\/li><li>Relevansi semangat pergerakan dengan masa kini.<\/li><li>Pendudukan Jepang dan perlawanan.<\/li><li>Peristiwa dan makna Proklamasi.<\/li><\/ol><ol><li>Revolusi sampai Demokrasi Terpimpin<\/li><li>Perjuangan mempertahankan kemerdekaan.<\/li><li>Masa Demokrasi Liberal.<\/li><li>Masa Demokrasi Terpimpin.<\/li><\/ol><ol><li>Orde Baru sampai Reformasi<\/li><li>Masa Orde Baru.<\/li><li>Masa Reformasi.<\/li><\/ol><h4>Contoh Soal Resmi<\/h4><p>Soal 1<\/p><ul><li>Konteks: definisi sejarah R. Moh. Ali.<\/li><li>Kompetensi: menjelaskan dan menganalisis konsep perubahan, keberlanjutan, sebab-akibat.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: B.<\/li><li>Pertanyaan: ciri utama sejarah sebagai ilmu.<\/li><\/ul><p>Soal 2<\/p><ul><li>Konteks: kerajaan Islam Indonesia.<\/li><li>Kompetensi: menganalisis hubungan masuknya Islam dengan perubahan politik, ekonomi, budaya.<\/li><li>Bentuk soal: PGK MCMA.<\/li><li>Kunci: B, C.<\/li><li>Pertanyaan: peninggalan budaya kerajaan Islam yang masih berlanjut.<\/li><\/ul><p>Soal 3<\/p><ul><li>Konteks: konflik Gowa vs VOC, Perjanjian Bongaya 1667.<\/li><li>Kompetensi: menganalisis kebijakan kolonial dan perlawanan rakyat sebelum abad ke-20.<\/li><li>Bentuk soal: PGK Kategori.<\/li><li>Kunci: Tepat, Tidak Tepat, Tepat.<\/li><\/ul><p>Soal 4<\/p><ul><li>Konteks: BPUPK dan janji kemerdekaan Jepang.<\/li><li>Kompetensi: menjelaskan dan menganalisis peristiwa proklamasi dan maknanya.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: E.<\/li><li>Pertanyaan: alasan paling tepat Jepang membentuk BPUPK.<\/li><\/ul><p>Soal 5<\/p><ul><li>Konteks: Pemilu 1955 masa Demokrasi Liberal.<\/li><li>Kompetensi: menggunakan konsep kronologis untuk menjelaskan perkembangan politik-ekonomi.<\/li><li>Bentuk soal: PGK Kategori.<\/li><li>Kunci: Tepat, Tidak Tepat, Tepat.<\/li><\/ul><p>Soal 6<\/p><ul><li>Konteks: krisis multidimensi dan Reformasi 1998.<\/li><li>Kompetensi: menganalisis proses lahirnya Reformasi dan peran pelajar/mahasiswa.<\/li><li>Bentuk soal: PGK MCMA.<\/li><li>Kunci: A, C, D.<\/li><li>Pertanyaan: faktor utama penyebab lahirnya Reformasi.<\/li><\/ul>"},{"s":"sumber-sejarah","t":"Sumber Sejarah","m":3,"sr":"buatan","h":"<p>Sumber primer berasal langsung dari masa peristiwa; sumber sekunder merupakan interpretasi.<\/p>"},{"s":"kerajaan-nusantara","t":"Kerajaan Nusantara","m":3,"sr":"buatan","h":"<p>Kerajaan Hindu-Buddha: Kutai, Sriwijaya, Majapahit. Kerajaan Islam: Demak, Aceh, Banten, Gowa-Tallo.<\/p>"},{"s":"kemerdekaan","t":"Kemerdekaan","m":3,"sr":"buatan","h":"<p>Proklamasi dibacakan 17 Agustus 1945. Setelahnya terjadi perang kemerdekaan dan pembentukan n
