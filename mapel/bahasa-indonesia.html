<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bahasa Indonesia | Persiapan TKA</title><link rel="stylesheet" href="../assets/app.css?v=1792139313"><link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,700&display=swap" rel="stylesheet"><script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("tka2_set")).theme||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script></head><body><header class="hd w" id="hd"></header><main class="w" id="app"></main><footer class="ft"><div class="w"><p>Website ini dibuat dan dikelola oleh <b>Putra</b>.</p><p class="so"><a href="https://instagram.com/pthrvx" target="_blank" rel="noopener">Instagram</a><a href="https://github.com/pthrvx" target="_blank" rel="noopener">GitHub</a><a href="https://www.tiktok.com/@pthrvx" target="_blank" rel="noopener">TikTok</a></p><p>© 2026 Putra. Soal dan materi untuk latihan mandiri, bukan soal resmi TKA.</p></div></footer><script>window.M={"id":"bahasa-indonesia","name":"Bahasa Indonesia","tl":"Sumber modul: kisi-kisi resmi Pusmendik dan materi latihan buatan.","mods":[{"s":"kisi-kisi-resmi","t":"Kisi-kisi Resmi Bahasa Indonesia","m":3,"sr":"resmi","h":"<h4>Definisi<\/h4><p>TKA Bahasa Indonesia mengukur keterampilan membaca pada teks informasi tunggal maupun jamak serta teks fiksi.<\/p><h4>Muatan<\/h4><p>Keterampilan membaca diujikan pada dua jenis teks:<\/p><ol><li>Teks informasi tunggal maupun jamak.<\/li><li>Teks fiksi.<\/li><\/ol><p>Teks informasi berisi fakta, konsep, prosedur, dan metakognisi dari berbagai bidang, genre, dan konteks pada skala lokal, nasional, dan global.<\/p><p>Teks fiksi dapat berupa realisme atau absurd, dengan latar cerita konkret atau abstrak, tokoh dengan karakter bulat, konflik tunggal atau jamak dengan penyelesaian terbuka, alur campuran, dan sudut pandang campuran.<\/p><p>Karakteristik teks:<\/p><ul><li>Kosakata: kata khusus dan umum, kata berimbuhan kompleks, kata abstrak, makna denotatif, istilah teknis, konotatif konteks luas.<\/li><li>Kalimat: 8–12 kata per kalimat, kalimat kompleks berbagai pola, dan kalimat inversi.<\/li><li>Wacana: konjungsi antarparagraf makna pertentangan dan sebab-akibat, tanda baca pendukung makna, panjang teks 250–300 kata kecuali puisi.<\/li><\/ul><h4>Kompetensi<\/h4><p>Aspek keterampilan membaca yang diukur:<\/p><ol><li>Mengidentifikasi informasi tersurat dalam teks.<\/li><li>Menyusun ulang, mengelompokkan, membuat ikhtisar, dan menyajikan kembali informasi tersurat.<\/li><li>Mengidentifikasi dan menyimpulkan informasi tersirat.<\/li><li>Menilai gagasan, fakta, atau opini dalam teks.<\/li><li>Menanggapi isi teks, mengidentifikasi diri dengan tokoh atau kejadian, dan menanggapi bahasa penulis.<\/li><\/ol><p>Tiga kompetensi utama:<\/p><ol><li>Pemahaman tekstual: memahami informasi eksplisit, mengelompokkan, menyusun ulang, dan menyajikan kembali informasi.<\/li><li>Pemahaman inferensial: menarik kesimpulan berdasarkan informasi tersirat.<\/li><li>Evaluasi dan apresiasi: menilai ide, menanggapi teks secara emosional dan estetis, serta mempertimbangkan penggunaan bahasa penulis.<\/li><\/ol><h4>Matriks Asesmen<\/h4><ol><li>Pemahaman Tekstual<\/li><li>Mengidentifikasi penggunaan kata serapan dari bahasa daerah/asing.<\/li><li>Mengidentifikasi latar, karakter, dan/atau fenomena berdasarkan kosakata.<\/li><li>Menyusun kerangka atau bagan berdasarkan bagian penting teks.<\/li><\/ol><ol><li>Pemahaman Inferensial<\/li><li>Menyimpulkan ide pokok, gagasan pendukung, tokoh, peristiwa, latar, konflik, atau nilai-nilai.<\/li><li>Menjelaskan hubungan makna antarkalimat dan/atau antarparagraf.<\/li><li>Memprediksi lanjutan atau akhir uraian/cerita.<\/li><\/ol><ol><li>Evaluasi dan Apresiasi<\/li><li>Menilai relevansi peristiwa dengan kehidupan sehari-hari.<\/li><li>Menilai keakuratan, kesesuaian, kecukupan, atau ketepatan informasi.<\/li><li>Menilai ketepatan dan kesesuaian penggunaan bahasa.<\/li><li>Menilai ketepatan bagian teks untuk menggambarkan karakter, peristiwa, atau latar.<\/li><li>Menyimpulkan respons emosional terhadap puisi, prosa, dan drama.<\/li><\/ol><h4>Contoh Soal Resmi<\/h4><p>Bentuk soal yang digunakan:<\/p><ul><li>Pilihan Ganda (PG)<\/li><li>PGK MCMA: pilih lebih dari satu jawaban benar<\/li><li>PGK Kategori: menentukan Benar/Salah atau kategori<\/li><\/ul><p>Contoh kompetensi dan bentuk soal:<\/p><ol><li>Pemahaman Tekstual — PG — mengidentifikasi makna istilah “mobilisasi”.<\/li><li>Pemahaman Inferensial — PG — menentukan gagasan utama paragraf pertama.<\/li><li>Pemahaman Literal — PGK MCMA — menjelaskan mengapa lautan menghadapi ancaman pada 2050; kunci lebih dari satu.<\/li><li>Evaluasi dan Apresiasi — PGK Kategori — menilai alasan penggunaan kalimat “Solusi tersebut tidak mudah.”<\/li><li>Pemahaman Inferensial — PGK Kategori — menentukan permasalahan tokoh “aku”.<\/li><li>Pemahaman Inferensial — PGK MCMA — memprediksi akibat jika tokoh tidak datang ke rumah iyye.<\/li><li>Evaluasi dan Apresiasi — PG — menilai keterkaitan nilai sosial dengan kehidupan sehari-hari.<\/li><li>Pemahaman Inferensial — PG — menentukan tujuan penulis teks tentang Rhodamin B.<\/li><li>Pemahaman Inferensial — PG — menentukan pernyataan yang sesuai kedua teks.<\/li><li>Evaluasi dan Apresiasi — PGK MCMA — menilai alasan penyebutan dampak kesehatan.<\/li><li>Pemahaman Tekstual — PG — menyusun bagan bagian penting teks ekonomi digital.<\/li><li>Pemahaman Inferensial — PGK Kategori — menilai pola pengembangan paragraf.<\/li><li>Evaluasi dan Apresiasi — PGK Kategori — menilai keakuratan informasi berdasarkan pendapat pembaca.<\/li><li>Pemahaman Tekstual — PG — mengidentifikasi makna kata serapan “boyongan”.<\/li><li>Pemahaman Inferensial — PGK Kategori — memprediksi peristiwa yang mungkin terjadi.<\/li><\/ol>"},{"s":"ide-pokok-dan-gagasan-pendukung","t":"Ide Pokok dan Gagasan Pendukung","m":3,"sr":"buatan","h":"<h4>Mulai dari kasus<\/h4><p>Kamu membaca paragraf ini: \"Sejak Agustus, sekolah kami mengganti botol plastik dengan tumbler. Dalam sebulan, sampah plastik turun 40 persen. Kantin juga memberi diskon bagi siswa yang membawa tumbler.\" Kalau ditanya \"paragraf ini tentang apa?\", jawabanmu adalah ide pokoknya.<\/p><h4>Cara menemukan ide pokok<\/h4><ol><li>Baca seluruh paragraf sekali tanpa berhenti.<\/li><li>Cari kalimat yang bisa berdiri sendiri dan mewakili isi (kalimat utama).<\/li><li>Uji: kalimat lain hanya menjelaskan, memberi contoh, atau menambah data untuk kalimat itu.<\/li><\/ol><p>Pada contoh, kalimat pertama adalah kalimat utama. Ide pokoknya: sekolah mengurangi sampah plastik dengan tumbler. Data 40 persen dan diskon kantin adalah gagasan pendukung.<\/p><h4>Letak kalimat utama<\/h4><ul><li>Di awal paragraf (deduktif): inti dulu, lalu penjelasan.<\/li><li>Di akhir paragraf (induktif): rincian dulu, lalu simpulan.<\/li><li>Di awal dan akhir (campuran): inti dinyatakan, dijelaskan, lalu ditegaskan.<\/li><\/ul><h4>Kesalahan yang sering terjadi<\/h4><ul><li>Memilih kalimat yang paling menarik, bukan yang paling mewakili isi.<\/li><li>Memilih detail (angka atau nama) sebagai ide pokok.<\/li><li>Membuat ide pokok terlalu luas (\"tentang lingkungan\") atau terlalu sempit (\"diskon di kantin\").<\/li><\/ul><h4>Cek pemahaman<\/h4><p>Ide pokok yang baik menjawab siapa melakukan apa dan untuk apa: \"Sekolah mengurangi sampah plastik lewat kebiasaan membawa tumbler.\"<\/p>"},{"s":"fakta-dan-opini","t":"Fakta dan Opini","m":3,"sr":"buatan","h":"<h4>Mulai dari kasus<\/h4><p>Dua kalimat tentang satu kafe. (1) \"Kafe ini buka pukul 08.00 sampai 22.00.\" (2) \"Kafe ini tempat nongkrong terbaik di kota.\" Mana yang bisa dicek dengan bukti? Kalimat (1). Itu fakta. Kalimat (2) adalah opini.<\/p><h4>Cara membedakan<\/h4><ul><li>Fakta dapat dibuktikan dengan data, tanggal, jumlah, atau kejadian nyata.<\/li><li>Opini adalah pendapat atau penilaian, jawabannya bergantung pada orang yang menilai.<\/li><\/ul><p>Uji cepat: tanyakan \"Adakah cara memeriksanya dengan bukti?\" Jika ada, fakta. Jika jawabannya \"tergantung orangnya\", opini.<\/p><h4>Kata penanda opini<\/h4><p>Seharusnya, sebaiknya, perlu, terbaik, indah, menurut saya, mungkin, tampaknya.<\/p><h4>Hati-hati dengan angka<\/h4><p>Angka tidak otomatis membuat kalimat menjadi fakta. \"Harga Rp50.000 itu terlalu mahal\" tetap opini, karena \"terlalu mahal\" adalah penilaian.<\/p><h4>Kesalahan yang sering terjadi<\/h4><ul><li>Menganggap semua kalimat bernada kuat sebagai opini.<\/li><li>Menganggap kalimat yang berisi angka pasti fakta.<\/li><li>Tidak memperhatikan kata penilai seperti \"terbaik\" atau \"seharusnya\".<\/li><\/ul><h4>Cek pemahaman<\/h4><p>\"Perpustakaan menambah 200 buku baru bulan ini\" adalah fakta. \"Perpustakaan sebaiknya menambah buku fiksi\" adalah opini.<\/p>"},{"s":"makna-kata-dan-ungkapan","t":"Makna Kata dan Ungkapan","m":3,"sr":"buatan","h":"<p>Makna kata harus disesuaikan dengan konteks kalimat.<\/p><p>Contoh:<br>“Pemerintah memberikan insentif bagi pengguna energi terbarukan.”<br>Kata insentif berarti dorongan atau bantuan.<\/p>"},{"s":"informasi-tersurat-dan-tersirat","t":"Informasi Tersurat dan Tersirat","m":3,"sr":"buatan","h":"<p>Informasi tersurat tertulis langsung. Informasi tersirat harus disimpulkan dari petunjuk teks.<\/p><p>Contoh:<br>“Andi membawa payung meskipun langit cerah.”<br>Informasi tersirat: Andi menduga hujan akan turun.<\/p>"},{"s":"menyimpulkan-teks","t":"Menyimpulkan Teks","m":3,"sr":"buatan","h":"<p>Simpulan harus didukung isi teks, tidak bertentangan dengan teks, dan tidak berlebihan. Hindari kata “semua”, “selalu”, atau “tidak pernah” kecuali teks menyatakannya.<\/p>"},{"s":"teks-eksposisi-dan-argumentasi","t":"Teks Eksposisi dan Argumentasi","m":3,"sr":"buatan","h":"<p>Teks eksposisi memaparkan informasi. Teks argumentasi bertujuan meyakinkan pembaca.<\/p><p>Struktur teks argumentasi:<\/p><ol><li>Tesis<\/li><li>Argumen dan bukti<\/li><li>Penegasan ulang<\/li><\/ol>"},{"s":"kalimat-efektif-dan-kata-baku","t":"Kalimat Efektif dan Kata Baku","m":3,"sr":"buatan","h":"<p>Kalimat efektif jelas, hemat kata, logis, dan tidak ambigu.<\/p><p>Kata tidak baku → kata baku:<br>apotik → apotek<br>praktek → praktik<br>resiko → risiko<br>nomor telpon → nomor telepon<\/p>"}],"qs":[{"q":"<p>Ide pokok paragraf biasanya bersifat …<\/p>","t":"s","o":["Sangat rinci","Umum dan mewakili isi paragraf","Selalu berada di akhir teks","Tidak berkaitan dengan isi teks","Berupa contoh kecil"],"a":[1],"e":"Ide pokok adalah gagasan utama yang mewakili isi paragraf.","ks":""},{"q":"<p>Pernyataan berikut yang merupakan fakta adalah …<\/p>","t":"s","o":["Menurut saya, buku itu menarik.","Sepertinya hujan akan turun.","Indonesia merdeka pada 17 Agustus 1945.","Sebaiknya siswa belajar lebih giat.","Konser itu sangat membosankan."],"a":[2],"e":"Tanggal kemerdekaan Indonesia merupakan fakta sejarah.","ks":""},{"q":"<p>Makna kata “insentif” adalah …<\/p>","t":"s","o":["Hambatan","Larangan","Dorongan atau bantuan","Penolakan","Pengurangan"],"a":[2],"e":"Insentif berarti dorongan, reward, atau bantuan.","ks":""},{"q":"<p>“Rina membawa payung meskipun langit cerah.” Informasi tersirat kalimat tersebut adalah …<\/p>","t":"s","o":["Rina tidak membawa payung.","Rina menduga hujan akan turun.","Langit sedang hujan.","Rina menjual payung.","Payung Rina rusak."],"a":[1],"e":"Kata “meskipun” menunjukkan Rina membawa payung sebagai antisipasi hujan.","ks":""},{"q":"<p>Simpulan yang tepat harus …<\/p>","t":"s","o":["Bertentangan dengan teks","Didukung oleh isi teks","Lebih ekstrem dari isi teks","Hanya berdasarkan opini pembaca","Tidak berkaitan dengan teks"],"a":[1],"e":"Simpulan harus berdasarkan bukti dalam teks.","ks":""},{"q":"<p>Teks yang bertujuan meyakinkan pembaca dengan alasan dan bukti disebut teks …<\/p>","t":"s","o":["Narasi","Deskripsi","Argumentasi","Prosedur","Laporan"],"a":[2],"e":"Teks argumentasi memuat tesis, argumen, dan penegasan ulang.","ks":""},{"q":"<p>Kata baku dari “praktek” adalah …<\/p>","t":"s","o":["Praktek","Praktik","Prakteknya","Peraktek","Praktis"],"a":[1],"e":"Bentuk baku yang benar adalah “praktik”.","ks":""},{"q":"<p>Kalimat efektif berikut adalah …<\/p>","t":"s","o":["Para siswa-siswa harus datang.","Banyak anak-anak bermain.","Semua siswa wajib mengikuti upacara.","Kegiatan dilaksanakan oleh panitia panitia.","Para hadirin dimohon masuk secara tertib."],"a":[2],"e":"Kalimat efektif tidak menggunakan kata yang berulang atau berlebihan.","ks":""},{"q":"<p>Makna ungkapan “menarik benang merah” adalah …<\/p>","t":"s","o":["Menyimpulkan inti pembicaraan","Membuat benang panjang","Menghentikan pembicaraan","Menambah masalah","Menyembunyikan fakta"],"a":[0],"e":"Ungkapan tersebut berarti menarik kesimpulan atau inti pembicaraan.","ks":""},{"q":"<p>Bagian teks argumentasi yang berisi alasan dan bukti disebut …<\/p>","t":"s","o":["Tesis","Argumen","Penegasan ulang","Abstrak","Simpulan"],"a":[1],"e":"Argumen berisi alasan, data, fakta, atau contoh pendukung.","ks":""},{"q":"<p>Teks yang berisi langkah-langkah melakukan sesuatu disebut teks …<\/p>","t":"s","o":["Narasi","Prosedur","Deskripsi","Eksposisi","Argumentasi"],"a":[1],"e":"Teks prosedur memuat urutan langkah.","ks":""},{"q":"<p>Pilih semua pernyataan yang merupakan opini.<\/p>","t":"m","o":["Buku ini sangat menarik.","Indonesia memiliki ibu kota bernama Jakarta.","Sebaiknya siswa membiasakan membaca.","Air mendidih pada 100°C pada tekanan 1 atm.","Menurut saya, belajar daring lebih efektif."],"a":[0,2,4],"e":"Pilihan A, C, dan E memuat penilaian atau pendapat. Pilihan B dan D merupakan fakta.","ks":"Kamu menjadi editor majalah sekolah. Seorang siswa mengirim ulasan buku, dan tugasmu memisahkan kalimat yang berisi pendapat penulis dari kalimat yang berisi fakta."},{"q":"<p>Pilih semua ciri ide pokok.<\/p>","t":"m","o":["Bersifat umum","Mewakili isi paragraf","Selalu berupa contoh","Dapat berada di awal, tengah, atau akhir paragraf","Selalu lebih rinci daripada gagasan pendukung"],"a":[0,1,3],"e":"Ide pokok bersifat umum, mewakili paragraf, dan posisinya dapat bervariasi.","ks":"Bu Sari meminta kelompokmu menandai ide pokok di setiap paragraf artikel tentang daur ulang sampah. Salah satu temanmu bingung, kalimat seperti apa yang disebut ide pokok."},{"q":"<p>Pilih semua kalimat yang efektif.<\/p>","t":"m","o":["Para siswa-siswa berkumpul di lapangan.","Semua peserta wajib hadir tepat waktu.","Kegiatan itu dilaksanakan oleh panitia panitia.","Buku itu dibaca oleh banyak siswa.","Para nelayan-nelayan melaut pagi hari."],"a":[1,3],"e":"Kalimat efektif menghindari pengulangan kata.","ks":"Panitia lomba menulis pengumuman untuk mading sekolah. Pengumuman harus singkat dan jelas, tanpa kata yang berlebihan."},{"q":"<p>Pilih semua informasi yang termasuk fakta.<\/p>","t":"m","o":["Indonesia merdeka pada 17 Agustus 1945.","Buku ini adalah yang terbaik.","Air memiliki rumus kimia H2O.","Menurut saya, sekolah harus menambah jam olahraga.","Bumi mengelilingi Matahari."],"a":[0,2,4],"e":"Pilihan A, C, dan E dapat dibuktikan secara objektif.","ks":"Kamu menyusun laporan perpustakaan, dan hanya informasi yang bisa dibuktikan yang boleh dimasukkan ke dalam laporan."},{"q":"<p>Di media sosial kamu menemukan iklan: \"Obat herbal ini 100% menyembuhkan semua penyakit dalam 3 hari, tanpa efek samping, dan sudah dipakai jutaan orang!\" Sikap pembaca kritis yang paling tepat adalah …<\/p>","t":"s","o":["Langsung percaya karena sudah banyak yang memakai.","Memeriksa bukti klaimnya, misalnya izin edar BPOM dan hasil penelitian.","Membagikan iklan ke grup keluarga agar yang lain tahu.","Menolaknya karena semua iklan pasti bohong.","Menunggu teman mencoba lebih dulu."],"a":[1],"e":"Klaim yang absolut (\"100%\", \"semua penyakit\", \"tanpa efek samping\") perlu dibuktikan. Pembaca kritis memeriksa sumber dan bukti sebelum percaya atau membagikan. Menolak tanpa memeriksa juga bukan sikap kritis.","k":"Kasus","im":"","alt":""},{"q":"<p>Pengurus OSIS menulis laporan: \"Sejak Agustus, sekolah mengganti botol plastik sekali pakai dengan tumbler. Dalam sebulan, sampah plastik turun 40 persen. Kantin juga memberi diskon bagi siswa yang membawa tumbler sendiri.\" Ide pokok paragraf tersebut adalah …<\/p>","t":"s","o":["Kantin memberi diskon kepada siswa.","Sampah plastik turun 40 persen dalam sebulan.","Sekolah mengurangi sampah plastik dengan kebiasaan membawa tumbler.","Sekolah melarang semua botol plastik.","Siswa lebih suka membawa tumbler."],"a":[2],"e":"Kalimat pertama mewakili isi paragraf. Data 40 persen dan diskon kantin hanya mendukungnya. Pilihan A dan B adalah detail, sedangkan D dan E tidak disebut dalam teks.","k":"Kasus","im":"","alt":""},{"q":"<p>Kamu sakit dan harus mengajukan izin tidak masuk sekolah lewat surel kepada wali kelas. Kalimat pembuka yang paling tepat adalah …<\/p>","t":"s","o":["\"Pak, aku nggak masuk ya hari ini.\"","\"Halo Pak, aku sakit nih, izin dulu.\"","\"Hai Pak Budi, saya izin ya.\"","\"Yth. Bapak Budi, dengan hormat saya memberitahukan bahwa saya tidak dapat mengikuti pelajaran hari ini karena sakit.\"","\"Pak Budi, bales dong, aku sakit.\""],"a":[3],"e":"Surel kepada guru memakai ragam resmi: sapaan hormat (Yth.), kata baku (saya), dan alasan yang jelas. Pilihan lain memakai bahasa percakapan atau terlalu singkat.","k":"Kasus","im":"","alt":""}]}</script><script src="../assets/catalog.js?v=1792139313"></script><script src="../assets/app.js?v=1792139313"></script></body></html>
