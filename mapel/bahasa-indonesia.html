<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bahasa Indonesia | Persiapan TKA</title><link rel="stylesheet" href="../assets/app.css"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet"><script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("tka2_set")).theme||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script></head><body><header class="hd w" id="hd"></header><main class="w" id="app"></main><footer class="ft"><div class="w"><p>Website ini dibuat dan dikelola oleh <b>Putra</b>.</p><p class="so"><a href="https://instagram.com/pthrvx" target="_blank" rel="noopener">Instagram</a><a href="https://github.com/pthrvx" target="_blank" rel="noopener">GitHub</a><a href="https://www.tiktok.com/@pthrvx" target="_blank" rel="noopener">TikTok</a></p><p>© 2026 Putra. Soal dan materi untuk latihan mandiri, bukan soal resmi TKA.</p></div></footer><script>window.M={"id":"bahasa-indonesia","name":"Bahasa Indonesia","tl":"Sumber modul: kisi-kisi resmi Pusmendik dan materi latihan buatan.","mods":[{"s":"kisi-kisi-resmi","t":"Kisi-kisi Resmi Bahasa Indonesia","m":3,"sr":"resmi","h":"<h4>Definisi<\/h4><p>TKA Bahasa Indonesia mengukur keterampilan membaca pada teks informasi tunggal maupun jamak serta teks fiksi.<\/p><h4>Muatan<\/h4><p>Keterampilan membaca diujikan pada dua jenis teks:<\/p><ol><li>Teks informasi tunggal maupun jamak.<\/li><li>Teks fiksi.<\/li><\/ol><p>Teks informasi berisi fakta, konsep, prosedur, dan metakognisi dari berbagai bidang, genre, dan konteks pada skala lokal, nasional, dan global.<\/p><p>Teks fiksi dapat berupa realisme atau absurd, dengan latar cerita konkret atau abstrak, tokoh dengan karakter bulat, konflik tunggal atau jamak dengan penyelesaian terbuka, alur campuran, dan sudut pandang campuran.<\/p><p>Karakteristik teks:<\/p><ul><li>Kosakata: kata khusus dan umum, kata berimbuhan kompleks, kata abstrak, makna denotatif, istilah teknis, konotatif konteks luas.<\/li><li>Kalimat: 8–12 kata per kalimat, kalimat kompleks berbagai pola, dan kalimat inversi.<\/li><li>Wacana: konjungsi antarparagraf makna pertentangan dan sebab-akibat, tanda baca pendukung makna, panjang teks 250–300 kata kecuali puisi.<\/li><\/ul><h4>Kompetensi<\/h4><p>Aspek keterampilan membaca yang diukur:<\/p><ol><li>Mengidentifikasi informasi tersurat dalam teks.<\/li><li>Menyusun ulang, mengelompokkan, membuat ikhtisar, dan menyajikan kembali informasi tersurat.<\/li><li>Mengidentifikasi dan menyimpulkan informasi tersirat.<\/li><li>Menilai gagasan, fakta, atau opini dalam teks.<\/li><li>Menanggapi isi teks, mengidentifikasi diri dengan tokoh atau kejadian, dan menanggapi bahasa penulis.<\/li><\/ol><p>Tiga kompetensi utama:<\/p><ol><li>Pemahaman tekstual: memahami informasi eksplisit, mengelompokkan, menyusun ulang, dan menyajikan kembali informasi.<\/li><li>Pemahaman inferensial: menarik kesimpulan berdasarkan informasi tersirat.<\/li><li>Evaluasi dan apresiasi: menilai ide, menanggapi teks secara emosional dan estetis, serta mempertimbangkan penggunaan bahasa penulis.<\/li><\/ol><h4>Matriks Asesmen<\/h4><ol><li>Pemahaman Tekstual<\/li><li>Mengidentifikasi penggunaan kata serapan dari bahasa daerah/asing.<\/li><li>Mengidentifikasi latar, karakter, dan/atau fenomena berdasarkan kosakata.<\/li><li>Menyusun kerangka atau bagan berdasarkan bagian penting teks.<\/li><\/ol><ol><li>Pemahaman Inferensial<\/li><li>Menyimpulkan ide pokok, gagasan pendukung, tokoh, peristiwa, latar, konflik, atau nilai-nilai.<\/li><li>Menjelaskan hubungan makna antarkalimat dan/atau antarparagraf.<\/li><li>Memprediksi lanjutan atau akhir uraian/cerita.<\/li><\/ol><ol><li>Evaluasi dan Apresiasi<\/li><li>Menilai relevansi peristiwa dengan kehidupan sehari-hari.<\/li><li>Menilai keakuratan, kesesuaian, kecukupan, atau ketepatan informasi.<\/li><li>Menilai ketepatan dan kesesuaian penggunaan bahasa.<\/li><li>Menilai ketepatan bagian teks untuk menggambarkan karakter, peristiwa, atau latar.<\/li><li>Menyimpulkan respons emosional terhadap puisi, prosa, dan drama.<\/li><\/ol><h4>Contoh Soal Resmi<\/h4><p>Bentuk soal yang digunakan:<\/p><ul><li>Pilihan Ganda (PG)<\/li><li>PGK MCMA: pilih lebih dari satu jawaban benar<\/li><li>PGK Kategori: menentukan Benar/Salah atau kategori<\/li><\/ul><p>Contoh kompetensi dan bentuk soal:<\/p><ol><li>Pemahaman Tekstual — PG — mengidentifikasi makna istilah “mobilisasi”.<\/li><li>Pemahaman Inferensial — PG — menentukan gagasan utama paragraf pertama.<\/li><li>Pemahaman Literal — PGK MCMA — menjelaskan mengapa lautan menghadapi ancaman pada 2050; kunci lebih dari satu.<\/li><li>Evaluasi dan Apresiasi — PGK Kategori — menilai alasan penggunaan kalimat “Solusi tersebut tidak mudah.”<\/li><li>Pemahaman Inferensial — PGK Kategori — menentukan permasalahan tokoh “aku”.<\/li><li>Pemahaman Inferensial — PGK MCMA — memprediksi akibat jika tokoh tidak datang ke rumah iyye.<\/li><li>Evaluasi dan Apresiasi — PG — menilai keterkaitan nilai sosial dengan kehidupan sehari-hari.<\/li><li>Pemahaman Inferensial — PG — menentukan tujuan penulis teks tentang Rhodamin B.<\/li><li>Pemahaman Inferensial — PG — menentukan pernyataan yang sesuai kedua teks.<\/li><li>Evaluasi dan Apresiasi — PGK MCMA — menilai alasan penyebutan dampak kesehatan.<\/li><li>Pemahaman Tekstual — PG — menyusun bagan bagian penting teks ekonomi digital.<\/li><li>Pemahaman Inferensial — PGK Kategori — menilai pola pengembangan paragraf.<\/li><li>Evaluasi dan Apresiasi — PGK Kategori — menilai keakuratan informasi berdasarkan pendapat pembaca.<\/li><li>Pemahaman Tekstual — PG — mengidentifikasi makna kata serapan “boyongan”.<\/li><li>Pemahaman Inferensial — PGK Kategori — memprediksi peristiwa yang mungkin terjadi.<\/li><\/ol>"},{"s":"ide-pokok-dan-gagasan-pendukung","t":"Ide Pokok dan Gagasan Pendukung","m":3,"sr":"buatan","h":"<p>Ide pokok adalah gagasan utama paragraf. Gagasan pendukung berisi penjelasan, contoh, data, atau alasan.<\/p><p>Contoh:<br>“Sampah plastik masih menjadi masalah utama di kota. Banyak warga belum memilah sampah dan fasilitas daur ulang masih terbatas.”<\/p><p>Ide pokok: sampah plastik masih menjadi masalah utama.<br>Gagasan pendukung: warga belum memilah sampah dan fasilitas daur ulang terbatas.<\/p>"},{"s":"fakta-dan-opini","t":"Fakta dan Opini","m":3,"sr":"buatan","h":"<p>Fakta dapat dibuktikan kebenarannya. Opini adalah pendapat atau penilaian seseorang.<\/p><p>Fakta: Indonesia merdeka pada 17 Agustus 1945.<br>Opini: Menurut saya, buku itu sangat menarik.<\/p><p>Kata penanda opini: menurut saya, sebaiknya, seharusnya, sepertinya, patut, layak.<\/p>"},{"s":"makna-kata-dan-ungkapan","t":"Makna Kata dan Ungkapan","m":3,"sr":"buatan","h":"<p>Makna kata harus disesuaikan dengan konteks kalimat.<\/p><p>Contoh:<br>“Pemerintah memberikan insentif bagi pengguna energi terbarukan.”<br>Kata insentif berarti dorongan atau bantuan.<\/p>"},{"s":"informasi-tersurat-dan-tersirat","t":"Informasi Tersurat dan Tersirat","m":3,"sr":"buatan","h":"<p>Informasi tersurat tertulis langsung. Informasi tersirat harus disimpulkan dari petunjuk teks.<\/p><p>Contoh:<br>“Andi membawa payung meskipun langit cerah.”<br>Informasi tersirat: Andi menduga hujan akan turun.<\/p>"},{"s":"menyimpulkan-teks","t":"Menyimpulkan Teks","m":3,"sr":"buatan","h":"<p>Simpulan harus didukung isi teks, tidak bertentangan dengan teks, dan tidak berlebihan. Hindari kata “semua”, “selalu”, atau “tidak pernah” kecuali teks menyatakannya.<\/p>"},{"s":"teks-eksposisi-dan-argumentasi","t":"Teks Eksposisi dan Argumentasi","m":3,"sr":"buatan","h":"<p>Teks eksposisi memaparkan informasi. Teks argumentasi bertujuan meyakinkan pembaca.<\/p><p>Struktur teks argumentasi:<\/p><ol><li>Tesis<\/li><li>Argumen dan bukti<\/li><li>Penegasan ulang<\/li><\/ol>"},{"s":"kalimat-efektif-dan-kata-baku","t":"Kalimat Efektif dan Kata Baku","m":3,"sr":"buatan","h":"<p>Kalimat efektif jelas, hemat kata, logis, dan tidak ambigu.<\/p><p>Kata tidak baku → kata baku:<br>apotik → apotek<br>praktek → praktik<br>resiko → risiko<br>nomor telpon → nomor telepon<\/p>"}],"qs":[{"q":"<p>Ide pokok paragraf biasanya bersifat …<\/p>","t":"s","o":["Sangat rinci","Umum dan mewakili isi paragraf","Selalu berada di akhir teks","Tidak berkaitan dengan isi teks","Berupa contoh kecil"],"a":[1],"e":"Ide pokok adalah gagasan utama yang mewakili isi paragraf."},{"q":"<p>Pernyataan berikut yang merupakan fakta adalah …<\/p>","t":"s","o":["Menurut saya, buku itu menarik.","Sepertinya hujan akan turun.","Indonesia merdeka pada 17 Agustus 1945.","Sebaiknya siswa belajar lebih giat.","Konser itu sangat membosankan."],"a":[2],"e":"Tanggal kemerdekaan Indonesia merupakan fakta sejarah."},{"q":"<p>Makna kata “insentif” adalah …<\/p>","t":"s","o":["Hambatan","Larangan","Dorongan atau bantuan","Penolakan","Pengurangan"],"a":[2],"e":"Insentif berarti dorongan, reward, atau bantuan."},{"q":"<p>“Rina membawa payung meskipun langit cerah.” Informasi tersirat kalimat tersebut adalah …<\/p>","t":"s","o":["Rina tidak membawa payung.","Rina menduga hujan akan turun.","Langit sedang hujan.","Rina menjual payung.","Payung Rina rusak."],"a":[1],"e":"Kata “meskipun” menunjukkan Rina membawa payung sebagai antisipasi hujan."},{"q":"<p>Simpulan yang tepat harus …<\/p>","t":"s","o":["Bertentangan dengan teks","Didukung oleh isi teks","Lebih ekstrem dari isi teks","Hanya berdasarkan opini pembaca","Tidak berkaitan dengan teks"],"a":[1],"e":"Simpulan harus berdasarkan bukti dalam teks."},{"q":"<p>Teks yang bertujuan meyakinkan pembaca dengan alasan dan bukti disebut teks …<\/p>","t":"s","o":["Narasi","Deskripsi","Argumentasi","Prosedur","Laporan"],"a":[2],"e":"Teks argumentasi memuat tesis, argumen, dan penegasan ulang."},{"q":"<p>Kata baku dari “praktek” adalah …<\/p>","t":"s","o":["Praktek","Praktik","Prakteknya","Peraktek","Praktis"],"a":[1],"e":"Bentuk baku yang benar adalah “praktik”."},{"q":"<p>Kalimat efektif berikut adalah …<\/p>","t":"s","o":["Para siswa-siswa harus datang.","Banyak anak-anak bermain.","Semua siswa wajib mengikuti upacara.","Kegiatan dilaksanakan oleh panitia panitia.","Para hadirin dimohon masuk secara tertib."],"a":[2],"e":"Kalimat efektif tidak menggunakan kata yang berulang atau berlebihan."},{"q":"<p>Makna ungkapan “menarik benang merah” adalah …<\/p>","t":"s","o":["Menyimpulkan inti pembicaraan","Membuat benang panjang","Menghentikan pembicaraan","Menambah masalah","Menyembunyikan fakta"],"a":[0],"e":"Ungkapan tersebut berarti menarik kesimpulan atau inti pembicaraan."},{"q":"<p>Bagian teks argumentasi yang berisi alasan dan bukti disebut …<\/p>","t":"s","o":["Tesis","Argumen","Penegasan ulang","Abstrak","Simpulan"],"a":[1],"e":"Argumen berisi alasan, data, fakta, atau contoh pendukung."},{"q":"<p>Teks yang berisi langkah-langkah melakukan sesuatu disebut teks …<\/p>","t":"s","o":["Narasi","Prosedur","Deskripsi","Eksposisi","Argumentasi"],"a":[1],"e":"Teks prosedur memuat urutan langkah."},{"q":"<p>PGK. Pilih semua pernyataan yang merupakan opini.<\/p>","t":"m","o":["Buku ini sangat menarik.","Indonesia memiliki ibu kota bernama Jakarta.","Sebaiknya siswa membiasakan membaca.","Air mendidih pada 100°C pada tekanan 1 atm.","Menurut saya, belajar daring lebih efektif."],"a":[0,2,4],"e":"Pilihan A, C, dan E memuat penilaian atau pendapat. Pilihan B dan D merupakan fakta."},{"q":"<p>PGK. Pilih semua ciri ide pokok.<\/p>","t":"m","o":["Bersifat umum","Mewakili isi paragraf","Selalu berupa contoh","Dapat berada di awal, tengah, atau akhir paragraf","Selalu lebih rinci daripada gagasan pendukung"],"a":[0,1,3],"e":"Ide pokok bersifat umum, mewakili paragraf, dan posisinya dapat bervariasi."},{"q":"<p>PGK. Pilih semua kalimat yang efektif.<\/p>","t":"m","o":["Para siswa-siswa berkumpul di lapangan.","Semua peserta wajib hadir tepat waktu.","Kegiatan itu dilaksanakan oleh panitia panitia.","Buku itu dibaca oleh banyak siswa.","Para nelayan-nelayan melaut pagi hari."],"a":[1,3],"e":"Kalimat efektif menghindari pengulangan kata."},{"q":"<p>PGK. Pilih semua informasi yang termasuk fakta.<\/p>","t":"m","o":["Indonesia merdeka pada 17 Agustus 1945.","Buku ini adalah yang terbaik.","Air memiliki rumus kimia H2O.","Menurut saya, sekolah harus menambah jam olahraga.","Bumi mengelilingi Matahari."],"a":[0,2,4],"e":"Pilihan A, C, dan E dapat dibuktikan secara objektif."}]}</script><script src="../assets/catalog.js"></script><script src="../assets/app.js"></script></body></html>
