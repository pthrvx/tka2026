<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matematika | Persiapan TKA</title><link rel="stylesheet" href="../assets/app.css?v=1792139313"><link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,700&display=swap" rel="stylesheet"><script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("tka2_set")).theme||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script></head><body><header class="hd w" id="hd"></header><main class="w" id="app"></main><footer class="ft"><div class="w"><p>Website ini dibuat dan dikelola oleh <b>Putra</b>.</p><p class="so"><a href="https://instagram.com/pthrvx" target="_blank" rel="noopener">Instagram</a><a href="https://github.com/pthrvx" target="_blank" rel="noopener">GitHub</a><a href="https://www.tiktok.com/@pthrvx" target="_blank" rel="noopener">TikTok</a></p><p>© 2026 Putra. Soal dan materi untuk latihan mandiri, bukan soal resmi TKA.</p></div></footer><script>window.M={"id":"matematika","name":"Matematika","tl":"Sumber modul: kisi-kisi resmi Pusmendik dan materi latihan buatan.","mods":[{"s":"kisi-kisi-resmi","t":"Kisi-kisi Resmi Matematika","m":3,"sr":"resmi","h":"<h4>Definisi<\/h4><p>TKA Matematika mengukur kemampuan murid dalam memahami fakta, konsep, prinsip, dan prosedur matematika, serta kemampuan mereka dalam menerapkan pengetahuan matematika untuk menyelesaikan masalah.<\/p><h4>Muatan<\/h4><p>Muatan mencakup lima bidang:<\/p><ol><li>Bilangan<\/li><li>Aljabar<\/li><li>Geometri dan pengukuran<\/li><li>Data dan peluang<\/li><li>Trigonometri<\/li><\/ol><p>Rincian muatan:<\/p><ol><li>Bilangan: bilangan real, bilangan berpangkat bulat dan pecahan.<\/li><li>Aljabar: persamaan dan pertidaksamaan linear, fungsi, barisan dan deret, program linear.<\/li><li>Geometri dan pengukuran: bangun datar, bangun ruang, jarak, transformasi geometri, pengukuran.<\/li><li>Data dan peluang: penyajian data, ukuran pemusatan dan penyebaran, peluang majemuk, aturan pencacahan.<\/li><li>Trigonometri: sinus, kosinus, tangen, kotangen, sekan, kosekan.<\/li><\/ol><h4>Kompetensi<\/h4><p>TKA Matematika mengukur kemampuan:<\/p><ol><li>Memahami fakta, konsep, prinsip, dan prosedur matematika.<\/li><li>Menerapkan pengetahuan matematika untuk menyelesaikan masalah.<\/li><li>Menggunakan penalaran dan pemodelan matematis.<\/li><li>Menginterpretasi data, grafik, dan tabel.<\/li><li>Menyelesaikan masalah kontekstual.<\/li><\/ol><h4>Matriks Asesmen<\/h4><p>Matriks asesmen mencakup kompetensi dan subkompetensi pada lima bidang berikut:<\/p><ol><li>Bilangan<\/li><li>Bilangan real.<\/li><li>Bilangan berpangkat bulat.<\/li><li>Bilangan berpangkat pecahan.<\/li><\/ol><ol><li>Aljabar<\/li><li>Persamaan dan pertidaksamaan linear.<\/li><li>Fungsi.<\/li><li>Barisan dan deret.<\/li><li>Program linear.<\/li><\/ol><ol><li>Geometri dan Pengukuran<\/li><li>Bangun datar.<\/li><li>Bangun ruang.<\/li><li>Jarak.<\/li><li>Transformasi geometri.<\/li><li>Pengukuran.<\/li><\/ol><ol><li>Data dan Peluang<\/li><li>Penyajian data.<\/li><li>Ukuran pemusatan dan penyebaran.<\/li><li>Peluang majemuk.<\/li><li>Aturan pencacahan.<\/li><\/ol><ol><li>Trigonometri<\/li><li>Sinus.<\/li><li>Kosinus.<\/li><li>Tangen.<\/li><li>Kotangen.<\/li><li>Sekan.<\/li><li>Kosekan.<\/li><\/ol><h4>Contoh Soal Resmi<\/h4><p>Halaman resmi Matematika memuat contoh soal dengan bentuk:<\/p><ul><li>Pilihan Ganda (PG)<\/li><li>PGK MCMA: pilih lebih dari satu jawaban benar<\/li><li>PGK Kategori: menentukan Benar/Salah atau kategori<\/li><\/ul><p>Contoh yang tercantum pada halaman resmi meliputi kompetensi sistem persamaan dan pertidaksamaan linear, fungsi dan invers, barisan-deret, volume bangun ruang, trigonometri, penyajian data, peluang, program linear, transformasi geometri, dan aturan pencacahan.<\/p><p>Untuk melihat seluruh contoh soal resmi Matematika beserta kunci dan pembahasan, buka halaman sumber di atas.<\/p>"},{"s":"bilangan-dan-operasi-hitung","t":"Bilangan dan Operasi Hitung","m":3,"sr":"buatan","h":"<p>Urutan pengerjaan operasi hitung adalah kurung, pangkat atau akar, perkalian dan pembagian, lalu penjumlahan dan pengurangan.<\/p><p>Contoh:<br>18 + 6 x (8 - 5)^2<br>= 18 + 6 x 3^2<br>= 18 + 6 x 9<br>= 18 + 54<br>= 72<\/p>"},{"s":"persen-diskon-dan-rasio","t":"Persen, Diskon, dan Rasio","m":3,"sr":"buatan","h":"<h4>Mulai dari kasus sehari-hari<\/h4><p>Kamu melihat sepatu seharga Rp400.000 dengan tulisan \"Diskon 30%\". Berapa yang harus kamu bayar? Persen hanyalah cara menulis \"per seratus\", jadi 30% berarti 30 dari setiap 100.<\/p><h4>Cara berpikirnya<\/h4><ol><li>Ubah persen menjadi pecahan: 30% = 30/100.<\/li><li>Hitung potongannya: 30/100 × 400.000 = 120.000.<\/li><li>Kurangkan dari harga awal: 400.000 − 120.000 = 280.000.<\/li><\/ol><p>Jalan pintas: bayar 70% dari harga awal, jadi 70/100 × 400.000 = 280.000.<\/p><h4>Contoh 2: rasio<\/h4><p>Uang Rp640.000 dibagi untuk Budi dan Sari dengan rasio 5 : 3. Jumlah bagian = 5 + 3 = 8. Bagian Budi = 5/8 × 640.000 = 400.000, bagian Sari = 3/8 × 640.000 = 240.000. Cek: 400.000 + 240.000 = 640.000.<\/p><h4>Contoh 3: diskon bertingkat<\/h4><p>Diskon 20% lalu tambahan 10% bukan berarti 30%. Harga 100.000 menjadi 80.000 setelah diskon 20%, lalu menjadi 72.000 setelah diskon 10% dari 80.000. Total potongannya 28%.<\/p><h4>Kesalahan yang sering terjadi<\/h4><ul><li>Menjumlahkan dua diskon bertingkat langsung (20% + 10% = 30%).<\/li><li>Menghitung persen dari angka yang salah. Persen kenaikan dihitung dari harga awal.<\/li><li>Lupa mengecek bahwa jumlah semua bagian rasio sama dengan totalnya.<\/li><\/ul><h4>Cek pemahaman<\/h4><p>Harga ponsel Rp2.000.000 naik 15%. Harga barunya 115/100 × 2.000.000 = 2.300.000.<\/p>"},{"s":"persamaan-dan-pertidaksamaan-linear","t":"Persamaan dan Pertidaksamaan Linear","m":3,"sr":"buatan","h":"<h4>Mulai dari kasus<\/h4><p>Taksi online menarik tarif awal Rp8.000 ditambah Rp3.500 per km. Dina membayar Rp36.000. Berapa km perjalanannya? Pertanyaan seperti ini diselesaikan dengan persamaan linear.<\/p><h4>Cara berpikirnya<\/h4><p>Misalkan x adalah jarak dalam km. Ubah cerita menjadi persamaan: 8.000 + 3.500x = 36.000.<\/p><ol><li>Pindahkan angka tetap: 3.500x = 36.000 − 8.000 = 28.000.<\/li><li>Bagi dengan koefisien: x = 28.000 / 3.500 = 8 km.<\/li><li>Cek: 8.000 + 3.500 × 8 = 36.000. Cocok.<\/li><\/ol><h4>Pertidaksamaan: kapan tanda berbalik?<\/h4><p>Anggaranmu Rp50.000. Jarak maksimal: 8.000 + 3.500x ≤ 50.000, maka 3.500x ≤ 42.000 dan x ≤ 12 km.<br>Tanda hanya berbalik jika kedua ruas dikali atau dibagi bilangan negatif. Contoh: −2x &gt; 8 menjadi x &lt; −4.<\/p><h4>Kesalahan yang sering terjadi<\/h4><ul><li>Lupa membalik tanda saat membagi dengan bilangan negatif.<\/li><li>Memindahkan angka ke ruas lain tanpa mengganti tandanya (+ menjadi −).<\/li><li>Tidak mengecek jawaban dengan memasukkannya kembali.<\/li><\/ul><h4>Cek pemahaman<\/h4><p>3x − 4 = 11, maka 3x = 15 dan x = 5. Masukkan lagi: 3 × 5 − 4 = 11.<\/p>"},{"s":"sistem-persamaan-linear-dua-variabel","t":"Sistem Persamaan Linear Dua Variabel","m":3,"sr":"buatan","h":"<p>Gunakan eliminasi atau substitusi.<\/p><p>Contoh:<br>2x + y = 10<br>x - y = 2<\/p><p>Jumlahkan kedua persamaan:<br>3x = 12<br>x = 4<\/p><p>Substitusikan x = 4:<br>4 - y = 2<br>y = 2<\/p>"},{"s":"fungsi-dan-invers","t":"Fungsi dan Invers","m":3,"sr":"buatan","h":"<p>Jika f(x) = 3x - 4, maka f(5) = 3(5) - 4 = 11.<\/p><p>Untuk mencari invers:<br>y = 2x + 6<br>x = (y - 6)/2<br>f^-1(x) = (x - 6)/2<\/p>"},{"s":"barisan-dan-deret-aritmetika","t":"Barisan dan Deret Aritmetika","m":3,"sr":"buatan","h":"<p>Rumus suku ke-n:<br>Un = a + (n - 1)b<\/p><p>Rumus jumlah n suku pertama:<br>Sn = n/2 [2a + (n - 1)b]<\/p><p>Contoh barisan 5, 9, 13, …<br>a = 5 dan b = 4.<br>U12 = 5 + 11(4) = 49.<\/p>"},{"s":"geometri-dan-pengukuran","t":"Geometri dan Pengukuran","m":3,"sr":"buatan","h":"<p>Luas segitiga = 1/2 x alas x tinggi.<br>Luas lingkaran = pi r^2.<br>Keliling lingkaran = 2 pi r.<br>Volume kubus = s^3.<br>Volume balok = p x l x t.<br>Volume tabung = pi r^2 t.<\/p><p>Teorema Pythagoras:<br>c^2 = a^2 + b^2<\/p><p>Contoh:<br>Sisi tegak 9 cm dan 12 cm.<br>c = akar(9^2 + 12^2) = akar225 = 15 cm.<\/p>"},{"s":"statistika-dan-peluang","t":"Statistika dan Peluang","m":3,"sr":"buatan","h":"<p>Mean = jumlah seluruh data / banyak data.<br>Median = nilai tengah data yang sudah diurutkan.<br>Modus = data yang paling sering muncul.<\/p><p>Peluang:<br>P(A) = banyak kejadian A / banyak ruang sampel<\/p><p>Contoh:<br>Dalam kotak ada 5 bola merah, 3 putih, dan 2 biru.<br>P(putih) = 3/10.<\/p>"},{"s":"trigonometri","t":"Trigonometri","m":3,"sr":"buatan","h":"<p>sin theta = depan / miring<br>cos theta = samping / miring<br>tan theta = depan / samping<\/p><p>Nilai penting:<br>sin 30 = 1/2<br>cos 60 = 1/2<br>tan 45 = 1<br>sin 45 = cos 45 = 1/2 akar 2<\/p>"}],"qs":[{"q":"<p>Hasil dari 18 + 6 x (8 - 5)^2 adalah …<\/p>","t":"s","o":["54","66","72","78","90"],"a":[2],"e":"(8 - 5)^2 = 9. Lalu 6 x 9 = 54. Jadi 18 + 54 = 72.","ks":""},{"q":"<p>Harga sepatu Rp400.000 dengan diskon 30%. Harga akhirnya adalah …<\/p>","t":"s","o":["Rp120.000","Rp240.000","Rp280.000","Rp300.000","Rp370.000"],"a":[2],"e":"Diskon = Rp120.000, sehingga harga akhir = Rp280.000.","ks":""},{"q":"<p>Perbandingan uang Ali dan Budi adalah 3 : 5. Jika jumlah uang mereka Rp640.000, uang Budi adalah …<\/p>","t":"s","o":["Rp240.000","Rp320.000","Rp360.000","Rp400.000","Rp480.000"],"a":[3],"e":"Uang Budi = 5/8 x 640.000 = Rp400.000.","ks":""},{"q":"<p>Jika 5x - 8 = 2x + 13, maka nilai x adalah …<\/p>","t":"s","o":["5","6","7","8","9"],"a":[2],"e":"3x = 21, sehingga x = 7.","ks":""},{"q":"<p>Himpunan penyelesaian dari 2x + 3 &lt; 11 adalah …<\/p>","t":"s","o":["x &lt; 4","x &gt; 4","x &lt;= 4","x &gt;= 4","x = 4"],"a":[0],"e":"2x &lt; 8, sehingga x &lt; 4.","ks":""},{"q":"<p>Diketahui f(x) = 3x - 4. Nilai f(5) adalah …<\/p>","t":"s","o":["8","11","14","15","19"],"a":[1],"e":"f(5) = 3(5) - 4 = 11.","ks":""},{"q":"<p>Invers dari f(x) = 2x + 6 adalah …<\/p>","t":"s","o":["f^-1(x) = 2x - 6","f^-1(x) = (x - 6)/2","f^-1(x) = (x + 6)/2","f^-1(x) = 2x + 6","f^-1(x) = 6x - 2"],"a":[1],"e":"Tukar x dan y, lalu selesaikan untuk y.","ks":""},{"q":"<p>Suku ke-12 dari barisan 5, 9, 13, … adalah …<\/p>","t":"s","o":["45","49","53","57","61"],"a":[1],"e":"a = 5 dan b = 4. U12 = 5 + 11(4) = 49.","ks":""},{"q":"<p>Segitiga siku-siku memiliki sisi tegak 9 cm dan 12 cm. Panjang sisi miringnya adalah …<\/p>","t":"s","o":["13 cm","15 cm","17 cm","20 cm","21 cm"],"a":[1],"e":"c = akar(81 + 144) = akar225 = 15 cm.","ks":""},{"q":"<p>Volume kubus dengan panjang rusuk 6 cm adalah …<\/p>","t":"s","o":["36 cm^3","72 cm^3","108 cm^3","216 cm^3","432 cm^3"],"a":[3],"e":"V = 6^3 = 216 cm^3.","ks":""},{"q":"<p>Median data 70, 75, 75, 80, 85, 90, 95 adalah …<\/p>","t":"s","o":["75","80","82,5","85","90"],"a":[1],"e":"Data sudah terurut dan nilai tengahnya adalah 80.","ks":""},{"q":"<p>Dalam kotak terdapat 5 bola merah, 3 bola putih, dan 2 bola biru. Peluang terambilnya bola putih adalah …<\/p>","t":"s","o":["1/10","1/5","3/10","2/5","1/2"],"a":[2],"e":"P(putih) = 3/10.","ks":""},{"q":"<p>Nilai dari sin 30° + cos 60° adalah …<\/p>","t":"s","o":["0","1/2","1","akar 3","2"],"a":[2],"e":"1/2 + 1/2 = 1.","ks":""},{"q":"<p>Jika tan theta = 3/4 dan theta sudut lancip, maka sin theta adalah …<\/p>","t":"s","o":["3/5","4/5","5/3","5/4","4/3"],"a":[0],"e":"Sisi depan 3, samping 4, miring 5. Sin = 3/5.","ks":""},{"q":"<p>Pilih semua bilangan yang merupakan bilangan prima.<\/p>","t":"m","o":["2","9","11","15","17"],"a":[0,2,4],"e":"Bilangan prima memiliki tepat dua faktor: 1 dan dirinya sendiri. 2, 11, dan 17 adalah prima; 9 dan 15 bukan.","ks":"Rani membuat kunci rahasia yang hanya boleh memakai bilangan prima. Ia mencatat beberapa angka kandidat di daftar jawaban."},{"q":"<p>Diagram berikut menunjukkan banyak es yang terjual di kantin selama lima hari. Kenaikan penjualan terbesar dari satu hari ke hari berikutnya terjadi pada …<\/p>","t":"s","o":["Senin ke Selasa","Selasa ke Rabu","Rabu ke Kamis","Kamis ke Jumat","Tidak ada kenaikan"],"a":[2],"e":"Hitung selisih tiap hari berurutan: Senin ke Selasa +6, Selasa ke Rabu −3, Rabu ke Kamis +9, Kamis ke Jumat −3. Kenaikan terbesar adalah +9, yaitu Rabu ke Kamis.","k":"Analisis gambar","im":"<svg viewBox=\"0 0 360 190\" aria-hidden=\"true\"><line class=\"ax\" x1=\"24\" y1=\"160\" x2=\"346\" y2=\"160\"/><rect class=\"bar\" x=\"36\" y=\"103.5\" width=\"40\" height=\"56.5\" rx=\"2\"/><text class=\"tx\" x=\"56\" y=\"98.47826086956522\" text-anchor=\"middle\">12<\/text><text class=\"tx\" x=\"56\" y=\"178\" text-anchor=\"middle\">Sen<\/text><rect class=\"bar\" x=\"98\" y=\"75.2\" width=\"40\" height=\"84.8\" rx=\"2\"/><text class=\"tx\" x=\"118\" y=\"70.21739130434783\" text-anchor=\"middle\">18<\/text><text class=\"tx\" x=\"118\" y=\"178\" text-anchor=\"middle\">Sel<\/text><rect class=\"bar\" x=\"160\" y=\"89.3\" width=\"40\" height=\"70.7\" rx=\"2\"/><text class=\"tx\" x=\"180\" y=\"84.34782608695652\" text-anchor=\"middle\">15<\/text><text class=\"tx\" x=\"180\" y=\"178\" text-anchor=\"middle\">Rab<\/text><rect class=\"bar\" x=\"222\" y=\"47.0\" width=\"40\" height=\"113.0\" rx=\"2\"/><text class=\"tx\" x=\"242\" y=\"41.95652173913042\" text-anchor=\"middle\">24<\/text><text class=\"tx\" x=\"242\" y=\"178\" text-anchor=\"middle\">Kam<\/text><rect class=\"bar\" x=\"284\" y=\"61.1\" width=\"40\" height=\"98.9\" rx=\"2\"/><text class=\"tx\" x=\"304\" y=\"56.086956521739125\" text-anchor=\"middle\">21<\/text><text class=\"tx\" x=\"304\" y=\"178\" text-anchor=\"middle\">Jum<\/text><\/svg>","alt":"Diagram batang penjualan es: Senin 12, Selasa 18, Rabu 15, Kamis 24, Jumat 21"},{"q":"<p>Perhatikan grafik garis lurus berikut. Garis melalui titik (0, 2) dan (4, 10). Persamaan garis tersebut adalah …<\/p>","t":"s","o":["y = 2x + 2","y = 2x + 4","y = x + 2","y = 4x + 2",
