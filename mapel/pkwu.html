<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produk atau Projek Kreatif dan Kewirausahaan | Persiapan TKA</title><link rel="stylesheet" href="../assets/app.css?v=1792139313"><link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,700&display=swap" rel="stylesheet"><script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("tka2_set")).theme||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script></head><body><header class="hd w" id="hd"></header><main class="w" id="app"></main><footer class="ft"><div class="w"><p>Website ini dibuat dan dikelola oleh <b>Putra</b>.</p><p class="so"><a href="https://instagram.com/pthrvx" target="_blank" rel="noopener">Instagram</a><a href="https://github.com/pthrvx" target="_blank" rel="noopener">GitHub</a><a href="https://www.tiktok.com/@pthrvx" target="_blank" rel="noopener">TikTok</a></p><p>© 2026 Putra. Soal dan materi untuk latihan mandiri, bukan soal resmi TKA.</p></div></footer><script>window.M={"id":"pkwu","name":"Produk atau Projek Kreatif dan Kewirausahaan","tl":"Sumber modul: kisi-kisi resmi Pusmendik dan materi latihan buatan.","mods":[{"s":"kisi-kisi-resmi","t":"Kisi-kisi Resmi Produk atau Projek Kreatif dan Kewirausahaan","m":3,"sr":"resmi","h":"<h4>Definisi<\/h4><p>TKA Produk/Projek Kreatif dan Kewirausahaan bertujuan menilai pemahaman konseptual dan keterampilan analitis murid dalam hal Produk/Projek Kreatif dan Kewirausahaan. TKA mengukur pemahaman terkait kegiatan produksi, distribusi, pemasaran, dan pengelolaan usaha. Selain itu, tes ini juga mengukur keterampilan analitis terkait peluang usaha, proposal usaha, biaya produksi, laporan keuangan, dan kasus-kasus yang berhubungan dengan Hak atas Kekayaan Intelektual (HaKI).<\/p><h4>Muatan<\/h4><ol><li>Kegiatan produksi, pemasaran, dan distribusi:<\/li><li>Desain produk barang/jasa<\/li><li>Desain kemasan produk<\/li><li>Prototipe produk barang/jasa<\/li><li>Perencanaan produksi<\/li><li>Produksi<\/li><li>Pengendalian mutu<\/li><li>Pemasaran produk<\/li><li>Distribusi produk<\/li><\/ol><ol><li>Pengelolaan usaha:<\/li><li>Analisis peluang usaha<\/li><li>Proposal usaha<\/li><li>Pelaporan keuangan<\/li><li>HaKI<\/li><\/ol><h4>Kompetensi<\/h4><p>Level 1 — Pemahaman<br>Murid dapat mengenal dan memahami konsep dasar produksi, prosedur pengembangan produk, strategi pemasaran, serta distribusi produk. Murid juga mampu mengidentifikasi komponen dalam proposal usaha dan mengenali berbagai jenis Hak Kekayaan Intelektual (HaKI).<\/p><p>Level 2 — Penerapan<br>Murid dapat mengaplikasikan desain produk dan kemasan, menghitung biaya produksi secara akurat, merancang strategi pemasaran, serta melakukan distribusi produk. Murid juga mampu memanfaatkan peluang usaha, menerapkan prinsip pengendalian mutu, menerapkan HaKI, serta menyusun proposal dan laporan kegiatan usaha secara sistematis.<\/p><p>Level 3 — Penalaran<br>Murid mampu menganalisis desain produk dan kemasan, menganalisis perencanaan produksi, mengevaluasi strategi pemasaran serta distribusi produk, menganalisis proposal dan pelaporan usaha, serta menentukan solusi permasalahan yang berkaitan dengan HaKI.<\/p><h4>Matriks Asesmen<\/h4><ol><li>Kegiatan Produksi, Pemasaran, dan Distribusi<\/li><li>Pengembangan Desain Produk: menganalisis desain dan prosedur pengembangan produk.<\/li><li>Pengembangan Desain Kemasan Produk: mengevaluasi desain kemasan dan label produk.<\/li><li>Pengembangan Prototipe Produk: menerapkan pengembangan prototipe produk.<\/li><li>Perencanaan Produksi: menentukan perencanaan dan biaya produksi.<\/li><li>Proses Produksi: menerapkan proses produksi.<\/li><li>Pengemasan Produk: menerapkan pengemasan produk.<\/li><li>Pengendalian Mutu Produk: menerapkan pengendalian mutu produk.<\/li><li>Pemasaran Produk: mengevaluasi strategi dan pemasaran produk.<\/li><li>Distribusi Produk: menerapkan distribusi produk.<\/li><\/ol><ol><li>Pengelolaan Usaha<\/li><li>Analisis Peluang Usaha: menentukan peluang usaha.<\/li><li>Proposal Usaha: menganalisis proposal usaha.<\/li><li>Pelaporan Keuangan: menganalisis laporan keuangan.<\/li><li>HaKI: mengevaluasi HaKI.<\/li><\/ol><h4>Contoh Soal Resmi<\/h4><p>Soal 1<\/p><ul><li>Konteks: Sari Kunyit Asam \"Segar Sehat\", minuman herbal 250 ml, izin PIRT.<\/li><li>Kompetensi: mengevaluasi desain kemasan dan label produk.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: C.<\/li><li>Pertanyaan: unsur desain label yang tepat untuk menarik konsumen dan sesuai ketentuan label.<\/li><\/ul><p>Soal 2<\/p><ul><li>Konteks: usaha tas dan dompet dari limbah plastik, target 15-30 tahun, penjualan offline dan online.<\/li><li>Kompetensi: menganalisis proposal usaha.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: D.<\/li><li>Pertanyaan: informasi tersebut merupakan rancangan pada komponen apa dalam proposal usaha.<\/li><\/ul><p>Soal 3<\/p><ul><li>Konteks: Dania memakai nama dan logo mirip merek terkenal, melanggar HaKI.<\/li><li>Kompetensi: mengevaluasi HaKI.<\/li><li>Bentuk soal: PGK Kategori.<\/li><li>Kunci: A. Benar, B. Benar, C. Salah.<\/li><li>Pernyataan:<\/li><\/ul><p>  A. Menciptakan desain logo orisinil dan minta pendampingan hukum.<br>  B. Menghentikan seluruh produk yang melanggar HaKI.<br>  C. Mengganti nama produk tanpa mengubah logo.<\/p><p>Soal 4<\/p><ul><li>Konteks: usaha kopi instan, penjualan turun, harga tinggi, kemasan kurang, sosmed belum optimal, distribusi terbatas.<\/li><li>Kompetensi: mengevaluasi strategi dan pemasaran produk.<\/li><li>Bentuk soal: PGK MCMA.<\/li><li>Kunci: A, B, D.<\/li><li>Pertanyaan: strategi agar usaha berkembang dan berkelanjutan.<\/li><\/ul><p>Soal 5<\/p><ul><li>Konteks: aplikasi laundry online, survei kebutuhan, sketsa desain aplikasi.<\/li><li>Kompetensi: menerapkan pengembangan prototipe produk.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: C.<\/li><li>Pertanyaan: tahapan selanjutnya setelah sketsa desain.<\/li><\/ul>"},{"s":"peluang-usaha","t":"Peluang Usaha","m":3,"sr":"buatan","h":"<p>Peluang usaha muncul dari kebutuhan, masalah, atau keinginan pasar. Langkahnya: amati masalah, identifikasi kebutuhan, analisis pesaing, tentukan solusi, lalu uji pasar.<\/p>"},{"s":"swot","t":"SWOT","m":3,"sr":"buatan","h":"<p>SWOT terdiri atas Strengths, Weaknesses, Opportunities, dan Threats.<\/p>"},{"s":"4p-dan-bep","t":"4P dan BEP","m":3,"sr":"buatan","h":"<p>4P adalah product, price, place, promotion. BEP = biaya tetap / (harga jual - biaya variabel per unit).<\/p>"},{"s":"haki","t":"HaKI","m":3,"sr":"buatan","h":"<p>Nama dan logo usaha dilindungi melalui merek; karya kreatif dilindungi hak cipta.<\/p>"}],"qs":[{"q":"<p>Peluang usaha paling tepat ditemukan melalui …<\/p>","t":"s","o":["Meniru pesaing tanpa analisis","Mengamati kebutuhan dan masalah pasar","Menunggu pelanggan datang","Menaikkan harga tanpa riset","Mengurangi kualitas produk"],"a":[1],"e":"Peluang usaha lahir dari kebutuhan dan masalah pasar.","ks":""},{"q":"<p>SWOT adalah singkatan dari …<\/p>","t":"s","o":["Strength, Weakness, Opportunity, Threat","Sale, Wealth, Order, Target","Product, Price, Place, Promotion","Plan, Work, Organize, Test","Stock, Wage, Output, Tax"],"a":[0],"e":"SWOT adalah Strengths, Weaknesses, Opportunities, Threats.","ks":""},{"q":"<p>Menentukan kelompok konsumen berdasarkan usia, lokasi, dan pendapatan disebut …<\/p>","t":"s","o":["Segmentasi pasar","Distribusi","Promosi","Produksi","Evaluasi mutu"],"a":[0],"e":"Segmentasi membagi pasar menjadi kelompok konsumen.","ks":""},{"q":"<p>Citra produk di benak konsumen disebut …<\/p>","t":"s","o":["Positioning","Pricing","Packaging","Planning","Processing"],"a":[0],"e":"Positioning adalah citra produk di benak konsumen.","ks":""},{"q":"<p>Bauran pemasaran 4P terdiri atas …<\/p>","t":"s","o":["Product, price, place, promotion","Plan, process, product, profit","People, price, product, profit","Place, payment, product, people","Product, process, price, people"],"a":[0],"e":"4P adalah product, price, place, promotion.","ks":""},{"q":"<p>Biaya yang tidak berubah meskipun jumlah produksi berubah disebut …<\/p>","t":"s","o":["Biaya variabel","Biaya tetap","Biaya produksi","Biaya promosi","Biaya distribusi"],"a":[1],"e":"Biaya tetap tidak dipengaruhi jumlah produksi.","ks":""},{"q":"<p>Contoh biaya variabel adalah …<\/p>","t":"s","o":["Sewa ruko","Gaji tetap karyawan","Bahan baku produksi","Penyusutan mesin","Biaya internet bulanan"],"a":[2],"e":"Bahan baku meningkat ketika produksi meningkat.","ks":""},{"q":"<p>Pendapatan usaha dihitung dengan …<\/p>","t":"s","o":["Harga jual x jumlah terjual","Harga jual - biaya tetap","Biaya variabel x biaya tetap","Laba - pendapatan","Modal / keuntungan"],"a":[0],"e":"Pendapatan = harga jual x jumlah terjual.","ks":""},{"q":"<p>Laba usaha = …<\/p>","t":"s","o":["Pendapatan + total biaya","Pendapatan - total biaya","Total biaya - pendapatan","Modal + pendapatan","Harga jual - modal"],"a":[1],"e":"Laba adalah selisih pendapatan dan total biaya.","ks":""},{"q":"<p>Harga jual Rp50.000, biaya variabel Rp30.000, biaya tetap Rp400.000. BEP adalah …<\/p>","t":"s","o":["10 unit","15 unit","20 unit","25 unit","30 unit"],"a":[2],"e":"BEP = 400.000 / 20.000 = 20 unit.","ks":""},{"q":"<p>Perlindungan nama dan logo usaha dilakukan melalui …<\/p>","t":"s","o":["Hak cipta","Paten","Merek","Desain industri","Rahasia dagang"],"a":[2],"e":"Nama dan logo dilindungi melalui pendaftaran merek.","ks":""},{"q":"<p>Pilih semua yang termasuk biaya tetap.<\/p>","t":"m","o":["Sewa tempat usaha","Bahan baku","Gaji tetap karyawan","Kemasan produk","Penyusutan mesin"],"a":[0,2,4],"e":"Biaya tetap tidak berubah mengikuti jumlah produksi.","ks":""},{"q":"<p>Pilih semua bagian proposal usaha.<\/p>","t":"m","o":["Latar belakang","Analisis pasar","Rencana keuangan","Daftar nilai rapor siswa","Strategi pemasaran"],"a":[0,1,2,4],"e":"Proposal usaha memuat latar belakang, analisis pasar, keuangan, dan pemasaran.","ks":""},{"q":"<p>Pilih semua strategi pemasaran digital.<\/p>","t":"m","o":["Instagram","TikTok","Marketplace","Spanduk di jalan","Website"],"a":[0,1,2,4],"e":"Pemasaran digital menggunakan internet dan platform digital.","ks":""},{"q":"<p>Salah satu manfaat kewirausahaan adalah …<\/p>","t":"s","o":["Menambah pendapatan","Menambah kemiskinan","Menambah pengangguran","Menambah limbah","Menambah ketergantungan"],"a":[0],"e":"Kewirausahaan menambah pendapatan.","ks":""}]}</script><script src="../assets/catalog.js?v=1792139313"></script><script src="../assets/app.js?v=1792139313"></script></body></html>
