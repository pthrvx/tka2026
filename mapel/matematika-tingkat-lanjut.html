<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matematika Tingkat Lanjut | Persiapan TKA</title><link rel="stylesheet" href="../assets/app.css?v=1792139313"><link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,700&display=swap" rel="stylesheet"><script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("tka2_set")).theme||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script></head><body><header class="hd w" id="hd"></header><main class="w" id="app"></main><footer class="ft"><div class="w"><p>Website ini dibuat dan dikelola oleh <b>Putra</b>.</p><p class="so"><a href="https://instagram.com/pthrvx" target="_blank" rel="noopener">Instagram</a><a href="https://github.com/pthrvx" target="_blank" rel="noopener">GitHub</a><a href="https://www.tiktok.com/@pthrvx" target="_blank" rel="noopener">TikTok</a></p><p>© 2026 Putra. Soal dan materi untuk latihan mandiri, bukan soal resmi TKA.</p></div></footer><script>window.M={"id":"matematika-tingkat-lanjut","name":"Matematika Tingkat Lanjut","tl":"Sumber modul: kisi-kisi resmi Pusmendik dan materi latihan buatan.","mods":[{"s":"kisi-kisi-resmi","t":"Kisi-kisi Resmi Matematika Tingkat Lanjut","m":3,"sr":"resmi","h":"<h4>Definisi<\/h4><p>Sebagaimana TKA Matematika wajib, TKA Matematika Tingkat Lanjut juga mengukur kemampuan murid dalam memahami fakta, konsep, prinsip, dan prosedur matematika, serta kemampuan mereka dalam menerapkan pengetahuan matematika untuk menyelesaikan masalah (problem solving).<\/p><h4>Muatan<\/h4><p>Muatan TKA Matematika Tingkat Lanjut merujuk pada elemen atau materi kurikulum yang ada pada Kurikulum 2013 dan Kurikulum Merdeka. Elemen meliputi:<\/p><ol><li>Aljabar<\/li><li>Geometri dan pengukuran<\/li><li>Kalkulus<\/li><\/ol><p>Penggunaan logika matematika diintegrasikan langsung dengan elemen matematika tersebut.<\/p><p>Penguasaan materi diukur melalui permasalahan dalam konteks matematika maupun konteks keseharian, meliputi kejadian atau situasi di lingkup personal, keluarga, atau lingkungan sekitar, baik lokal maupun global.<\/p><h4>Kompetensi<\/h4><p>Level kompetensi:<\/p><p>Level 1 — Pengetahuan dan Pemahaman<\/p><ul><li>Menghitung: melakukan perhitungan berdasarkan prosedur operasi aritmatika, aljabar, atau operasi matematika lainnya.<\/li><li>Memahami informasi: memahami informasi dari grafik fungsi, tabel, diagram, infografis, atau bentuk visual lainnya.<\/li><li>Mengelompokkan: mengelompokkan objek berdasarkan fakta, konsep, dan prinsip matematika.<\/li><li>Mengidentifikasi: mengidentifikasi objek menggunakan konsep, fakta, dan prinsip matematika.<\/li><\/ul><p>Level 2 — Aplikasi<\/p><ul><li>Memodelkan: memodelkan permasalahan kontekstual ke dalam pernyataan matematika.<\/li><li>Menerapkan: menerapkan strategi dan operasi matematika untuk menyelesaikan masalah yang familier dan rutin.<\/li><li>Menginterpretasi: memahami dan menjelaskan makna dari situasi, kejadian, pernyataan, representasi, atau masalah matematika.<\/li><\/ul><p>Level 3 — Penalaran<\/p><ul><li>Menganalisis: menentukan, menjelaskan, dan menggunakan hubungan beberapa konsep, fakta, prinsip, atau prosedur matematika.<\/li><li>Memecahkan masalah: mengaitkan beberapa konsep untuk menyelesaikan masalah dalam situasi baru atau konteks tidak rutin.<\/li><li>Mengevaluasi: mengevaluasi alternatif strategi dan solusi pemecahan masalah.<\/li><\/ul><h4>Matriks Asesmen<\/h4><ol><li>Aljabar<\/li><li>Matriks: memahami, mengaplikasikan, dan bernalar tingkat tinggi terkait matriks. Elemen matriks berupa bilangan real; determinan dan invers matriks berukuran 2x2 atau 3x3.<\/li><li>Polinomial: memahami, mengaplikasikan, dan bernalar tingkat tinggi; orde polinomial maksimum 4, koefisien bilangan real.<\/li><li>Fungsi: domain, kodomain, daerah hasil (range), dan grafik fungsi polinom, rasional, akar, eksponensial, logaritma, mutlak, trigonometri. Fungsi polinom maksimum berorde 4; bilangan pokok fungsi eksponensial berupa bilangan asli.<\/li><\/ol><ol><li>Geometri dan Pengukuran<\/li><li>Vektor: memahami, mengaplikasikan, dan bernalar tingkat tinggi; komponen vektor maksimum tiga.<\/li><li>Lingkaran: memahami, mengaplikasikan, dan bernalar tingkat tinggi.<\/li><li>Transformasi Geometri: translasi, refleksi, rotasi, dilatasi, serta komposisinya dari bentuk geometris dan matriks transformasinya. Bentuk geometris: titik, garis, dan bangun datar.<\/li><\/ol><ol><li>Trigonometri<\/li><li>Limit: memahami, mengaplikasikan, dan bernalar tingkat tinggi; limit yang dapat diselesaikan tanpa Teorema L'Hopital.<\/li><\/ol><h4>Contoh Soal Resmi<\/h4><p>Soal 1<\/p><ul><li>Kompetensi: Aljabar — Matriks — invers matriks.<\/li><li>Bentuk soal: PGK MCMA.<\/li><li>Kunci: Pernyataan 1, Pernyataan 3, dan Pernyataan 5.<\/li><li>Instruksi: Pilih semua jawaban benar; jawaban benar lebih dari satu.<\/li><\/ul><p>Soal 2<\/p><ul><li>Kompetensi: Aljabar — Fungsi — domain, kodomain, range, dan grafik fungsi.<\/li><li>Bentuk soal: PGK Kategori.<\/li><li>Kunci: A. Salah, B. Benar, C. Benar.<\/li><li>Konteks: model banyaknya penonton video content creator terhadap waktu.<\/li><\/ul><p>Soal 3<\/p><ul><li>Kompetensi: Geometri dan Pengukuran — Vektor — operasi vektor.<\/li><li>Bentuk soal: PGK MCMA.<\/li><li>Kunci: Pernyataan 1, Pernyataan 2, dan Pernyataan 4.<\/li><\/ul><p>Soal 4<\/p><ul><li>Kompetensi: Geometri dan Pengukuran — Transformasi Geometri — dilatasi.<\/li><li>Bentuk soal: Pilihan Ganda (PG).<\/li><li>Kunci: C.<\/li><li>Konteks: segitiga PQR didilatasi dengan pusat (0,0) dan faktor skala 3; ditanya luas setelah dilatasi.<\/li><\/ul><p>Soal 5<\/p><ul><li>Kompetensi: Kalkulus — Limit — limit fungsi aljabar.<\/li><li>Bentuk soal: PGK Kategori.<\/li><li>Kunci: A. Benar, B. Salah, C. Benar.<\/li><\/ul><p>Soal 5<\/p><ul><li>Kompetensi: Kalkulus — Limit — limit fungsi trigonometri.<\/li><li>Bentuk soal: Pilihan Ganda (PG).<\/li><li>Kunci: A.<\/li><\/ul>"},{"s":"fungsi-dan-komposisi","t":"Fungsi dan Komposisi","m":3,"sr":"buatan","h":"<p>Jika f(x)=2x+1 dan g(x)=x^2, maka (f o g)(x)=f(g(x))=2x^2+1. Invers fungsi diperoleh dengan menukar x dan y lalu menyelesaikan untuk y.<\/p>"},{"s":"limit","t":"Limit","m":3,"sr":"buatan","h":"<p>Limit menyatakan nilai yang didekati fungsi. Contoh: limit x-&gt;2 (x^2-4)/(x-2) = limit (x+2) = 4.<\/p>"},{"s":"turunan","t":"Turunan","m":3,"sr":"buatan","h":"<p>Turunan mengukur laju perubahan. Jika f(x)=x^n maka f'(x)=n x^(n-1). Turunan juga digunakan mencari nilai maksimum/minimum.<\/p>"},{"s":"integral","t":"Integral","m":3,"sr":"buatan","h":"<p>Integral adalah kebalikan turunan. Integral x^n dx = x^(n+1)/(n+1) + C.<\/p>"},{"s":"matematika-keuangan","t":"Matematika Keuangan","m":3,"sr":"buatan","h":"<p>Bunga tunggal: B = M x i x n. Bunga majemuk: M_n = M(1+i)^n.<\/p>"}],"qs":[{"q":"<p>Jika f(x)=2x+3, maka f(4) = …<\/p>","t":"s","o":["8","10","11","12","14"],"a":[2],"e":"f(4)=2(4)+3=11.","ks":""},{"q":"<p>Jika f(x)=x+2 dan g(x)=3x, maka (f o g)(x) = …<\/p>","t":"s","o":["3x+2","3x+6","x+6","3x-2","6x+2"],"a":[0],"e":"(f o g)(x)=f(3x)=3x+2.","ks":""},{"q":"<p>Invers f(x)=3x-6 adalah …<\/p>","t":"s","o":["(x+6)/3","(x-6)/3","3x+6","x/3-6","3(x+6)"],"a":[0],"e":"y=3x-6, x=(y+6)/3.","ks":""},{"q":"<p>Limit x-&gt;3 (x^2-9)/(x-3) = …<\/p>","t":"s","o":["0","3","6","9","12"],"a":[2],"e":"Faktorkan: (x-3)(x+3)/(x-3)=x+3, lalu substitusi x=3 menghasilkan 6.","ks":""},{"q":"<p>Turunan f(x)=5x^3 adalah …<\/p>","t":"s","o":["5x^2","15x^2","15x^3","5x^4","3x^2"],"a":[1],"e":"f'(x)=3(5)x^2=15x^2.","ks":""},{"q":"<p>Turunan f(x)=4x^2+3x adalah …<\/p>","t":"s","o":["8x+3","8x+3x","4x+3","8x^2+3","12x"],"a":[0],"e":"Turunan 4x^2 adalah 8x dan turunan 3x adalah 3.","ks":""},{"q":"<p>Integral dari 6x dx adalah …<\/p>","t":"s","o":["3x^2+C","6x^2+C","6+C","x^2+C","12x+C"],"a":[0],"e":"Integral 6x dx = 3x^2+C.","ks":""},{"q":"<p>Suku ke-10 barisan 4, 7, 10, … adalah …<\/p>","t":"s","o":["28","31","34","37","40"],"a":[1],"e":"a=4, b=3. U10=4+9(3)=31.","ks":""},{"q":"<p>Jumlah 10 suku pertama barisan 2, 5, 8, … adalah …<\/p>","t":"s","o":["130","140","150","155","160"],"a":[3],"e":"Sn=10/2[2(2)+9(3)]=5(31)=155.","ks":""},{"q":"<p>Modal Rp2.000.000 dengan bunga tunggal 10% per tahun selama 3 tahun menghasilkan bunga …<\/p>","t":"s","o":["Rp200.000","Rp400.000","Rp600.000","Rp800.000","Rp1.000.000"],"a":[2],"e":"B=2.000.000 x 0,10 x 3=600.000.","ks":""},{"q":"<p>Nilai maksimum f(x)=-x^2+4x+5 terjadi pada x = …<\/p>","t":"s","o":["1","2","3","4","5"],"a":[1],"e":"Turunan -2x+4=0, sehingga x=2.","ks":""},{"q":"<p>Peluang muncul angka pada satu lemparan dadu adalah …<\/p>","t":"s","o":["1/6","1/3","1/2","2/3","5/6"],"a":[2],"e":"Ada 3 sisi ganjil dari 6 sisi.","ks":""},{"q":"<p>Pilih semua pernyataan yang benar tentang turunan.<\/p>","t":"m","o":["Turunan mengukur laju perubahan","Turunan dapat digunakan mencari nilai maksimum","Turunan dari x^2 adalah 2x","Turunan selalu bernilai nol","Turunan adalah kebalikan integral"],"a":[0,1,2,4],"e":"Turunan bukan selalu nol; pernyataan lain benar.","ks":""},{"q":"<p>Pilih semua yang termasuk barisan geometri.<\/p>","t":"m","o":["2, 4, 8, 16","3, 6, 9, 12","5, 10, 20, 40","1, 1/2, 1/4, 1/8","2, 4, 6, 8"],"a":[0,2,3],"e":"Barisan geometri memiliki rasio tetap.","ks":""},{"q":"<p>Pilih semua cara menyelesaikan SPLDV.<\/p>","t":"m","o":["Eliminasi","Substitusi","Grafik","Turunan","Integrasi"],"a":[0,1,2],"e":"SPLDV dapat diselesaikan dengan eliminasi, substitusi, atau grafik.","ks":""}]}</script><script src="../assets/catalog.js?v=1792139313"></script><script src="../assets/app.js?v=1792139313"></script></body></html>
