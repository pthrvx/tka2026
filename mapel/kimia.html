<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kimia | Persiapan TKA</title><link rel="stylesheet" href="../assets/app.css"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet"><script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("tka2_set")).theme||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script></head><body><header class="hd w" id="hd"></header><main class="w" id="app"></main><footer class="ft"><div class="w"><p>Website ini dibuat dan dikelola oleh <b>Putra</b>.</p><p class="so"><a href="https://instagram.com/pthrvx" target="_blank" rel="noopener">Instagram</a><a href="https://github.com/pthrvx" target="_blank" rel="noopener">GitHub</a><a href="https://www.tiktok.com/@pthrvx" target="_blank" rel="noopener">TikTok</a></p><p>© 2026 Putra. Soal dan materi untuk latihan mandiri, bukan soal resmi TKA.</p></div></footer><script>window.M={"id":"kimia","name":"Kimia","tl":"Sumber modul: kisi-kisi resmi Pusmendik dan materi latihan buatan.","mods":[{"s":"kisi-kisi-resmi","t":"Kisi-kisi Resmi Kimia","m":3,"sr":"resmi","h":"<h4>Definisi<\/h4><p>TKA Kimia disusun berdasarkan materi kimia esensial pada Kurikulum 2013 dan Kurikulum Merdeka, mengukur pemahaman konsep dasar kimia dan kemampuan mengaplikasikannya dalam berbagai konteks.<\/p><h4>Muatan<\/h4><p>Empat elemen kimia:<\/p><ol><li>Kimia Dasar: struktur atom, teori model atom, sistem dan sifat periodik unsur, ikatan kimia, geometri molekul, interaksi antarmolekul, hukum dasar kimia, stoikiometri, persamaan reaksi.<\/li><li>Kimia Analitik: larutan, kesetimbangan larutan, asam-basa, pH, koloid.<\/li><li>Kimia Fisik: energetika dan dinamika reaksi.<\/li><li>Kimia Organik: struktur dan kereaktifan senyawa karbon.<\/li><\/ol><p>Konteks:<\/p><ol><li>Penyelidikan Ilmiah: proses ilmiah, konsep/teori, interpretasi data, evaluasi bukti, perkembangan ilmu.<\/li><li>Fenomena Kimia Sehari-hari: rumah tangga, makanan/minuman, kesehatan/kecantikan, material, perubahan di lingkungan.<\/li><li>Aplikasi Lingkungan: polusi, efek rumah kaca, hujan asam, ozon, limbah, energi alternatif.<\/li><li>Aplikasi Industri: bahan kimia dasar, petrokimia, makanan/minuman, farmasi, teknik kimia.<\/li><\/ol><h4>Kompetensi<\/h4><ol><li>Pemahaman konsep kimia (Knowing).<\/li><li>Penerapan konsep kimia (Applying).<\/li><li>Penalaran dalam permasalahan kimia (Reasoning).<\/li><\/ol><h4>Matriks Asesmen<\/h4><p>Level 1 — Pemahaman konsep kimia<\/p><ul><li>Mengenali: mengidentifikasi fakta, hubungan, konsep, karakteristik, peran komponen.<\/li><li>Menjelaskan: menjelaskan konsep, sifat, struktur, proses, fenomena.<\/li><li>Memberikan contoh: contoh fenomena, kegunaan, kerugian materi/proses kimia.<\/li><\/ul><p>Level 2 — Penerapan konsep kimia<\/p><ul><li>Membandingkan/mengklasifikasikan: menerapkan pengetahuan, membedakan/mengelompokkan zat/proses.<\/li><li>Menginterpretasikan model: menggunakan konsep sains untuk menafsirkan proses/siklus/sistem.<\/li><li>Menginterpretasikan informasi: menjelaskan informasi tekstual, tabel, gambar, grafis; perhitungan kimia.<\/li><\/ul><p>Level 3 — Penalaran<\/p><ul><li>Memprediksi: menganalisis hasil, memperkirakan hasil dari teori/konsep/perhitungan.<\/li><li>Merancang: membuat model/rancangan eksperimen, menguji hipotesis, menghubungkan variabel, mengaplikasikan prinsip ilmiah.<\/li><li>Mengevaluasi: mengevaluasi fenomena melalui teori, konsep, perhitungan.<\/li><li>Menarik kesimpulan: kesimpulan berdasarkan teori, data, perhitungan.<\/li><li>Menganalisis: menggunakan informasi, konsep, data untuk menjawab/menyelesaikan masalah.<\/li><li>Menggeneralisasi: kesimpulan dan penerapan pada kondisi baru.<\/li><li>Memberikan penjelasan disertai bukti.<\/li><\/ul><h4>Contoh Soal Resmi<\/h4><p>Soal 1<\/p><ul><li>Kompetensi: Kimia Dasar — Stoikiometri.<\/li><li>Bentuk soal: PGK Kategori.<\/li><li>Kunci: A. Tidak Tepat, B. Tepat, C. Tidak Tepat.<\/li><li>Konteks: menghasilkan 1,435 gram AgCl dari AgNO3 dan NaCl.<\/li><\/ul><p>Soal 2<\/p><ul><li>Kompetensi: Kimia Dasar — Stoikiometri.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: D.<\/li><li>Konteks: senyawa C, H, O; komposisi 40% C, 6,7% H; Mr 180; rumus empiris/molekul.<\/li><\/ul><p>Soal 3<\/p><ul><li>Kompetensi: Kimia Analitik — Larutan dan Sifatnya.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: C.<\/li><li>Konteks: teori asam-basa Bronsted-Lowry pada reaksi H2PO4- + H2O.<\/li><\/ul><p>Soal 4<\/p><ul><li>Kompetensi: Kimia Organik — Struktur dan Sifat Hidrokarbon.<\/li><li>Bentuk soal: PGK Kategori.<\/li><li>Kunci: A. Tepat, B. Tidak Tepat, C. Tepat.<\/li><li>Konteks: titik didih isomer hidrokarbon.<\/li><\/ul><p>Soal 5<\/p><ul><li>Kompetensi: Kimia Fisik — Dinamika.<\/li><li>Bentuk soal: PGK MCMA.<\/li><li>Kunci: Pernyataan 2, 4, dan 5.<\/li><li>Konteks: produksi H2SO4 melalui proses kontak; kesetimbangan 2SO2 + O2 ⇋ 2SO3.<\/li><\/ul>"},{"s":"struktur-atom","t":"Struktur Atom","m":3,"sr":"buatan","h":"<p>Atom terdiri atas proton, neutron, dan elektron. Nomor atom = jumlah proton. Nomor massa = proton + neutron.<\/p>"},{"s":"stoikiometri","t":"Stoikiometri","m":3,"sr":"buatan","h":"<p>n=massa/Mr. Pada STP, 1 mol gas bervolume 22,4 liter.<\/p>"},{"s":"larutan","t":"Larutan","m":3,"sr":"buatan","h":"<p>Molaritas M=n/V. Contoh: 0,5 mol dalam 2 L = 0,25 M.<\/p>"},{"s":"asam-basa","t":"Asam-Basa","m":3,"sr":"buatan","h":"<p>Asam melepas H+, basa melepas OH-. pH=-log[H+]. pH&lt;7 asam, pH=7 netral, pH&gt;7 basa.<\/p>"},{"s":"redoks","t":"Redoks","m":3,"sr":"buatan","h":"<p>Oksidasi adalah kehilangan elektron; reduksi adalah penangkapan elektron.<\/p>"}],"qs":[{"q":"<p>Partikel netral dalam atom adalah …<\/p>","t":"s","o":["Proton","Elektron","Neutron","Ion","Isotop"],"a":[2],"e":"Neutron tidak bermuatan."},{"q":"<p>Nomor massa sama dengan …<\/p>","t":"s","o":["Proton + elektron","Pr melepas H+."},{"q":"<p>pH asam kurang dari …<\/p>","t":"s","o":["7","14","0","10","5"],"a":[0],"e":"Asam pH &lt; 7."},{"q":"<p>Reaksi pembakaran menghasilkan …<\/p>","t":"s","o":["CO2 dan H2O","O2 saja","N2 saja","Logam","Batu"],"a":[0],"e":"Pembakaran hasil CO2 &amp; H2O."}]}</script><script src="../assets/catalog.js"></script><script src="../assets/app.js"></script></body></html>
