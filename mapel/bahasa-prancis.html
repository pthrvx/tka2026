<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bahasa Prancis | Persiapan TKA</title><link rel="stylesheet" href="../assets/app.css?v=1792139313"><link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,700&display=swap" rel="stylesheet"><script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("tka2_set")).theme||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script></head><body><header class="hd w" id="hd"></header><main class="w" id="app"></main><footer class="ft"><div class="w"><p>Website ini dibuat dan dikelola oleh <b>Putra</b>.</p><p class="so"><a href="https://instagram.com/pthrvx" target="_blank" rel="noopener">Instagram</a><a href="https://github.com/pthrvx" target="_blank" rel="noopener">GitHub</a><a href="https://www.tiktok.com/@pthrvx" target="_blank" rel="noopener">TikTok</a></p><p>© 2026 Putra. Soal dan materi untuk latihan mandiri, bukan soal resmi TKA.</p></div></footer><script>window.M={"id":"bahasa-prancis","name":"Bahasa Prancis","tl":"Sumber modul: kisi-kisi resmi Pusmendik dan materi latihan buatan.","mods":[{"s":"kisi-kisi-resmi","t":"Kisi-kisi Resmi Bahasa Prancis","m":3,"sr":"resmi","h":"<h4>Definisi<\/h4><p>TKA Bahasa Prancis mengukur pemahaman membaca (compréhension écrite) teks pendek dalam konteks sehari-hari.<\/p><h4>Muatan<\/h4><p>Karakteristik teks:<\/p><ul><li>Jenis: pengumuman, pesan singkat, deskripsi orang dan tempat, instruksi tanda dan rambu.<\/li><li>Tujuan: memberi informasi, mendeskripsikan, menyampaikan pesan.<\/li><li>Struktur: sederhana, kalimat pendek dan jelas.<\/li><\/ul><p>Kompleksitas:<\/p><ul><li>Kosakata 60–80 kata: perkenalan diri, aktivitas sehari-hari, lingkungan sekitar.<\/li><li>Frekuensi: kosakata sehari-hari yang sering muncul dalam interaksi sosial dasar.<\/li><li>Kalimat: sederhana (subjek + kata kerja + objek) dalam bentuk présent.<\/li><\/ul><p>Materi:<\/p><ul><li>Ungkapan salam dan berpamitan (salutation et prendre congé).<\/li><li>Ungkapan selamat dan harapan (féliciter et souhaiter).<\/li><li>Menyatakan opini (donner des opinions).<\/li><li>Kosakata angka (jam, tanggal).<\/li><li>Pemberitahuan (messages courts et annonces).<\/li><li>Perkenalan diri dan aktivitas sehari-hari (se présenter, la vie quotidienne).<\/li><li>Keberadaan orang dan benda (se situer dans l'espace).<\/li><li>Instruksi tanda dan rambu (panneaux, signes).<\/li><li>Karakteristik seseorang (caractères des personnes).<\/li><li>Kosakata benda dan bangunan publik.<\/li><\/ul><h4>Kompetensi<\/h4><p>Pemahaman membaca mencakup:<\/p><ul><li>Pemahaman inferensial: menarik kesimpulan atau memahami makna tersirat dalam teks.<\/li><\/ul><h4>Matriks Asesmen<\/h4><ol><li>Pemahaman Literal<\/li><li>Menemukan informasi tersurat dari gambar atau teks pendek.<\/li><li>Melengkapi teks rumpang untuk menerapkan kosakata dan ungkapan komunikatif.<\/li><\/ol><ol><li>Reorganisasi<\/li><li>Mengorganisir kalimat pernyataan menjadi paragraf padu.<\/li><\/ol><ol><li>Pemahaman Inferensial<\/li><li>Menemukan informasi tersirat dari gambar atau teks pendek.<\/li><li>Menyimpulkan gambar atau isi teks pendek.<\/li><\/ol><h4>Contoh Soal Resmi<\/h4><p>Teks 1: Dialog \"Au parc\" (Léo, Emma, Paul).<\/p><p>Soal 1<\/p><ul><li>Kompetensi: Pemahaman Literal.<\/li><li>Subkompetensi: menemukan informasi tersurat.<\/li><li>Bentuk soal: PGK MCMA.<\/li><li>Kunci: B, D.<\/li><li>Pertanyaan: Qui est Paul?<\/li><\/ul><p>Teks 2: \"Comprendre les panneaux et les signes\" (Léa dan rambu lalu lintas).<\/p><p>Soal 2<\/p><ul><li>Kompetensi: Pemahaman Literal.<\/li><li>Subkompetensi: menemukan informasi tersurat.<\/li><li>Bentuk soal: PGK Kategori.<\/li><li>Kunci: A. Vrai, B. Vrai, C. Faux.<\/li><\/ul><p>Soal 3<\/p><ul><li>Kompetensi: Pemahaman Inferensial.<\/li><li>Subkompetensi: menyimpulkan isi teks.<\/li><li>Bentuk soal: PGK MCMA.<\/li><li>Kunci: C, D.<\/li><li>Pertanyaan: De quoi parle ce texte?<\/li><\/ul><p>Teks 3: Rutinitas harian Claire.<\/p><p>Soal 4<\/p><ul><li>Kompetensi: Pemahaman Literal.<\/li><li>Subkompetensi: melengkapi teks rumpang.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: B.<\/li><\/ul><p>Soal 5<\/p><ul><li>Kompetensi: Reorganisasi.<\/li><li>Subkompetensi: mengorganisir kalimat menjadi paragraf padu.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: B.<\/li><li>Pertanyaan: Quel est l'ordre correct du message?<\/li><\/ul>"},{"s":"sapaan","t":"Sapaan","m":3,"sr":"buatan","h":"<p>Bonjour = selamat pagi/siang. Bonsoir = selamat sore/malam. Merci = terima kasih.<\/p>"},{"s":"pronomina","t":"Pronomina","m":3,"sr":"buatan","h":"<p>Je = saya, tu = kamu, il/elle = dia, nous = kami, vous = kalian/Anda, ils/elles = mereka.<\/p>"},{"s":"verb-tre-dan-avoir","t":"Verb Être dan Avoir","m":3,"sr":"buatan","h":"<p>Je suis = saya adalah. J’ai = saya punya.<\/p>"}],"qs":[{"q":"<p>“Bonjour” berarti …<\/p>","t":"s","o":["Selamat malam","Selamat pagi/siang","Terima kasih","Maaf","Sampai jumpa"],"a":[1],"e":"Bonjour berarti selamat pagi/siang.","ks":""},{"q":"<p>“Merci” berarti …<\/p>","t":"s","o":["Terima kasih","Maaf","Selamat tinggal","Ya","Tidak"],"a":[0],"e":"Merci berarti terima kasih.","ks":""},{"q":"<p>“Je suis étudiant” berarti …<\/p>","t":"s","o":["Saya adalah pelajar","Saya punya buku","Dia pelajar","Kami pelajar","Kamu pelajar"],"a":[0],"e":"Je suis = saya adalah.","ks":""},{"q":"<p>Pilih semua kata sapaan Prancis.<\/p>","t":"m","o":["Bonjour","Bonsoir","Merci","Au revoir","Nasi goreng"],"a":[0,1,2,3],"e":"Nasi goreng bukan kata Prancis.","ks":""},{"q":"<p>Pilih semua pronomina Prancis.<\/p>","t":"m","o":["Je","Tu","Nous","Vous","Saya"],"a":[0,1,2],"e":"“Saya” adalah bahasa Indonesia.","ks":""},{"q":"<p>“Je m’appelle …” berarti …<\/p>","t":"s","o":["Nama saya …","Saya dari …","Saya suka …","Saya punya …","Saya pergi …"],"a":[0],"e":"Je m’appelle = nama saya.","ks":""},{"q":"<p>“Comment ça va?” bera
