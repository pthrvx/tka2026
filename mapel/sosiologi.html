<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sosiologi | Persiapan TKA</title><link rel="stylesheet" href="../assets/app.css"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet"><script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("tka2_set")).theme||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script></head><body><header class="hd w" id="hd"></header><main class="w" id="app"></main><footer class="ft"><div class="w"><p>Website ini dibuat dan dikelola oleh <b>Putra</b>.</p><p class="so"><a href="https://instagram.com/pthrvx" target="_blank" rel="noopener">Instagram</a><a href="https://github.com/pthrvx" target="_blank" rel="noopener">GitHub</a><a href="https://www.tiktok.com/@pthrvx" target="_blank" rel="noopener">TikTok</a></p><p>© 2026 Putra. Soal dan materi untuk latihan mandiri, bukan soal resmi TKA.</p></div></footer><script>window.M={"id":"sosiologi","name":"Sosiologi","tl":"Sumber modul: kisi-kisi resmi Pusmendik dan materi latihan buatan.","mods":[{"s":"kisi-kisi-resmi","t":"Kisi-kisi Resmi Sosiologi","m":3,"sr":"resmi","h":"<h4>Definisi<\/h4><p>TKA Sosiologi merujuk pada irisan materi Sosiologi pada Kurikulum 2013 dengan Kurikulum Merdeka, mengukur pemahaman konsep, penerapan pada fenomena sosial, dan penalaran kritis terhadap realitas masyarakat.<\/p><h4>Muatan<\/h4><p>Materi inti yang beririsan pada kedua kurikulum:<\/p><ol><li>Sosiologi sebagai Ilmu: hakikat, konsep, sejarah, perspektif, ruang lingkup.<\/li><li>Hubungan dan Gejala Sosial: faktor interaksi, identitas, bentuk hubungan sosial, dampak, gejala sosial.<\/li><li>Penelitian Sosial: konsep dasar, prosedur, teknik pengumpulan data, metode.<\/li><li>Kelompok Sosial, Kesetaraan, dan Konflik Sosial: konsep, karakteristik, dinamika, kesetaraan, konflik.<\/li><li>Perubahan Sosial dan Globalisasi: bentuk perubahan, dampak globalisasi, sikap kritis.<\/li><\/ol><h4>Kompetensi<\/h4><ol><li>Pemahaman: mengenali, mengingat, memahami konsep sosiologi secara faktual; definisi, teori, langkah prosedural.<\/li><li>Penerapan: menerapkan konsep pada fenomena nyata; menganalisis kasus, interpretasi data, pemecahan masalah sosial.<\/li><li>Penalaran: berpikir kritis, mengaitkan konsep dengan realitas, menganalisis data, menemukan pola, merumuskan kesimpulan, memberi rekomendasi.<\/li><\/ol><h4>Matriks Asesmen<\/h4><ol><li>Sosiologi sebagai Ilmu<\/li><li>Mendeskripsikan dan menganalisis pengertian, perkembangan, manfaat sosiologi.<\/li><\/ol><ol><li>Hubungan dan Gejala Sosial<\/li><li>Mengidentifikasi dan menganalisis konsep dan bentuk hubungan sosial.<\/li><li>Mengidentifikasi lembaga sosial dan perannya.<\/li><li>Menjelaskan ragam gejala sosial.<\/li><li>Menganalisis dinamika masyarakat multikultural.<\/li><\/ol><ol><li>Penelitian Sosial<\/li><li>Menjelaskan dan menganalisis langkah dan metode penelitian sosial.<\/li><\/ol><ol><li>Kelompok Sosial, Kesetaraan, dan Konflik Sosial<\/li><li>Mengidentifikasi, menjelaskan, menganalisis kelompok sosial dan dinamikanya.<\/li><li>Memahami faktor ketidaksetaraan dan upaya kesetaraan.<\/li><li>Mendeskripsikan konsep konflik dan analisis penanganan konflik.<\/li><\/ol><ol><li>Perubahan Sosial dan Globalisasi<\/li><li>Mengidentifikasi bentuk perubahan sosial dan dampaknya.<\/li><li>Menjelaskan dan menganalisis pengaruh globalisasi.<\/li><li>Menganalisis fenomena sosial akibat globalisasi secara kritis.<\/li><\/ol><h4>Contoh Soal Resmi<\/h4><p>Soal 1<\/p><ul><li>Kompetensi: mendeskripsikan dan menganalisis pengertian, perkembangan, manfaat sosiologi.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: B.<\/li><li>Pertanyaan: ciri utama objek kajian sosiologi dibanding cabang ilmu lain.<\/li><\/ul><p>Soal 2<\/p><ul><li>Konteks: infografis penggunaan internet anak.<\/li><li>Kompetensi: menjelaskan ragam gejala sosial.<\/li><li>Bentuk soal: PGK Kategori.<\/li><li>Kunci: A. Sesuai, B. Sesuai, C. Tidak Sesuai.<\/li><\/ul><p>Soal 3<\/p><ul><li>Konteks: penelitian pengaruh pergaulan sebaya terhadap kelekatan keluarga.<\/li><li>Kompetensi: menjelaskan dan menganalisis langkah dan metode penelitian sosial.<\/li><li>Bentuk soal: PGK MCMA.<\/li><li>Kunci: A, B, D.<\/li><\/ul><p>Soal 4<\/p><ul><li>Konteks: konflik penduduk lama vs pendatang di Kota Praja terkait ruang publik budaya.<\/li><li>Kompetensi: mendeskripsikan konsep konflik sosial dan menganalisis penanganan konflik.<\/li><li>Bentuk soal: PGK MCMA.<\/li><li>Kunci: B, C, D.<\/li><\/ul><p>Soal 5<\/p><ul><li>Konteks: Hallyu/K-Pop dan dampaknya pada remaja Indonesia.<\/li><li>Kompetensi: mengidentifikasi bentuk perubahan sosial dan menganalisis dampaknya.<\/li><li>Bentuk soal: PGK Kategori.<\/li><li>Kunci: A. Tidak Tepat, B. Tepat, C. Tepat.<\/li><\/ul>"},{"s":"sosialisasi","t":"Sosialisasi","m":3,"sr":"buatan","h":"<p>Sosialisasi adalah proses individu mempelajari nilai, norma, dan peran sosial. Agen utamanya keluarga, sekolah, teman sebaya, dan media.<\/p>"},{"s":"interaksi-sosial","t":"Interaksi Sosial","m":3,"sr":"buatan","h":"<p>Interaksi terjadi jika ada kontak sosial dan komunikasi. Bentuknya: kerja sama, persaingan, konflik, akomodasi, asimilasi.<\/p>"},{"s":"stratifikasi-dan-mobilitas","t":"Stratifikasi dan Mobilitas","m":3,"sr":"buatan","h":"<p>Stratifikasi membagi masyarakat berdasarkan status. Mobilitas sosial adalah perpindahan status sosial.<\/p>"},{"s":"globalisasi","t":"Globalisasi","m":3,"sr":"buatan","h":"<p>Globalisasi mempercepat pertukaran informasi, budaya, teknologi, dan ekonomi antarnegara.<\/p>"}],"qs":[{"q":"<p>Proses mempelajari nilai dan norma sejak kecil disebut …<\/p>","t":"s","o":["Sosialisasi","Migrasi","Mobilitas","Konflik","Akomodasi"],"a":[0],"e":"Sosialisasi membentuk kepribadian sosial."},{"q":"<p>Agen sosialisasi pertama adalah …<\/p>","t":"s","o":["Keluarga","Sekolah","Media","Negara","Teman"],
