<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bahasa Jepang | Persiapan TKA</title><link rel="stylesheet" href="../assets/app.css?v=1792139313"><link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,700&display=swap" rel="stylesheet"><script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("tka2_set")).theme||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script></head><body><header class="hd w" id="hd"></header><main class="w" id="app"></main><footer class="ft"><div class="w"><p>Website ini dibuat dan dikelola oleh <b>Putra</b>.</p><p class="so"><a href="https://instagram.com/pthrvx" target="_blank" rel="noopener">Instagram</a><a href="https://github.com/pthrvx" target="_blank" rel="noopener">GitHub</a><a href="https://www.tiktok.com/@pthrvx" target="_blank" rel="noopener">TikTok</a></p><p>© 2026 Putra. Soal dan materi untuk latihan mandiri, bukan soal resmi TKA.</p></div></footer><script>window.M={"id":"bahasa-jepang","name":"Bahasa Jepang","tl":"Sumber modul: kisi-kisi resmi Pusmendik dan materi latihan buatan.","mods":[{"s":"kisi-kisi-resmi","t":"Kisi-kisi Resmi Bahasa Jepang","m":3,"sr":"resmi","h":"<h4>Definisi<\/h4><p>TKA Bahasa Jepang mengukur kemampuan murid berbahasa Jepang pada level A1 JF Standard dan bernalar kritis-kreatif pada aktivitas komunikasi. Fokus pada keterampilan membaca: memahami ungkapan komunikatif sehari-hari, hal konkret dan rutin, dari kalimat dan teks sederhana.<\/p><h4>Muatan<\/h4><p>Jenis teks:<\/p><ul><li>Interpersonal/transaksional.<\/li><li>Pengumuman.<\/li><li>Pesan singkat.<\/li><li>Deskripsi orang dan tempat.<\/li><\/ul><p>Topik:<\/p><ul><li>Aisatsu (persalaman)<\/li><li>Jikoshoukai (perkenalan diri)<\/li><li>Jikan (waktu)<\/li><li>Kazoku (keluarga)<\/li><li>Dekirukoto (kemampuan)<\/li><li>Gakkou no seikatsu (kehidupan sekolah)<\/li><li>Uchi (rumah)<\/li><li>Mainichi no seikatsu (kehidupan sehari-hari)<\/li><li>Shumi (hobi)<\/li><li>Himana toki (waktu senggang)<\/li><\/ul><p>Kompleksitas:<\/p><ul><li>Teks sederhana: ilustrasi gambar, kata, atau kalimat 5–7 kata.<\/li><li>Teks pendek: maksimal 50 kata.<\/li><li>Pola kalimat: Subjek + Objek + Predikat (SOP) atau ditambah keterangan sederhana.<\/li><li>Aksara: hiragana, katakana, dan/atau romaji sesuai level A1.<\/li><\/ul><h4>Kompetensi<\/h4><ol><li>Pemahaman literal: mengidentifikasi informasi eksplisit dalam teks.<\/li><li>Reorganisasi: mengorganisasi ulang informasi dari teks untuk menjawab pertanyaan.<\/li><li>Pemahaman inferensial: menarik kesimpulan atau memahami makna tersirat.<\/li><\/ol><h4>Matriks Asesmen<\/h4><ol><li>Pemahaman Literal<\/li><li>Menemukan informasi tersurat dari gambar atau teks sederhana.<\/li><li>Melengkapi teks dengan kosakata dan ungkapan komunikatif sesuai topik.<\/li><\/ol><ol><li>Reorganisasi<\/li><li>Menyusun kata-kata menjadi kalimat utuh sesuai struktur Bahasa Jepang.<\/li><\/ol><ol><li>Pemahaman Inferensial<\/li><li>Menyimpulkan informasi tersirat dari teks sederhana.<\/li><li>Mengaplikasikan tata bahasa bentuk negasi, lampau, atau akan datang pada teks sederhana.<\/li><\/ol><h4>Contoh Soal Resmi<\/h4><p>Soal 1<\/p><ul><li>Kompetensi: Pemahaman Literal.<\/li><li>Subkompetensi: melengkapi teks dengan kosakata/ungkapan.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: B.<\/li><li>Konteks: Rika bertanya kepada Kenta tentang makanan pagi.<\/li><\/ul><p>Soal 2<\/p><ul><li>Kompetensi: Pemahaman Literal.<\/li><li>Subkompetensi: melengkapi teks dengan kosakata/ungkapan.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: E.<\/li><li>Konteks: kalimat tentang jam 5 pagi.<\/li><\/ul><p>Soal 3<\/p><ul><li>Kompetensi: Reorganisasi.<\/li><li>Subkompetensi: menyusun kata menjadi kalimat utuh.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: C.<\/li><\/ul><p>Soal 4<\/p><ul><li>Kompetensi: Pemahaman Inferensial.<\/li><li>Subkompetensi: menyimpulkan informasi tersirat dari ilustrasi kalender.<\/li><li>Bentuk soal: PGK Kategori.<\/li><li>Kunci: A. Benar, B. Salah, C. Benar.<\/li><li>Pernyataan: Ashita wa suiyoubi desu; Asatte wa yokka desu; Kinou wa yasumi deshita.<\/li><\/ul><p>Teks: kegiatan mingguan Akiko, Kenta, Maya, Anton.<\/p><p>Soal 5<\/p><ul><li>Kompetensi: Pemahaman Inferensial.<\/li><li>Subkompetensi: menyimpulkan informasi tersirat.<\/li><li>Bentuk soal: PGK Kategori.<\/li><li>Kunci: A. Benar, B. Salah, C. Benar.<\/li><li>Pernyataan: Minna wa supootsu ga suki desu; Akiko san wa nani mo dekimasen; Maya san wa badominton ga suki desu.<\/li><\/ul><p>Soal 6<\/p><ul><li>Kompetensi: Pemahaman Literal.<\/li><li>Subkompetensi: menemukan informasi tersurat dari teks.<\/li><li>Bentuk soal: PGK MCMA.<\/li><li>Kunci: A, B, D.<\/li><\/ul>"},{"s":"aksara","t":"Aksara","m":3,"sr":"buatan","h":"<p>Hiragana untuk kata asli Jepang, katakana untuk kata serapan, kanji untuk huruf Tionghoa.<\/p>"},{"s":"sapaan","t":"Sapaan","m":3,"sr":"buatan","h":"<p>Konnichiwa = selamat siang. Arigatou = terima kasih. Sayounara = sampai jumpa.<\/p>"},{"s":"kalimat-sederhana","t":"Kalimat Sederhana","m":3,"sr":"buatan","h":"<p>Watashi wa pelajar desu = saya adalah pelajar.<\/p>"}],"qs":[{"q":"<p>“Konnichiwa” berarti …<\/p>","t":"s","o":["Selamat pagi","Selamat siang","Terima kasih","Maaf","Sampai jumpa"],"a":[1],"e":"Konnichiwa berarti selamat siang.","ks":""},{"q":"<p>“Arigatou” berarti …<\/p>","t":"s","o":["Terima kasih","Maaf","Selamat tinggal","Ya","Tidak"],"a":[0],"e":"Arigatou berarti terima kasih.","ks":""},{"q":"<p>Aksara untuk kata serapan Jepang adalah …<\/p>","t":"s","o":["Katakana","Hiragana","Kanji","Romaji","Hangul"],"a":[0],"e":"Katakana digunakan untuk kata serapan.","ks":""},{"q":"<p>Pilih semua aksara Jepang.<\/p>","t":"m","o":["Hiragana","Katakana","Kanji","Romaji","Hangul"],"a":[0,1,2,3],"e":"Hangul adalah aksara Korea.","ks":""},{"q":"<p>Pilih semua sapaan Jepang.<\/p>","t":"m","o":["Ohayou","Kon
