<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bahasa Arab | Persiapan TKA</title><link rel="stylesheet" href="../assets/app.css?v=1792139313"><link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,700&display=swap" rel="stylesheet"><script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("tka2_set")).theme||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script></head><body><header class="hd w" id="hd"></header><main class="w" id="app"></main><footer class="ft"><div class="w"><p>Website ini dibuat dan dikelola oleh <b>Putra</b>.</p><p class="so"><a href="https://instagram.com/pthrvx" target="_blank" rel="noopener">Instagram</a><a href="https://github.com/pthrvx" target="_blank" rel="noopener">GitHub</a><a href="https://www.tiktok.com/@pthrvx" target="_blank" rel="noopener">TikTok</a></p><p>© 2026 Putra. Soal dan materi untuk latihan mandiri, bukan soal resmi TKA.</p></div></footer><script>window.M={"id":"bahasa-arab","name":"Bahasa Arab","tl":"Sumber modul: kisi-kisi resmi Pusmendik dan materi latihan buatan.","mods":[{"s":"kisi-kisi-resmi","t":"Kisi-kisi Resmi Bahasa Arab","m":3,"sr":"resmi","h":"<h4>Definisi<\/h4><p>TKA Bahasa Arab bertujuan mengukur kemampuan murid berbahasa Arab: pemahaman teks tersurat (eksplisit) dan tersirat (implisit), serta penguasaan kaidah dasar bahasa Arab dalam aktivitas komunikasi.<\/p><p>TKA Bahasa Arab berfokus pada keterampilan membaca (al-Qirā'ah), yang merupakan aspek utama memperoleh dan mengolah informasi di era teknologi yang menuntut literasi baik.<\/p><h4>Muatan<\/h4><p>Topik teks:<\/p><ul><li>Kehidupan sehari-hari (al-ḥayāt al-yaumiyyah)<\/li><li>Kehidupan sekolah<\/li><li>Kehidupan keluarga<\/li><li>Hobi<\/li><li>Pekerjaan<\/li><li>Pelayanan umum<\/li><li>Lingkungan sekitar (al-bi'ah)<\/li><li>Dialog dengan ungkapan persetujuan (muwāfaqah), perintah (al-amr), larangan (an-nahyu)<\/li><\/ul><p>Kaidah kebahasaan:<\/p><ul><li>Pemilihan kata, struktur kalimat, ungkapan, dan aspek kebahasaan lainnya harus benar dan sesuai.<\/li><\/ul><p>Kompleksitas teks:<\/p><ul><li>Kosakata: bahasa Arab baku (fusha).<\/li><li>Naratif: maksimal 25–50 kosakata (2–4 baris).<\/li><li>Dialog: 5–6 kali tanya jawab.<\/li><li>Kosakata dan kalimat mudah dipahami, tidak rumit, sesuai jenjang murid.<\/li><li>Ungkapan dan kalimat: bentuk umum, sering digunakan, benar secara nahwu dan sharf, familier konteks dunia Arab, lazim dalam buku pelajaran.<\/li><\/ul><h4>Kompetensi<\/h4><p>Keterampilan membaca mencakup 3 aspek:<\/p><ol><li>Pemahaman literal: mengidentifikasi informasi eksplisit.<\/li><li>Reorganisasi: menata ulang informasi untuk menjawab pertanyaan.<\/li><li>Pemahaman inferensial: menyimpulkan makna implisit.<\/li><\/ol><h4>Matriks Asesmen<\/h4><ol><li>Pemahaman Literal<\/li><li>Mengidentifikasi dan menjelaskan informasi tersurat.<\/li><li>Menentukan sinonim atau antonim kata dalam kalimat.<\/li><li>Menentukan arti kosakata (mufradat) dalam konteks kalimat.<\/li><\/ol><ol><li>Reorganisasi<\/li><li>Menyusun kosakata acak menjadi kalimat tepat sesuai konteks dialog/teks sederhana.<\/li><li>Mengurutkan kalimat acak menjadi teks sederhana.<\/li><\/ol><ol><li>Pemahaman Inferensial<\/li><li>Menyimpulkan informasi atau makna tersirat.<\/li><li>Menjelaskan topik atau ide pokok teks sederhana.<\/li><li>Menyimpulkan makna teks berdasarkan gramatika bahasa Arab.<\/li><\/ol><h4>Contoh Soal Resmi<\/h4><p>Soal 1<\/p><ul><li>Kompetensi: Pemahaman Literal.<\/li><li>Subkompetensi: mengidentifikasi dan menjelaskan informasi tersurat.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: C.<\/li><\/ul><p>Soal 2<\/p><ul><li>Kompetensi: Pemahaman Literal.<\/li><li>Subkompetensi: menentukan arti kosakata (mufradat) dalam konteks kalimat.<\/li><li>Bentuk soal: PGK Kategori.<\/li><li>Kunci: A. Benar, B. Salah, C. Benar.<\/li><li>Pernyataan: Saya menyaksikan (Benar), Saya bermain (Salah), Saya menonton (Benar).<\/li><\/ul><p>Soal 3<\/p><ul><li>Kompetensi: Reorganisasi.<\/li><li>Subkompetensi: menyusun kosakata acak menjadi kalimat tepat.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: A.<\/li><li>Instruksi: susun kata-kata menjadi kalimat yang benar.<\/li><\/ul><p>Soal 4<\/p><ul><li>Kompetensi: Pemahaman Inferensial.<\/li><li>Subkompetensi: menyimpulkan informasi/makna tersirat.<\/li><li>Bentuk soal: PGK MCMA.<\/li><li>Kunci: A, C.<\/li><li>Instruksi: jawaban benar lebih dari satu.<\/li><\/ul><p>Soal 5<\/p><ul><li>Kompetensi: Pemahaman Literal.<\/li><li>Subkompetensi: mengidentifikasi dan menjelaskan informasi tersurat.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: A.<\/li><\/ul><p>Soal 6<\/p><ul><li>Kompetensi: Pemahaman Inferensial.<\/li><li>Subkompetensi: menjelaskan topik/ide pokok teks sederhana.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: B.<\/li><\/ul>"},{"s":"huruf-hijaiyah","t":"Huruf Hijaiyah","m":3,"sr":"buatan","h":"<p>Huruf hijaiyah terdiri atas 28 huruf, dari alif sampai ya.<\/p>"},{"s":"sapaan","t":"Sapaan","m":3,"sr":"buatan","h":"<p>As-salamu alaykum = salam sejahtera bagimu. Syukran = terima kasih. Ma’a as-salamah = sampai jumpa.<\/p>"},{"s":"kalimat-sederhana","t":"Kalimat Sederhana","m":3,"sr":"buatan","h":"<p>Ana talib = saya pelajar.<\/p>"}],"qs":[{"q":"<p>Huruf Arab disebut huruf …<\/p>","t":"s","o":["Hijaiyah","Hangul","Hiragana","Katakana","Kanji"],"a":[0],"e":"Huruf Arab disebut hijaiyah.","ks":""},{"q":"<p>“Syukran” berarti …<\/p>","t":"s","o":["Terima kasih","Halo","Maaf","Sampai jumpa","Ya"],"a":[0],"e":"Syukran berarti terima kasih.","ks":""},{"q":"<p>“As-salamu alaykum” berarti …<\/p>","t":"s","o":["Semoga keselamatan atasmu","Terima kasih","Selamat pagi","Sampai jumpa","Maaf"],"a":[0],"e":"Ungkapan tersebut berarti semoga keselamatan atasmu.","ks":""},{"q":"<p>Pilih semua sapaan Arab.<\/p>","t":"m","o":["As-salamu alaykum","Marhaban","Syukran","Ma’a as-salamah","Hello"],"
