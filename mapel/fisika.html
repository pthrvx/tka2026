<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fisika | Persiapan TKA</title><link rel="stylesheet" href="../assets/app.css?v=1792139313"><link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,700&display=swap" rel="stylesheet"><script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("tka2_set")).theme||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script></head><body><header class="hd w" id="hd"></header><main class="w" id="app"></main><footer class="ft"><div class="w"><p>Website ini dibuat dan dikelola oleh <b>Putra</b>.</p><p class="so"><a href="https://instagram.com/pthrvx" target="_blank" rel="noopener">Instagram</a><a href="https://github.com/pthrvx" target="_blank" rel="noopener">GitHub</a><a href="https://www.tiktok.com/@pthrvx" target="_blank" rel="noopener">TikTok</a></p><p>© 2026 Putra. Soal dan materi untuk latihan mandiri, bukan soal resmi TKA.</p></div></footer><script>window.M={"id":"fisika","name":"Fisika","tl":"Sumber modul: kisi-kisi resmi Pusmendik dan materi latihan buatan.","mods":[{"s":"kisi-kisi-resmi","t":"Kisi-kisi Resmi Fisika","m":3,"sr":"resmi","h":"<h4>Definisi<\/h4><p>TKA Fisika mengukur pemahaman konsep, hukum, prinsip fisika serta kemampuan menerapkannya untuk menyelesaikan masalah kontekstual.<\/p><h4>Muatan<\/h4><p>Muatan TKA Fisika mencakup:<\/p><ol><li>Kinematika: gerak benda tanpa mempertimbangkan penyebabnya; posisi, kecepatan, percepatan; gerak lurus, parabola, melingkar beraturan.<\/li><li>Dinamika: hubungan gaya dan gerak berdasarkan hukum Newton; momentum dan impuls.<\/li><li>Fluida: fluida statis dan dinamis; tekanan, hukum Pascal, hukum Archimedes, kontinuitas, Bernoulli.<\/li><li>Gelombang: gelombang mekanik dan elektromagnetik; bunyi dan cahaya.<\/li><li>Kalor dan Termodinamika: suhu, wujud zat, perpindahan kalor, gas ideal, hukum termodinamika.<\/li><li>Kelistrikan: listrik statis dan arus searah; hukum kelistrikan, medan listrik, potensial listrik, rangkaian sederhana.<\/li><\/ol><p>Konteks soal:<\/p><ul><li>Fenomena fisika di lingkungan.<\/li><li>Makhluk hidup.<\/li><li>Teknologi.<\/li><li>Percobaan/penyelidikan.<\/li><\/ul><h4>Kompetensi<\/h4><p>Kemampuan yang diukur:<\/p><ol><li>Pemahaman konseptual.<\/li><li>Penerapan prinsip fisika.<\/li><li>Analisis dan evaluasi fenomena.<\/li><li>Keterampilan proses sains.<\/li><\/ol><p>Level kognitif:<\/p><ol><li>Level 1 Pemahaman: mengingat, mengklasifikasikan, menjelaskan hubungan dasar.<\/li><li>Level 2 Penerapan: menggunakan konsep untuk menyelesaikan masalah kontekstual.<\/li><li>Level 3 Analisis dan Evaluasi: menelaah hubungan antarbesaran, membangun argumen, menilai prinsip fisika.<\/li><\/ol><h4>Matriks Asesmen<\/h4><ol><li>Kinematika<\/li><li>Pengukuran: menelaah hasil pengukuran dengan alat ukur sesuai; jangka sorong, mikrometer sekrup, neraca tiga lengan; aturan angka penting.<\/li><li>Gerak lurus: menganalisis keterkaitan besaran gerak lurus; jarak, perpindahan, kecepatan, GLB, GLBB.<\/li><li>Gerak lengkung: gerak parabola (referensi bidang horizontal) dan gerak melingkar beraturan.<\/li><\/ol><ol><li>Dinamika<\/li><li>Hukum Newton: hukum I, II, III; jenis-jenis gaya.<\/li><li>Momentum dan impuls: konsep momentum, impuls, hukum kekekalan momentum.<\/li><li>Dinamika rotasi: momen gaya, momen inersia, hukum Newton rotasi.<\/li><\/ol><ol><li>Fluida<\/li><li>Fluida statis dan dinamis: tekanan fluida, Pascal, Archimedes, kontinuitas, Bernoulli.<\/li><\/ol><ol><li>Gelombang<\/li><li>Bunyi: karakteristik gelombang mekanik bunyi, sumber dan intensitas bunyi.<\/li><li>Cahaya: pembiasan, cermin, lensa, alat optik.<\/li><\/ol><ol><li>Kalor dan Termodinamika<\/li><li>Termodinamika: perubahan kalor, energi dalam, usaha; mesin Carnot.<\/li><\/ol><ol><li>Kelistrikan<\/li><li>Listrik statis: medan listrik, potensial, gaya listrik.<\/li><\/ol><h4>Contoh Soal Resmi<\/h4><p>Soal 1<\/p><ul><li>Kompetensi: Kinematika — Gerak Lurus.<\/li><li>Bentuk soal: PGK MCMA.<\/li><li>Kunci: Grafik 1 dan Grafik 2.<\/li><li>Konteks: data kecepatan benda selama 4 sekon; grafik besaran terhadap waktu.<\/li><\/ul><p>Soal 2<\/p><ul><li>Kompetensi: Dinamika — Dinamika Rotasi.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: B.<\/li><li>Konteks: pemain sirkus memegang tongkat panjang untuk menjaga keseimbangan.<\/li><\/ul><p>Soal 3<\/p><ul><li>Kompetensi: Fluida — Fluida Statis dan Dinamis.<\/li><li>Bentuk soal: PGK MCMA.<\/li><li>Kunci: Pernyataan 2 dan Pernyataan 3.<\/li><li>Konteks: botol semprot parfum.<\/li><\/ul><p>Soal 4<\/p><ul><li>Kompetensi: Gelombang — Cahaya.<\/li><li>Bentuk soal: PGK Kategori.<\/li><li>Kunci: A. Benar, B. Salah, C. Benar.<\/li><li>Konteks: pemanah menombak ikan; pembiasan cahaya.<\/li><\/ul><p>Soal 5<\/p><ul><li>Kompetensi: Kalor dan Termodinamika.<\/li><li>Bentuk soal: PGK MCMA.<\/li><li>Kunci: Pernyataan 2 dan Pernyataan 3.<\/li><li>Konteks: mesin Carnot 800 K dan 480 K.<\/li><\/ul><p>Soal 6<\/p><ul><li>Kompetensi: Kelistrikan — Listrik Statis.<\/li><li>Bentuk soal: PGK Kategori.<\/li><li>Kunci: A. Benar, B. Salah, C. Benar.<\/li><li>Konteks: mesin fotokopi, toner bermuatan, medan listrik.<\/li><\/ul>"},{"s":"kinematika","t":"Kinematika","m":3,"sr":"buatan","h":"<p>Kecepatan v=s/t. Percepatan a=(v2-v1)/t. GLBB: v=v0+at; s=v0t+1/2at^2.<\/p>"},{"s":"dinamika","t":"Dinamika","m":3,"sr":"buatan","h":"<p>Hukum II Newton: F=m x a. Berat benda W=m x g dengan g=10 m/s^2.<\/p>"},{"s":"usaha-dan-energi","t":"Usaha dan Energi","m":3,"sr":"buatan","h":"<p>Usaha W=F x s x cos theta. Energi kinetik Ek=1/2mv^2. Energi potensial Ep=mgh. Daya P=W/t.<\/p>"},{"s":"gelombang","t":"Gelombang","m":3,"sr":"buatan","h":"<p>Cepat rambat v=lambda x f. Frekuensi f=1/T.<\/p>"},{"s":"listrik","t":"Listrik","m":3,"sr":"buatan","h":"<p>Hukum Ohm: V=I x R. Daya P=V x I. Energi W=P x t.<\/p>"}],"qs":[{"q":"<p>Satuan gaya
