elidikan.<\/li><li>Memproses, menganalisis data dan informasi.<\/li><\/ol><p>Konteks: kesehatan, lingkungan, pertanian, sosiokultural.<\/p><h4>Kompetensi<\/h4><ol><li>Pemahaman: menjelaskan konsep biologi.<\/li><li>Penerapan: menerapkan konsep untuk memecahkan masalah.<\/li><li>Penalaran: menganalisis, mengevaluasi, menarik kesimpulan, mengembangkan argumen berbasis bukti.<\/li><\/ol><h4>Matriks Asesmen<\/h4><ol><li>Keanekaragaman Hayati<\/li><li>Klasifikasi: menganalisis prinsip klasifikasi dan keanekaragaman hayati Indonesia.<\/li><li>Bakteri: menganalisis struktur, resistensi, dan peran bakteri.<\/li><li>Ekosistem: menganalisis komponen, interaksi, dan solusi permasalahan ekosistem Indonesia.<\/li><\/ol><ol><li>Sel<\/li><li>Metabolisme: menganalisis katabolisme, anabolisme, sifat dan cara kerja enzim.<\/li><\/ol><ol><li>Proses pada Makhluk Hidup<\/li><li>Transport/pertukaran zat: keterkaitan sirkulasi, respirasi, ekskresi.<\/li><li>Sistem imun: mekanisme kerja imun.<\/li><li>Sistem koordinasi: mekanisme saraf dan hormon.<\/li><li>Sistem reproduksi: struktur dan fungsi organ reproduksi.<\/li><\/ol><ol><li>Keterampilan Proses<\/li><li>Merumuskan pertanyaan yang dapat diselidiki.<\/li><li>Merancang penyelidikan ilmiah.<\/li><li>Mengolah data dan menyimpulkan hasil.<\/li><\/ol><h4>Contoh Soal Resmi<\/h4><p>Soal 1<\/p><ul><li>Kompetensi: ekosistem.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: D.<\/li><li>Konteks: jaring-jaring makanan ekosistem laut; dampak penurunan ikan kecil.<\/li><\/ul><p>Soal 2<\/p><ul><li>Kompetensi: metabolisme dan enzim.<\/li><li>Bentuk soal: PGK MCMA.<\/li><li>Kunci: Pernyataan 1, 2, 3, dan 5.<\/li><li>Konteks: kerusakan RE kasar dan RE halus.<\/li><\/ul><p>Soal 3<\/p><ul><li>Kompetensi: sistem imun.<\/li><li>Bentuk soal: PGK MCMA.<\/li><li>Kunci: Pernyataan 1, 3, dan 5.<\/li><li>Konteks: data vaksinasi Covid-19.<\/li><\/ul><p>Soal 4<\/p><ul><li>Kompetensi: sistem reproduksi.<\/li><li>Bentuk soal: PGK Kategori.<\/li><li>Kunci: Benar, Benar, Salah.<\/li><li>Konteks: kehamilan ektopik.<\/li><\/ul><p>Soal 5<\/p><ul><li>Kompetensi: merencanakan penyelidikan.<\/li><li>Bentuk soal: PGK Kategori.<\/li><li>Kunci: Tidak Tepat, Tidak Tepat, Tepat.<\/li><li>Konteks: uji benih jagung toko vs hasil panen.<\/li><\/ul><p>Soal 6<\/p><ul><li>Kompetensi: bakteri.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: E.<\/li><li>Konteks: fermentasi yogurt.<\/li><\/ul><p>Soal 7<\/p><ul><li>Kompetensi: metabolisme.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: C.<\/li><li>Konteks: katabolisme pada sel otot.<\/li><\/ul><p>Soal 8<\/p><ul><li>Kompetensi: sistem respirasi.<\/li><li>Bentuk soal: PGK Kategori.<\/li><li>Kunci: A. Benar, B. Benar, C. Salah.<\/li><li>Konteks: pemulihan napas setelah lari.<\/li><\/ul><p>Soal 9<\/p><ul><li>Kompetensi: sistem ekskresi.<\/li><li>Bentuk soal: PGK MCMA.<\/li><li>Kunci: D dan E.<\/li><li>Konteks: cuci darah pada kerusakan ginjal.<\/li><\/ul><p>Soal 10<\/p><ul><li>Kompetensi: merumuskan pertanyaan ilmiah.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: C.<\/li><li>Konteks: katak di kolam ikan hias.<\/li><\/ul>"},{"s":"sel","t":"Sel","m":3,"sr":"buatan","h":"<p>Sel adalah unit terkecil kehidupan. Sel prokariotik tidak memiliki membran inti; sel eukariotik memiliki membran inti.<\/p>"},{"s":"metabolisme","t":"Metabolisme","m":3,"sr":"buatan","h":"<p>Anabolisme menyusun zat, katabolisme menguraikan zat. Fotosintesis terjadi pada kloroplas.<\/p>"},{"s":"genetika","t":"Genetika","m":3,"sr":"buatan","h":"<p>DNA membawa informasi genetik. Gen adalah segmen DNA yang mengatur sifat.<\/p>"},{"s":"ekosistem","t":"Ekosistem","m":3,"sr":"buatan","h":"<p>Aliran energi dimulai dari produsen, lalu konsumen, dan pengurai.<\/p>"}],"qs":[{"q":"<p>Unit terkecil kehidupan adalah …<\/p>","t":"s","o":["Jaringan","Organ","Sel","Organisme","Populasi"],"a":[2],"e":"Sel adalah unit terkecil kehidupan.","ks":""},{"q":"<p>Organel tempat respirasi sel adalah …<\/p>","t":"s","o":["Ribosom","Mitokondria","Kloroplas","Vakuola","Nukleus"],"a":[1],"
