<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bahasa Jerman | Persiapan TKA</title><link rel="stylesheet" href="../assets/app.css?v=1792139313"><link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,700&display=swap" rel="stylesheet"><script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("tka2_set")).theme||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script></head><body><header class="hd w" id="hd"></header><main class="w" id="app"></main><footer class="ft"><div class="w"><p>Website ini dibuat dan dikelola oleh <b>Putra</b>.</p><p class="so"><a href="https://instagram.com/pthrvx" target="_blank" rel="noopener">Instagram</a><a href="https://github.com/pthrvx" target="_blank" rel="noopener">GitHub</a><a href="https://www.tiktok.com/@pthrvx" target="_blank" rel="noopener">TikTok</a></p><p>© 2026 Putra. Soal dan materi untuk latihan mandiri, bukan soal resmi TKA.</p></div></footer><script>window.M={"id":"bahasa-jerman","name":"Bahasa Jerman","tl":"Sumber modul: kisi-kisi resmi Pusmendik dan materi latihan buatan.","mods":[{"s":"kisi-kisi-resmi","t":"Kisi-kisi Resmi Bahasa Jerman","m":3,"sr":"resmi","h":"<h4>Definisi<\/h4><p>TKA Bahasa Jerman dirancang untuk mengukur kemampuan murid berbahasa Jerman pada level A1 Plus hingga A2.1 sesuai standar Gemeinsamer Europäischen Referenzrahmen für Sprache (GER) atau CEFR. GER menekankan kemampuan komunikasi praktis, bukan hanya teori atau aturan bahasa.<\/p><p>TKA Bahasa Jerman difokuskan pada keterampilan membaca: memahami informasi terkait ungkapan komunikatif sehari-hari, hal konkret dan rutin, dari teks tulis sederhana dengan konteks negara penutur Bahasa Jerman.<\/p><h4>Muatan<\/h4><p>Jenis teks:<\/p><ul><li>Naratif, deskripsi, dialog.<\/li><li>Teks fungsional: formulir, kartu identitas, jadwal pelajaran (Stundenplan), e-mail, pemberitahuan (Zettel/Informationsschilder), iklan singkat (kurze Anzeigen), papan petunjuk (Hinweisschilder/Aushänge), agenda/buku harian (Terminkalender/Tagebuch), tiket perjalanan (Fahrkarte), jadwal perjalanan (Fahrplan), resep makanan (Kochrezepte), brosur (Broschüre), statistik sederhana, rencana perjalanan (Reiseprogramm).<\/li><\/ul><p>Topik:<\/p><ul><li>Identität (identitas)<\/li><li>Schulleben (kehidupan sekolah)<\/li><li>Familien (keluarga)<\/li><li>Wohnen (tempat tinggal)<\/li><li>Freizeitaktivitäten (aktivitas waktu luang)<\/li><li>Berufe (pekerjaan)<\/li><li>Essen und Trinken (makan dan minum)<\/li><li>Einkaufen (berbelanja)<\/li><li>Reisen (perjalanan)<\/li><\/ul><p>Kompleksitas:<\/p><ul><li>Kosakata: sekitar 750 kata (650 kata A1 plus + 100 kata baru A2.1).<\/li><li>Jumlah kata teks: 3–100 kata tergantung jenis teks.<\/li><li>Tata bahasa: artikel, konjugasi, konjungsi, posisi verba, kalimat pernyataan/W-Fragen/Ja-Nein-Fragen, verba reguler/sein/haben/verba tak beraturan, preposisi Dativ dan Akkusativ, Wechselpräpositionen, modalverben, negasi nicht, possessivartikel, negativartikel kein, Nominativ-Akkusativ, pronomina, imperativ, Präteritum haben/sein, Perfekt, indefinitpronomen man.<\/li><\/ul><h4>Kompetensi<\/h4><ol><li>Memahami informasi umum (globales Lesen): menangkap ide pokok/topik utama; pemahaman inferensial.<\/li><li>Memahami informasi selektif (selektives Lesen): menemukan informasi spesifik (nama, waktu, tempat, detail); literal dan inferensial.<\/li><li>Memahami informasi rinci dan hubungan antarbagian (detailliertes Lesen): memahami detail, urutan peristiwa, sebab-akibat; literal, inferensial, reorganisasi.<\/li><li>Menggunakan kosakata aktif sesuai konteks: mengenali dan memilih kata/frasa sesuai situasi; makna kata dari konteks, sinonim, kolokasi.<\/li><\/ol><h4>Matriks Asesmen<\/h4><ol><li>Pemahaman Literal<\/li><li>Menentukan informasi spesifik.<\/li><li>Menentukan informasi detail.<\/li><li>Menggunakan kosakata dan ungkapan komunikatif yang tepat sesuai konteks secara literal dalam teks rumpang sederhana.<\/li><\/ol><ol><li>Reorganisasi<\/li><li>Menyusun teks berdasarkan pemahaman terhadap teks tulis sederhana.<\/li><\/ol><ol><li>Pemahaman Inferensial<\/li><li>Menentukan informasi umum.<\/li><li>Menentukan informasi spesifik.<\/li><li>Menentukan informasi detail yang tersirat.<\/li><li>Menggunakan kosakata dan ungkapan komunikatif yang tepat secara inferensial.<\/li><\/ol><h4>Contoh Soal Resmi<\/h4><p>Teks 1: teks naratif tentang Ulrike dan sekolahnya.<\/p><p>Soal 1<\/p><ul><li>Kompetensi: Reorganisasi.<\/li><li>Subkompetensi: menyusun teks berdasarkan pemahaman.<\/li><li>Bentuk soal: PGK MCMA.<\/li><li>Kunci: E.<\/li><li>Instruksi: urutkan kalimat sesuai informasi teks.<\/li><\/ul><p>Soal 2<\/p><ul><li>Kompetensi: Pemahaman Inferensial.<\/li><li>Subkompetensi: informasi detail tersirat.<\/li><li>Bentuk soal: PGK MCMA.<\/li><li>Kunci: B, C.<\/li><li>Instruksi: pilih dua pernyataan yang benar.<\/li><\/ul><p>Soal 3<\/p><ul><li>Kompetensi: Pemahaman Inferensial.<\/li><li>Subkompetensi: informasi detail tersirat.<\/li><li>Bentuk soal: PGK Kategori.<\/li><li>Kunci: A. F, B. R, C. F.<\/li><li>Pernyataan: Ulrike pergi jam 8, pelajaran mulai jam 9, sekolah Senin-Sabtu.<\/li><\/ul><p>Teks 2: foto keluarga Weber.<\/p><p>Soal 4<\/p><ul><li>Kompetensi: Pemahaman Literal.<\/li><li>Subkompetensi: kosakata sesuai konteks pada teks rumpang.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: D.<\/li><\/ul><p>Teks 3: formulir.<\/p><p>Soal 5<\/p><ul><li>Kompetensi: Pemahaman Literal.<\/li><li>Subkompetensi: informasi detail tersurat.<\/li><li>Bentuk soal: PGK MCMA.<\/li><li>Kunci: A, B.<\/li><\/ul><p>Teks 4: dialog di restoran.<\/p><p>Soal 6<\/p><ul><li>Kompetensi: Pemahaman Inferensial.<\/li><li>Subkompetensi: informasi detail tersirat.<\/li><li>Bentuk soal: PGK Kategori.<\/li><li>Kunci: A. R, B. R, C. F.<\/li><li>Pernyataan: tamu memesan pizza Margherita, pelayan menanyakan tambahan, tamu ingin dessert.<\/li><\/ul>"},{"s":"sapaan","t":"Sapaan","m":3,"sr":"buatan","h":"<p>Guten Morgen = selamat pagi. Guten Tag = selamat siang. Danke = terima kasih.<\/p>"},{"s":"pronomina","t":"Pronomina","m":3,"sr":"buatan","h":"<p>Ich = saya, du = kamu, er/sie = dia, wir = kami, ihr = kalian, sie = mereka.<\/p>"},{"s":"verb-sein-dan-haben","t":"Verb Sein dan Haben","m":3,"sr":"buatan","h":"<p>Ich bin = saya adalah. Ich habe = saya punya.<\/p>"}],"qs":[{"q":"<p>“Guten Morgen” berarti …<\/p>","t":"s","o":["Selamat pagi","Selamat malam","Terima kasih","Maaf","Sampai jumpa"],"a":[0],"e":"Guten Morgen berarti selamat pagi.","ks":""},{"q":"<p>“Danke” berarti …<\/p>","t":"s","o":["Terima kasih","Maaf","Selamat tinggal","Ya","Tidak"],"a":[0],"e":"Danke berarti terima kasih.","ks":""},{"q":"<p>“Ich bin Schüler” berarti …<\/p>","t":"s","o":["Saya adalah pelajar","Saya punya buku","Dia pelajar","Kami pelajar","Kamu pelajar"],"a":[0],"e":"Ich bin = saya adalah.","ks":""},{"q":"<p>Pilih semua kata sapaan Jerman.<\/p>","t":"m","o":["Guten Morgen","Guten Tag","Danke","Auf Wiedersehen","Nasi goreng"],"a":[0,1,2,3],"e":"Nasi goreng bukan kata Jerman.","ks":""},{"q":"<p>Pilih semua pronomina Jerman.<\/p>","t":"m","o":["Ich","Du","Wir","Sie","Saya"],"a":[0,1,2,3],"e":"“Saya” adalah bahasa Indonesia.","ks":""},{"q":"<p>“Ich heiße …” berarti …<\/p>","t":"s","o":["Nama saya …","Saya dari …","Saya suka …","Saya punya …","Saya pergi …"],"a":[0],"e":"Ich heiße = nama saya.","ks":""},{"q":"<p>“Wie geht es dir?” berarti …<\/p>","t":"s","o":["Apa kabar?","Siapa nama?","Dari mana?","Ke mana?","Berapa umur?"],"a":[0],"e":"Wie geht es dir = apa kabar.","ks":""},{"q":"<p>“Mir geht es gut” berarti …<\/p>","t":"s","o":["Saya baik","Saya sakit","Saya lelah","Saya lapar","Saya sedih"],"a":[0],"e":"Mir geht es gut = saya baik.","ks":""},{"q":"<p>“Bitte” berarti …<\/p>","t":"s","o":["Tolong","Terima kasih","Maaf","Ya","Tidak"],"a":[0],"e":"Bitte = tolong.","ks":""},{"q":"<p>“Entschuldigung” berarti …<\/p>","t":"s","o":["Maaf","Terima kasih","Ya","Tidak","Selamat tinggal"],"a":[0],"e":"Entschuldigung = maaf.","ks":""},{"q":"<p>“Ja” berarti …<\/p>","t":"s","o":["Ya","Tidak","Mungkin","Tolong","Maaf"],"a":[0],"e":"Ja = ya.","ks":""},{"q":"<p>“Nein” berarti …<\/p>","t":"s","o":["Tidak","Ya","Mungkin","Tolong","Maaf"],"a":[0],"e":"Nein = tidak.","ks":""},{"q":"<p>“Eins, zwei, drei” berarti …<\/p>","t":"s","o":["1, 2, 3","3, 2, 1","1, 1, 1","2, 2, 2","3, 3, 3"],"a":[0],"e":"Eins=1, zwei=2, drei=3.","ks":""},{"q":"<p>“Montag” berarti …<\/p>","t":"s","o":["Senin","Selasa","Rabu","Kamis","Jumat"],"a":[0],"e":"Montag = Senin.","ks":""},{"q":"<p>“Rot” berarti warna …<\/p>","t":"s","o":["Merah","Biru","Hijau","Kuning","Hitam"],"a":[0],"e":"Rot = merah.","ks":""}]}</script><script src="../assets/catalog.js?v=1792139313"></script><script src="../assets/app.js?v=1792139313"></script></body></html>
