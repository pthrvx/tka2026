<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bahasa Mandarin | Persiapan TKA</title><link rel="stylesheet" href="../assets/app.css"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet"><script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("tka2_set")).theme||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script></head><body><header class="hd w" id="hd"></header><main class="w" id="app"></main><footer class="ft"><div class="w"><p>Website ini dibuat dan dikelola oleh <b>Putra</b>.</p><p class="so"><a href="https://instagram.com/pthrvx" target="_blank" rel="noopener">Instagram</a><a href="https://github.com/pthrvx" target="_blank" rel="noopener">GitHub</a><a href="https://www.tiktok.com/@pthrvx" target="_blank" rel="noopener">TikTok</a></p><p>© 2026 Putra. Soal dan materi untuk latihan mandiri, bukan soal resmi TKA.</p></div></footer><script>window.M={"id":"bahasa-mandarin","name":"Bahasa Mandarin","tl":"Sumber modul: kisi-kisi resmi Pusmendik dan materi latihan buatan.","mods":[{"s":"kisi-kisi-resmi","t":"Kisi-kisi Resmi Bahasa Mandarin","m":3,"sr":"resmi","h":"<h4>Definisi<\/h4><p>TKA Bahasa Mandarin menguji kemampuan murid memahami bahasa Mandarin dasar pada level HSK 1, setara A1 CEFR. Fokus pada keterampilan membaca: memahami informasi dari teks pendek dan ungkapan komunikatif sehari-hari.<\/p><h4>Muatan<\/h4><p>Topik: identitas diri, kehidupan sekolah, keluarga, kehidupan sehari-hari, hobi/waktu senggang.<\/p><p>Aksara: Hanzi sederhana (简体字) dengan Hanyu Pinyin; jarang idiom/konsep abstrak.<\/p><p>Struktur kalimat: pola tanya sederhana (什么, 谁, 哪里, 吗); pola S+V+O, S+是+N, S+在+lokasi.<\/p><p>Kosakata: 150 kosakata dasar HSK 1; konkret (benda, aktivitas, tempat, angka).<\/p><p>Radikal yang digunakan: 亻, 口, 女, 讠, 宀, 氵, 心/忄, 扌, 辶, 门, 囗, 礻, ⻏, 饣, 日, 目, 月, 扌, 艹, 宀.<\/p><h4>Kompetensi<\/h4><ol><li>Pemahaman literal: mengidentifikasi informasi eksplisit.<\/li><li>Reorganisasi: menata ulang informasi.<\/li><li>Pemahaman inferensial: menyimpulkan makna implisit.<\/li><\/ol><h4>Matriks Asesmen<\/h4><ol><li>Pemahaman Literal<\/li><li>Menemukan dan memahami informasi penting eksplisit.<\/li><li>Melengkapi kalimat/teks rumpang dengan kosakata sederhana.<\/li><\/ol><ol><li>Reorganisasi<\/li><li>Menyusun kosakata menjadi kalimat sederhana.<\/li><li>Mengurutkan kalimat acak menjadi teks runtut.<\/li><\/ol><ol><li>Pemahaman Inferensial<\/li><li>Menyimpulkan informasi implisit dari teks/gambar.<\/li><li>Menganalisis tata bahasa dalam kalimat.<\/li><\/ol><h4>Contoh Soal Resmi<\/h4><p>Teks: dialog tentang menulis dan membaca \"高兴\" (gāoxìng).<\/p><p>Soal 1<\/p><ul><li>Kompetensi: Pemahaman Literal.<\/li><li>Subkompetensi: mengidentifikasi Hanyu Pinyin, kosakata, guratan, makna kata.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: E.<\/li><li>Pertanyaan: Apa arti kata \"高兴\"?<\/li><\/ul><p>Soal 2<\/p><ul><li>Kompetensi: Pemahaman Inferensial.<\/li><li>Subkompetensi: menyimpulkan informasi implisit.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: B.<\/li><li>Pertanyaan: Tāmen zài nǎr? (Mereka di mana?)<\/li><\/ul><p>Soal 3<\/p><ul><li>Kompetensi: Reorganisasi.<\/li><li>Subkompetensi: mengurutkan kalimat acak menjadi paragraf.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: B.<\/li><li>Konteks: dialog Lánlán dan Mǎlì tentang buku.<\/li><\/ul><p>Soal 4<\/p><ul><li>Kompetensi: Pemahaman Inferensial.<\/li><li>Subkompetensi: menyimpulkan informasi implisit dari dialog.<\/li><li>Bentuk soal: PGK Kategori.<\/li><li>Kunci: A. Salah, B. Salah, C. Benar.<\/li><li>Pernyataan: Nà búshì yì běn shū; Lánlán yǒu yī běn shū; Mǎlì shuō shū shì tā de.<\/li><\/ul><p>Soal 5<\/p><ul><li>Kompetensi: Reorganisasi.<\/li><li>Subkompetensi: menyusun kosakata menjadi kalimat.<\/li><li>Bentuk soal: PGK MCMA.<\/li><li>Kunci: B, D.<\/li><li>Konteks: nǐ / shénme / cài / xǐhuan.<\/li><\/ul><p>Soal 6<\/p><ul><li>Kompetensi: Pemahaman Literal.<\/li><li>Subkompetensi: melengkapi teks rumpang.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: B.<\/li><li>Konteks: Tā hěn xǐhuan ___.<\/li><\/ul>"},{"s":"sapaan","t":"Sapaan","m":3,"sr":"buatan","h":"<p>Nǐ hǎo = halo. Xièxie = terima kasih. Zàijiàn = sampai jumpa.<\/p>"},{"s":"pronomina","t":"Pronomina","m":3,"sr":"buatan","h":"<p>Wǒ = saya, nǐ = kamu, tā = dia, wǒmen = kami, nǐmen = kalian.<\/p>"},{"s":"kalimat-sederhana","t":"Kalimat Sederhana","m":3,"sr":"buatan","h":"<p>Wǒ shì xuéshēng = saya adalah pelajar.<\/p>"}],"qs":[{"q":"<p>“Nǐ hǎo” berarti …<\/p>","t":"s","o":["Halo","Terima kasih","Maaf","Sampai jumpa","Selamat malam"],"a":[0],"e":"Nǐ hǎo berarti halo."},{"q":"<p>“Xièxie” berarti …<\/p>","t":"s","o":["Terima kasih","Maaf","Selamat tinggal","Ya","Tidak"],"a":[0],"e":"Xièxie berarti terima kasih."},{"q":"<p>“Wǒ shì xuéshēng” berarti …<\/p>","t":"s","o":["Saya adalah pelajar","Saya punya buku","Dia pelajar","Kami pelajar","Kamu pelajar"],"a":[0],"e":"Wǒ shì = saya adalah."},{"q":"<p>PGK. Pilih semua sapaan Mandarin.<\/p>","t":"m","o":["Nǐ hǎo","Zǎoshang hǎo","Wǎnshang hǎo","Zàijiàn","Hello"],"a":[0,1,2,3],"e":"Hello adalah bahasa Inggris."},{"q":"<p>PGK. Pilih semua pronomina Mandarin.<\/p>","t":"m","o":["Wǒ","Nǐ","Tā","Wǒmen","Saya"],"a":[0,1,2,3],"e":"“Saya” adalah bahasa Indonesia."},{"q":"<p>“Wǒ jiào …” berarti …<\/p>","t":"s","o":["Nama saya …","Saya dari …","Saya suka …","Saya punya …","Saya pergi …"],"a":[0],"e":"Wǒ jiào = nama saya."},{"q":"<p>“Nǐ hǎo ma?” berarti …<\/p>","t":"s","o":["Apa kabar?","Siapa nama?","Dari mana?","Ke mana?","Berapa umur?"],"a":[0],"e":"Nǐ hǎo ma = apa kabar."},{"q":"<p>“Wǒ hěn hǎo” berarti …<\/p>","t":"s","o":["Saya baik","Saya sakit","Saya lelah","Saya lapar","Saya lelah"],"a":[0],"e":"Wǒ hěn hǎo = saya baik."},{"q":"<p>“Qǐng” berarti …<\/p>","t":"s","o":["Tolong","Terima kasih","Maaf","Ya","Tidak"],"a":[0],"e":"Qǐng = tolong."},{"q":"<p>“Duìbùqǐ”
