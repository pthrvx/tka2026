<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bahasa Indonesia Tingkat Lanjut | Persiapan TKA</title><link rel="stylesheet" href="../assets/app.css"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet"><script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("tka2_set")).theme||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script></head><body><header class="hd w" id="hd"></header><main class="w" id="app"></main><footer class="ft"><div class="w"><p>Website ini dibuat dan dikelola oleh <b>Putra</b>.</p><p class="so"><a href="https://instagram.com/pthrvx" target="_blank" rel="noopener">Instagram</a><a href="https://github.com/pthrvx" target="_blank" rel="noopener">GitHub</a><a href="https://www.tiktok.com/@pthrvx" target="_blank" rel="noopener">TikTok</a></p><p>© 2026 Putra. Soal dan materi untuk latihan mandiri, bukan soal resmi TKA.</p></div></footer><script>window.M={"id":"bahasa-indonesia-tingkat-lanjut","name":"Bahasa Indonesia Tingkat Lanjut","tl":"Sumber modul: kisi-kisi resmi Pusmendik dan materi latihan buatan.","mods":[{"s":"kisi-kisi-resmi","t":"Kisi-kisi Resmi Bahasa Indonesia Tingkat Lanjut","m":3,"sr":"resmi","h":"<h4>Definisi<\/h4><p>TKA Bahasa Indonesia Tingkat Lanjut mengukur keterampilan membaca pada teks informasi tunggal maupun jamak serta teks fiksi.<\/p><h4>Muatan<\/h4><p>Teks informasi tunggal maupun jamak berisi fakta, konsep, prosedur, dan metakognisi dari berbagai bidang/topik, genre, dan konteks dalam skala lokal, nasional, dan global.<\/p><p>Teks fiksi berupa realisme atau absurd dengan latar konkret, metaforis, atau abstrak; tokoh berkarakter bulat; konflik tunggal/jamak dengan penyelesaian terbuka; alur campuran; dan sudut pandang campuran.<\/p><p>Karakteristik kompleksitas teks:<\/p><ul><li>Kosakata: kata khusus dan umum, imbuhan kompleks, kata abstrak, makna denotatif, istilah teknis, konotatif konteks luas, nuansa makna.<\/li><li>Kalimat: kalimat kompleks berbagai pola, efektif, dan logis.<\/li><li>Wacana: kohesif dan koheren, konjungsi antarparagraf, ejaan; panjang 300–350 kata (kecuali puisi).<\/li><\/ul><h4>Kompetensi<\/h4><ol><li>Mengidentifikasi informasi tersurat.<\/li><li>Menyusun ulang, mengelompokkan, membuat ikhtisar, menyajikan kembali informasi tersurat.<\/li><li>Mengidentifikasi dan menyimpulkan informasi tersirat.<\/li><li>Menilai gagasan, fakta, atau opini.<\/li><li>Menanggapi isi teks, mengidentifikasi diri dengan tokoh/kejadian, menanggapi bahasa penulis.<\/li><\/ol><h4>Matriks Asesmen<\/h4><ol><li>Pemahaman Tekstual<\/li><li>Mengidentifikasi informasi dalam teks akademik.<\/li><li>Mengidentifikasi kalimat tanggapan, respons, dan kritik sesuai norma sosial-budaya.<\/li><li>Mengidentifikasi kalimat usulan, rumusan masalah, pemecahan masalah pada teks akademik/dunia kerja.<\/li><li>Mengidentifikasi karakter, peristiwa, latar pada sastra Indonesia/terjemahan.<\/li><\/ol><ol><li>Pemahaman Inferensial<\/li><li>Membandingkan nilai budaya, sosial, moral, religius, pendidikan dalam karya sastra.<\/li><li>Mengungkapkan kembali isi sastra Melayu Klasik.<\/li><li>Mengubah informasi tabel/grafik menjadi uraian atau sebaliknya.<\/li><li>Menjelaskan ketepatan bahasa, kiasan, citraan.<\/li><li>Menjelaskan afiks, frasa, klausa, kalimat.<\/li><li>Menjelaskan kohesi dan koherensi teks ilmiah.<\/li><\/ol><ol><li>Evaluasi dan Apresiasi<\/li><li>Menilai gagasan berdasarkan logika berpikir.<\/li><li>Menilai kesesuaian isi antarteks.<\/li><li>Menilai gagasan/tindakan tokoh berdasarkan norma/nilai.<\/li><li>Mengalihwahanakan puisi ke prosa.<\/li><li>Menyimpulkan respons emosional terhadap puisi, prosa, drama.<\/li><\/ol><h4>Contoh Soal Resmi<\/h4><p>Teks: Proposal “Pemanfaatan Teknologi Digital untuk Meningkatkan Daya Saing UKM Pangan Lokal”.<\/p><p>Soal 1<\/p><ul><li>Kompetensi: Pemahaman Tekstual.<\/li><li>Subkompetensi: mengidentifikasi kesesuaian usulan program dan data pendukung.<\/li><li>Bentuk soal: PGK Kategori.<\/li><li>Kunci: A. Sesuai, B. Sesuai, C. Tidak Sesuai.<\/li><\/ul><p>Soal 2<\/p><ul><li>Kompetensi: Pemahaman Inferensial.<\/li><li>Subkompetensi: kohesi dan koherensi teks ilmiah.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: B.<\/li><li>Pertanyaan: hubungan koherensi antara paragraf ke-2 dan ke-3.<\/li><\/ul><p>Soal 3<\/p><ul><li>Kompetensi: Evaluasi dan Apresiasi.<\/li><li>Subkompetensi: menilai logika argumen.<\/li><li>Bentuk soal: PGK Kategori.<\/li><li>Kunci: A. Tidak Logis, B. Logis, C. Logis.<\/li><\/ul><p>Soal 4–6<\/p><ul><li>Teks: puisi “Huesca” karya John Cornford, terjemahan Chairil Anwar.<\/li><li>Kompetensi: Pemahaman Inferensial.<\/li><li>Subkompetensi: makna kiasan dan citraan.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci soal 4: A.<\/li><li>Kunci soal 5: E.<\/li><\/ul>"},{"s":"teks-argumentasi","t":"Teks Argumentasi","m":3,"sr":"buatan","h":"<p>Teks argumentasi memuat tesis, argumen, dan penegasan ulang. Argumen harus didukung data, fakta, atau contoh.<\/p>"},{"s":"makna-konotatif","t":"Makna Konotatif","m":3,"sr":"buatan","h":"<p>Makna denotatif adalah makna sebenarnya; makna konotatif adalah makna kias atau tambahan. Contoh: “tangan kanan” berarti orang kepercayaan.<\/p>"},{"s":"gaya-bahasa","t":"Gaya Bahasa","m":3,"sr":"buatan","h":"<p>Gaya bahasa meliputi metafora, personifikasi, hiperbola, ironi, dan repetisi. Metafora membandingkan langsung, personifikasi memberi sifat manusia pada benda.<\/p>"},{"s":"teks-akademik","t":"Teks Akademik","m":3,"sr":"buatan","h":"<p>Teks akademik menggunakan bahasa baku, objektif, dan didukung data atau rujukan.<\/p>"}],"qs":[{"q":"<p>Teks yang bertujuan meyakinkan pembaca melalui alasan dan bukti disebut …<\/p>","t":"s","o":["Narasi","Deskripsi","Argumentasi","Eksposisi","Prosedur"],"a":[2],"e":"Teks argumentasi bertujuan meyakinkan."},{"q":"<p>“Ia adalah tangan kanan direktur.” Makna “tangan kanan” adalah …<\/p>","t":"s","o":["Anggota tubuh","Orang kepercayaan","Pekerja kasar","Pemimpin utama","Lawan kerja"],"a":[1],"e":"Makna konotatifnya adalah orang kepercayaan."},{"q":"<p>“Angin berbisik lembut di antara pepohonan.” Gaya bahasa tersebut adalah …<\/p>","t":"s","o":["Metafora","Personifikasi","Hiperbola","Ironi","Repetisi"],"a":[1],"e":"Angin diberi sifat manusia, yaitu berbisik."},{"q":"<p>Kalimat tesis biasanya terdapat pada bagian …<\/p>","t":"s","o":["Awal teks argumentasi","Tengah argumen","Akhir kesimpulan","Daftar pustaka","Lampiran"],"a":[0],"e":"Tesis adalah pernyataan awal yang akan dibuktikan."},{"q":"<p>Kata “signifikan” bermakna …<\/p>","t":"s","o":["Sedikit","Penting atau besar","Lambat","Sama","Tidak jelas"],"a":[1],"e":"Signifikan berarti penting atau berpengaruh besar."},{"q":"<p>Kalimat akademik yang tepat adalah …<\/p>","t":"s","o":["Menurut gue, itu bagus banget.","Data menunjukkan peningkatan signifikan.","Kayaknya sih begitu deh.","Duh, seru banget!","Gitu aja kok repot."],"a":[1],"e":"Bahasa akademik bersifat baku dan objektif."},{"q":"<p>PGK. Pilih semua ciri teks argumentasi.<\/p>","t":"m","o":["Memuat tesis","Memuat argumen","Memuat bukti/data","Memuat penegasan ulang","Selalu berupa cerita fiksi"],"a":[0,1,2,3],"e":"Teks argumentasi bukan cerita fiksi."},{"q":"<p>PGK. Pilih semua gaya bahasa.<\/p>","t":"m","o":["Metafora","Personifikasi","Hiperbola","Fotosintesis","Ironi"],"a":[0,1,2,4],"e":"Fotosintesis adalah proses biologi, bukan gaya bahasa."},{"q":"<p>PGK. Pilih semua kata baku.<\/p>","t":"m","o":["Apotek","Praktik","Risiko","Resiko","Telpon"],"a":[0,1,2],"e":"Bentuk baku: apotek, praktik, risiko; telepon juga baku."},{"q":"<p>PGK. Pilih semua bagian struktur teks argumentasi.<\/p>","t":"m","o":["Tesis","Argumen","Penegasan ulang","Abstrak","Lampiran"],"a":[0,1,2],"e":"Struktur utama argumentasi adalah tesis, argumen, penegasan ulang."},{"q":"<p>Teks yang berisi pendapat penulis disebut …<\/p>","t":"s","o":["Teks argumentasi","Teks narasi","Teks deskripsi","Teks prosedur","Teks laporan"],"a":[0],"e":"Argumentasi memuat pendapat."},{"q":"<p>Kalimat utama paragraf disebut …<\/p>","t":"s","o":["Ide pokok","Kalimat penjelas","Kalimat tambahan","Judul","Kesimpulan"],"a":[0],"e":"Ide pokok = kalimat utama."},{"q":"<p>Teks yang menjelaskan langkah membuat sesuatu disebut …<\/p>","t":"s","o":["Teks prosedur","Teks argumentasi","Teks narasi","Teks deskripsi","Teks laporan"],"a":[0],"e":"Prosedur = langkah-langkah."},{"q":"<p>Kata penghubung antarparagraf disebut …<\/p>","t":"s","o":["Konjungsi","Nomina","Verba","Adjektiva","Adverbia"],"a":[0],"e":"Konjungsi menghubungkan."},{"q":"<p>Teks yang menceritakan pengalaman disebut …<\/p>","t":"s","o":["Teks narasi","Teks argumentasi","Teks prosedur","Teks deskripsi","Teks laporan"],"a":[0],"e":"Narasi menceritakan pengalaman."}]}</script><script src="../assets/catalog.js"></script><script src="../assets/app.js"></script></body></html>
