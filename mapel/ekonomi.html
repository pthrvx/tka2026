<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ekonomi | Persiapan TKA</title><link rel="stylesheet" href="../assets/app.css?v=1792139313"><link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,700&display=swap" rel="stylesheet"><script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("tka2_set")).theme||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script></head><body><header class="hd w" id="hd"></header><main class="w" id="app"></main><footer class="ft"><div class="w"><p>Website ini dibuat dan dikelola oleh <b>Putra</b>.</p><p class="so"><a href="https://instagram.com/pthrvx" target="_blank" rel="noopener">Instagram</a><a href="https://github.com/pthrvx" target="_blank" rel="noopener">GitHub</a><a href="https://www.tiktok.com/@pthrvx" target="_blank" rel="noopener">TikTok</a></p><p>© 2026 Putra. Soal dan materi untuk latihan mandiri, bukan soal resmi TKA.</p></div></footer><script>window.M={"id":"ekonomi","name":"Ekonomi","tl":"Sumber modul: kisi-kisi resmi Pusmendik dan materi latihan buatan.","mods":[{"s":"kisi-kisi-resmi","t":"Kisi-kisi Resmi Ekonomi","m":3,"sr":"resmi","h":"<h4>Definisi<\/h4><p>TKA Ekonomi mengukur pemahaman konsep dasar ilmu ekonomi, ekonomi mikro dan makro, ekonomi internasional, serta akuntansi keuangan dasar, dan kemampuan menerapkannya pada permasalahan ekonomi dunia nyata.<\/p><h4>Muatan<\/h4><p>Muatan mencakup 4 elemen:<\/p><ol><li>Konsep Dasar Ilmu Ekonomi<\/li><li>Ekonomi Mikro dan Makro<\/li><li>Ekonomi Internasional<\/li><li>Akuntansi Keuangan Dasar<\/li><\/ol><p>Keempat elemen disajikan secara konseptual maupun dalam konteks permasalahan ekonomi dunia nyata.<\/p><h4>Kompetensi<\/h4><ol><li>Pemahaman: mengenali, mengingat, memahami konsep dasar ekonomi, mikro, makro, internasional, dan akuntansi; menguji definisi, teori, konsep dasar.<\/li><li>Penerapan: mengaplikasikan konsep, melakukan perhitungan, menginterpretasikan data, menerapkan prinsip ekonomi untuk menyelesaikan masalah.<\/li><li>Penalaran: berpikir kritis, mengaitkan konsep dengan fenomena nyata, menganalisis data, mengevaluasi, menarik kesimpulan dalam pengambilan keputusan ekonomi.<\/li><\/ol><h4>Matriks Asesmen<\/h4><ol><li>Konsep Dasar Ilmu Ekonomi<\/li><li>Kelangkaan, biaya peluang, kegiatan ekonomi: menganalisis konsep dasar ilmu ekonomi.<\/li><\/ol><ol><li>Ekonomi Mikro dan Makro<\/li><li>Permintaan, penawaran, keseimbangan pasar: menganalisis.<\/li><li>Pendapatan nasional, pertumbuhan, pembangunan ekonomi: menganalisis.<\/li><li>Ketenagakerjaan: menganalisis konsep dan permasalahannya.<\/li><li>Indeks harga dan inflasi: mengevaluasi.<\/li><li>Bank sentral dan kebijakan moneter: mengidentifikasi peran bank sentral, menganalisis kebijakan moneter.<\/li><li>Kebijakan fiskal dan perpajakan: menerapkan konsep perpajakan, menganalisis kebijakan fiskal.<\/li><li>Manajemen badan usaha (BUMN, BUMD, BUMS, Koperasi): mendeskripsikan konsep.<\/li><\/ol><ol><li>Ekonomi Internasional<\/li><li>Kerja sama ekonomi dan perdagangan internasional: menganalisis.<\/li><\/ol><ol><li>Akuntansi Keuangan Dasar<\/li><li>Persamaan dasar akuntansi dan laporan keuangan: menerapkan.<\/li><\/ol><h4>Contoh Soal Resmi<\/h4><p>Soal 1<\/p><ul><li>Konteks: kelangkaan air bersih di Kota Maju.<\/li><li>Kompetensi: menganalisis konsep dasar ilmu ekonomi (kelangkaan, biaya peluang, kegiatan ekonomi).<\/li><li>Bentuk soal: PGK MCMA.<\/li><li>Kunci: A, B, D.<\/li><\/ul><p>Soal 2<\/p><ul><li>Konteks: pengangguran di Indonesia.<\/li><li>Kompetensi: menganalisis konsep ketenagakerjaan dan permasalahannya.<\/li><li>Bentuk soal: PGK Kategori.<\/li><li>Kunci: A. Salah, B. Benar, C. Benar.<\/li><\/ul><p>Soal 3<\/p><ul><li>Konteks: inflasi dan kenaikan BI Rate.<\/li><li>Kompetensi: mengidentifikasi peran bank sentral dan menganalisis kebijakan moneter.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: D.<\/li><\/ul><p>Soal 4<\/p><ul><li>Konteks: ekspor turun, impor naik, defisit neraca perdagangan.<\/li><li>Kompetensi: menganalisis kerja sama ekonomi dan perdagangan internasional.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: B.<\/li><\/ul><p>Soal 5<\/p><ul><li>Konteks: data keuangan PT Sejahtera Makmur.<\/li><li>Kompetensi: menerapkan persamaan dasar akuntansi dan laporan keuangan.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: C.<\/li><li>Pertanyaan: laba bersih perusahaan.<\/li><\/ul>"},{"s":"kelangkaan","t":"Kelangkaan","m":3,"sr":"buatan","h":"<p>Kelangkaan memaksa manusia melakukan pilihan ekonomi.<\/p>"},{"s":"permintaan-dan-penawaran","t":"Permintaan dan Penawaran","m":3,"sr":"buatan","h":"<p>Jika permintaan naik dan penawaran tetap, harga cenderung naik. Jika penawaran naik dan permintaan tetap, harga cenderung turun.<\/p>"},{"s":"bank-sentral","t":"Bank Sentral","m":3,"sr":"buatan","h":"<p>Bank Indonesia menjaga stabilitas nilai rupiah melalui kebijakan moneter.<\/p>"},{"s":"apbn","t":"APBN","m":3,"sr":"buatan","h":"<p>Sumber pendapatan utama negara adalah pajak. Neraca perdagangan surplus terjadi jika ekspor lebih besar dari impor.<\/p>"}],"qs":[{"q":"<p>Masalah utama ekonomi adalah …<\/p>","t":"s","o":["Kelangkaan","Kelimpahan","Stabilitas","Inflasi","Pengangguran"],"a":[0],"e":"Kelangkaan memaksa manusia melakukan pilihan.","ks":""},{"q":"<p>Jika permintaan naik dan penawaran tetap, harga cenderung …<\/p>","t":"s","o":["Naik","Turun","Tetap","Hilang","Tidak dapat ditentukan"],"a":[0],"e":"Kenaikan permintaan mendorong harga naik.","ks":""},{"q":"<p>Bank sentral Indonesia adalah …<\/p>","t":"s","o":["BRI","BCA","Bank Indonesia","OJK","Kementerian Keuangan"],"a":[2],"e":"Bank Indonesia adalah bank sentral.","ks":""},{"q":"<p>Ekspor adalah …<\/p>","t":"s","o":["Membeli barang dari luar negeri","Menjual barang ke luar negeri","Menyimpan barang","Membayar pajak","Menerima bantuan"],"a":[1],"e":"Ekspor adalah penjualan ke luar ne
