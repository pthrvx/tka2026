<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bahasa Inggris | Persiapan TKA</title><link rel="stylesheet" href="../assets/app.css"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet"><script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("tka2_set")).theme||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script></head><body><header class="hd w" id="hd"></header><main class="w" id="app"></main><footer class="ft"><div class="w"><p>Website ini dibuat dan dikelola oleh <b>Putra</b>.</p><p class="so"><a href="https://instagram.com/pthrvx" target="_blank" rel="noopener">Instagram</a><a href="https://github.com/pthrvx" target="_blank" rel="noopener">GitHub</a><a href="https://www.tiktok.com/@pthrvx" target="_blank" rel="noopener">TikTok</a></p><p>© 2026 Putra. Soal dan materi untuk latihan mandiri, bukan soal resmi TKA.</p></div></footer><script>window.M={"id":"bahasa-inggris","name":"Bahasa Inggris","tl":"Sumber modul: kisi-kisi resmi Pusmendik dan materi latihan buatan.","mods":[{"s":"kisi-kisi-resmi","t":"Kisi-kisi Resmi Bahasa Inggris","m":3,"sr":"resmi","h":"<h4>Definisi<\/h4><p>TKA Bahasa Inggris mengukur keterampilan membaca beragam jenis teks berbahasa Inggris dalam situasi komunikasi sehari-hari, vokasional, dan akademik.<\/p><h4>Muatan<\/h4><p>Jenis teks yang digunakan:<\/p><ul><li>Descriptive<\/li><li>Recount<\/li><li>Narrative<\/li><li>Procedure<\/li><li>Analytical exposition<\/li><\/ul><p>Konteks komunikasi:<\/p><ul><li>Sehari-hari<\/li><li>Tempat kerja/vokasional<\/li><li>Akademik<\/li><\/ul><p>Kompleksitas teks:<\/p><ul><li>Tingkat B1 CEFR: 250–350 kata, kosakata berfrekuensi tinggi hingga 3.000 kata, struktur kalimat sederhana dan kompleks.<\/li><li>Tingkat A2: 200–300 kata, kosakata hingga 2.000 kata, struktur kalimat sederhana dan beberapa bentuk majemuk dasar.<\/li><\/ul><h4>Kompetensi<\/h4><ol><li>Pemahaman Tekstual<\/li><li>Memahami informasi eksplisit.<\/li><li>Mengelompokkan, menyusun ulang, dan menyajikan kembali informasi eksplisit.<\/li><\/ol><ol><li>Pemahaman Inferensial<\/li><li>Menarik kesimpulan berdasarkan informasi tersirat, pengalaman pribadi, dan intuisi.<\/li><\/ol><ol><li>Evaluasi dan Apresiasi<\/li><li>Menilai ide.<\/li><li>Menanggapi teks secara emosional dan estetis.<\/li><li>Mempertimbangkan penggunaan bahasa penulis.<\/li><\/ol><h4>Matriks Asesmen<\/h4><ol><li>Pemahaman Tekstual<\/li><li>Menemukan atau mengidentifikasi informasi penting.<\/li><li>Mengklasifikasi orang, benda, tempat, atau peristiwa.<\/li><li>Membuat kerangka poin utama.<\/li><li>Meringkas isi teks.<\/li><li>Mensintesis informasi dari sumber lain.<\/li><\/ol><ol><li>Pemahaman Inferensial<\/li><li>Menyimpulkan detail pendukung.<\/li><li>Menyimpulkan topik, ide pokok, makna, target pembaca, tujuan penulisan, atau pesan moral.<\/li><li>Menyimpulkan urutan kejadian.<\/li><li>Menyimpulkan perbandingan.<\/li><li>Menyimpulkan hubungan sebab-akibat.<\/li><li>Menyimpulkan karakter tokoh.<\/li><li>Memprediksi hasil cerita.<\/li><\/ol><ol><li>Evaluasi dan Apresiasi<\/li><li>Menilai realitas atau fantasi.<\/li><li>Menilai fakta atau opini.<\/li><li>Menilai kecukupan dan validitas informasi.<\/li><li>Menilai kesesuaian bagian teks.<\/li><li>Menanggapi isi teks.<\/li><\/ol><h4>Contoh Soal Resmi<\/h4><p>Bentuk soal:<\/p><ul><li>Pilihan Ganda (PG)<\/li><li>PGK MCMA: pilih lebih dari satu jawaban benar<\/li><li>PGK Kategori: menentukan kategori<\/li><\/ul><p>Contoh kompetensi dan bentuk soal:<\/p><ol><li>Pemahaman Tekstual — PG — menyusun kerangka poin utama cerita.<\/li><li>Pemahaman Inferensial — PG — menyimpulkan hubungan sebab-akibat.<\/li><li>Pemahaman Inferensial — PGK Kategori — menentukan similarity atau difference antartokoh.<\/li><li>Pemahaman Inferensial — PG — menentukan makna frasa “kept his promise”.<\/li><li>Pemahaman Inferensial — PGK MCMA — menentukan pesan moral cerita.<\/li><li>Pemahaman Tekstual — PGK Kategori — mengklasifikasikan aktivitas sebagai preparation atau breaks.<\/li><li>Pemahaman Tekstual — PGK MCMA — menentukan syarat meja belajar yang tepat.<\/li><li>Pemahaman Inferensial — PG — menentukan siapa yang perlu membaca infografik.<\/li><li>Pemahaman Inferensial — PGK MCMA — menentukan tindakan yang tidak menghormati siswa lain.<\/li><li>Evaluasi dan Apresiasi — PG — menentukan tindakan sebelum kunjungan berikutnya ke perpustakaan.<\/li><li>Pemahaman Tekstual — PGK Kategori — mengklasifikasikan tujuan kunjungan tempat wisata.<\/li><li>Pemahaman Inferensial — PG — menentukan topik utama teks Bali.<\/li><li>Evaluasi dan Apresiasi — PGK MCMA — menentukan bagian teks yang mendukung deskripsi Bali.<\/li><li>Pemahaman Tekstual — PG — mengidentifikasi kegiatan penulis setiap pagi.<\/li><li>Pemahaman Inferensial — PGK MCMA — menyimpulkan kepribadian penulis.<\/li><li>Pemahaman Inferensial — PG — memprediksi tindakan penulis setelah magang.<\/li><li>Pemahaman Tekstual — PGK MCMA — menentukan akibat kualitas tidur buruk.<\/li><li>Pemahaman Inferensial — PGK MCMA — menentukan fakta tambahan yang membuat teks persuasif.<\/li><li>Evaluasi dan Apresiasi — PG — menilai fakta atau opini.<\/li><\/ol>"},{"s":"main-idea","t":"Main Idea","m":3,"sr":"buatan","h":"<p>Main idea adalah gagasan utama teks. Cari kalimat yang mewakili seluruh paragraf, biasanya di awal atau akhir paragraf.<\/p>"},{"s":"vocabulary-in-context","t":"Vocabulary in Context","m":3,"sr":"buatan","h":"<p>Makna kata harus disesuaikan dengan kalimat.<\/p><p>Contoh:<br>“The app is user-friendly because students can easily navigate it.”<br>User-friendly berarti easy to use.<\/p>"},{"s":"reference-words","t":"Reference Words","m":3,"sr":"buatan","h":"<p>Kata rujukan:<br>it = benda tunggal<br>they = jamak<br>this = hal yang baru disebut<br>these = hal jamak<br>who = orang<br>which = benda/hal<\/p>"},{"s":"inference","t":"Inference","m":3,"sr":"buatan","h":"<p>Inference adalah kesimpulan yang tidak tertulis langsung tetapi dapat ditarik dari petunjuk teks.<\/p>"},{"s":"writer-s-purpose","t":"Writer’s Purpose","m":3,"sr":"buatan","h":"<p>Tujuan penulis dapat berupa to inform, to persuade, to describe, to instruct, atau to entertain.<\/p>"},{"s":"grammar-dasar","t":"Grammar Dasar","m":3,"sr":"buatan","h":"<p>Subject-verb agreement:<br>She goes to school.<br>They go to school.<\/p><p>Passive voice:<br>Active: Rina writes a letter.<br>Passive: A letter is written by Rina.<\/p>"},{"s":"conditional-sentences","t":"Conditional Sentences","m":3,"sr":"buatan","h":"<p>Conditional type 1:<br>If + simple present, will + verb.<\/p><p>Contoh:<br>If it rains, we will cancel the picnic.<\/p>"}],"qs":[{"q":"<p>What is the main idea of a paragraph?<\/p>","t":"s","o":["A small detail","The central idea of the paragraph","The last word","An unrelated opinion","A title only"],"a":[1],"e":"The main idea is the central message of the paragraph."},{"q":"<p>“These platforms allow students to study online.” The word “These” refers to …<\/p>","t":"s","o":["students","platforms","teachers","assignments","schools"],"a":[1],"e":"“These” refers to the plural noun mentioned before, namely platforms."},{"q":"<p>“The instructions were clear, so everyone understood the task.” The word “so” shows …<\/p>","t":"s","o":["contrast","cause and effect","addition","time","example"],"a":[1],"e":"“So” shows result or cause-and-effect relationship."},{"q":"<p>Which text mostly uses imperative sentences?<\/p>","t":"s","o":["Narrative text","Procedure text","Report text","Descriptive text","Recount text"],"a":[1],"e":"Procedure texts use instructions such as “Pour the water”."},{"q":"<p>Choose the correct sentence.<\/p>","t":"s","o":["She go to school every day.","She goes to school every day.","She going to school every day.","She gone to school every day.","She go school every day."],"a":[1],"e":"Third-person singular subjects use verb + s/es in simple present tense."},{"q":"<p>Choose the correct passive sentence.<\/p>","t":"s","o":["The letter wrote by Rina.","The letter is written by Rina.","The letter writing by Rina.","The letter write by Rina.","The letter written by Rina."],"a":[1],"e":"Passive voice uses to be + past participle: is written."},{"q":"<p>“My brother is interested ___ robotics.”<\/p>","t":"s","o":["at","on","in","for","with"],"a":[2],"e":"The correct preposition after “interested” is “in”."},{"q":"<p>Choose the correct comparative form.<\/p>","t":"s","o":["This book is more interesting than that one.","This book is interestinger than that one.","This book is most interesting than that one.","This book is interesting than that one.","This book is more interestinger than that one."],"a":[0],"e":"Long adjectives use “more + adjective + than”."},{"q":"<p>“If it ___ tomorrow, we will cancel the picnic.”<\/p>","t":"s","o":["rain","rains","rained","raining","will rain"],"a":[1],"e":"Conditional type 1 uses present tense after “if”."},{"q":"<p>The purpose of a text that gives steps to make food is …<\/p>","t":"s","o":["to entertain","to describe","to instruct","to argue","to report"],"a":[2],"e":"Procedure texts aim to instruct readers."},{"q":"<p>“However” is used to show …<\/p>","t":"s","o":["addition","contrast","cause","example","time"],"a":[1],"e":"“However” signals contrast."},{"q":"<p>“The teacher gave us clear instructions.” The word “us” refers to …<\/p>","t":"s","o":["the teacher","students","instructions","school","homework"],"a":[1],"e":"“Us” refers to the people receiving instructions, namely students."},{"q":"<p>PGK. Choose all true statements about inference.<\/p>","t":"m","o":["It is directly written in the text.","It is concluded from clues in the text.","It must be supported by the text.","It can ignore the text completely.","It is always the same as the title."],"a":[1,2],"e":"Inference is concluded from textual clues and must be supported by the text."},{"q":"<p>PGK. Choose all features of procedure text.<\/p>","t":"m","o":["Goal or aim","Materials or ingredients","Steps","Random events","Conclusion of a story"],"a":[0,1,2],"e":"Procedure text contains goal, materials, and ordered steps."},{"q":"<p>PGK. Choose all correct simple present sentences.<\/p>","t":"m","o":["She studies English every day.","They goes to school.","He plays football.","I am a student.","We is ready."],"a":[0,2,3],"e":"Correct forms are “She studies”, “He plays”, and “I am”."}]}</script><script src="../assets/catalog.js"></script><script src="../assets/app.js"></script></body></html>
