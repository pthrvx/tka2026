<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bahasa Inggris Tingkat Lanjut | Persiapan TKA</title><link rel="stylesheet" href="../assets/app.css"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet"><script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("tka2_set")).theme||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script></head><body><header class="hd w" id="hd"></header><main class="w" id="app"></main><footer class="ft"><div class="w"><p>Website ini dibuat dan dikelola oleh <b>Putra</b>.</p><p class="so"><a href="https://instagram.com/pthrvx" target="_blank" rel="noopener">Instagram</a><a href="https://github.com/pthrvx" target="_blank" rel="noopener">GitHub</a><a href="https://www.tiktok.com/@pthrvx" target="_blank" rel="noopener">TikTok</a></p><p>© 2026 Putra. Soal dan materi untuk latihan mandiri, bukan soal resmi TKA.</p></div></footer><script>window.M={"id":"bahasa-inggris-tingkat-lanjut","name":"Bahasa Inggris Tingkat Lanjut","tl":"Sumber modul: kisi-kisi resmi Pusmendik dan materi latihan buatan.","mods":[{"s":"kisi-kisi-resmi","t":"Kisi-kisi Resmi Bahasa Inggris Tingkat Lanjut","m":3,"sr":"resmi","h":"<h4>Definisi<\/h4><p>TKA Bahasa Inggris Tingkat Lanjut mengukur keterampilan membaca teks exposition dan discussion dalam konteks sehari-hari, vokasi, dan akademik, terutama topik teknologi dan isu faktual.<\/p><h4>Muatan<\/h4><p>Jenis teks:<\/p><ul><li>Exposition<\/li><li>Discussion<\/li><\/ul><p>Konteks:<\/p><ul><li>Sehari-hari<\/li><li>Vokasi<\/li><li>Akademik<\/li><\/ul><p>Topik:<\/p><ul><li>Teknologi<\/li><li>Isu-isu faktual<\/li><\/ul><p>Tingkat kompleksitas:<\/p><ul><li>B2 CEFR: 300–400 kata, kosakata hingga 4.000 kata, struktur kompleks, konteks vokasional-akademik.<\/li><li>B1 CEFR: 250–350 kata, kosakata hingga 3.000 kata, struktur sederhana-kompleks, konteks vokasional-akademik dasar.<\/li><\/ul><h4>Kompetensi<\/h4><ol><li>Pemahaman Tekstual: memahami informasi eksplisit, mengelompokkan, menyusun ulang, menyajikan kembali secara sistematis.<\/li><li>Pemahaman Inferensial: menyimpulkan informasi tersirat dan menghubungkannya dengan pengetahuan/pengalaman relevan.<\/li><li>Evaluasi dan Apresiasi: menilai kualitas argumen, keakuratan informasi, menanggapi secara kritis.<\/li><\/ol><h4>Matriks Asesmen<\/h4><ol><li>Pemahaman Tekstual<\/li><li>Menemukan/mengidentifikasi gagasan utama dan informasi penting.<\/li><li>Mengklasifikasi argumen, fakta, pendapat.<\/li><li>Membuat kerangka poin utama.<\/li><li>Meringkas isi teks.<\/li><li>Mensintesis informasi dari sumber lain.<\/li><\/ol><ol><li>Pemahaman Inferensial<\/li><li>Menyimpulkan detail pendukung.<\/li><li>Menyimpulkan topik, ide pokok, makna, target pembaca, tujuan penulisan, pesan moral.<\/li><li>Menyimpulkan hubungan antar-ide.<\/li><li>Menyimpulkan hubungan sebab-akibat.<\/li><li>Menyimpulkan sudut pandang penulis.<\/li><li>Memprediksi implikasi/konsekuensi.<\/li><\/ol><ol><li>Evaluasi dan Apresiasi<\/li><li>Menilai fakta atau opini.<\/li><li>Menilai keakuratan dan kecukupan informasi.<\/li><li>Menilai kecukupan dan validitas informasi.<\/li><li>Menilai kekuatan argumen.<\/li><li>Menanggapi isi teks secara kritis.<\/li><\/ol><h4>Contoh Soal Resmi<\/h4><p>Teks 1: AI in the workplace (argument for and against AI at work).<\/p><p>Soal 1<\/p><ul><li>Kompetensi: Pemahaman Tekstual.<\/li><li>Subkompetensi: mengelompokkan argumen/fakta/pendapat.<\/li><li>Bentuk soal: PGK Kategori.<\/li><li>Kunci: Information and communication = Yes; Financial and insurance = Yes; Agriculture, Forestry and Fisheries = No.<\/li><\/ul><p>Soal 2<\/p><ul><li>Kompetensi: Pemahaman Inferensial.<\/li><li>Subkompetensi: menyimpulkan topik/ide pokok paragraf dua.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: A.<\/li><\/ul><p>Soal 3<\/p><ul><li>Kompetensi: Evaluasi dan Apresiasi.<\/li><li>Subkompetensi: menanggapi isi teks secara kritis.<\/li><li>Bentuk soal: PGK MCMA.<\/li><li>Kunci: Pernyataan 1 dan Pernyataan 5.<\/li><\/ul><p>Teks 2: Cashless generation.<\/p><p>Soal 4<\/p><ul><li>Kompetensi: Pemahaman Tekstual.<\/li><li>Subkompetensi: menemukan gagasan utama dan informasi penting.<\/li><li>Bentuk soal: PGK MCMA.<\/li><li>Kunci: Pernyataan 1 dan Pernyataan 2.<\/li><\/ul><p>Soal 5<\/p><ul><li>Kompetensi: Evaluasi dan Apresiasi.<\/li><li>Subkompetensi: menentukan target pembaca.<\/li><li>Bentuk soal: PGK MCMA.<\/li><li>Kunci: A dan D.<\/li><\/ul><p>Soal 6<\/p><ul><li>Kompetensi: Evaluasi dan Apresiasi.<\/li><li>Subkompetensi: menanggapi isi teks secara kritis.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: E.<\/li><\/ul><p>Teks 3: Smart Spending and Consumer Awareness.<\/p><p>Soal 7<\/p><ul><li>Kompetensi: Pemahaman Tekstual.<\/li><li>Subkompetensi: menemukan informasi penting.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: C.<\/li><li>Pertanyaan: tujuan budget.<\/li><\/ul><p>Soal 8<\/p><ul><li>Kompetensi: Pemahaman Tekstual.<\/li><li>Subkompetensi: meringkas.<\/li><li>Bentuk soal: PG.<\/li><li>Kunci: E.<\/li><\/ul><p>Soal 9<\/p><ul><li>Kompetensi: Evaluasi dan Apresiasi.<\/li><li>Subkompetensi: menilai fakta/opini.<\/li><li>Bentuk soal: PGK MCMA.<\/li><li>Kunci: A, C, dan E.<\/li><\/ul><p>Soal 10<\/p><ul><li>Kompetensi: Evaluasi dan Apresiasi.<\/li><li>Subkompetensi: menanggapi isi teks secara kritis.<\/li><li>Bentuk soal: PGK MCMA.<\/li><li>Kunci: A, B, dan C.<\/li><\/ul>"},{"s":"academic-reading","t":"Academic Reading","m":3,"sr":"buatan","h":"<p>Teks akademik menggunakan argumen, data, dan bahasa formal. Pembaca harus membedakan klaim, bukti, dan kesimpulan.<\/p>"},{"s":"complex-grammar","t":"Complex Grammar","m":3,"sr":"buatan","h":"<p>Perhatikan conditional type 2/3, reported speech, dan passive voice.<br>Conditional type 2: If I had time, I would travel.<br>Reported speech: He said that he was tired.<\/p>"},{"s":"formal-writing","t":"Formal Writing","m":3,"sr":"buatan","h":"<p>Gunakan kata formal seperti obtain, demonstrate, significant, dan hindari singkatan tidak formal.<\/p>"}],"qs":[{"q":"<p>“If I had studied harder, I would have passed.” This is conditional type …<\/p>","t":"s","o":["0","1","2","3","4"],"a":[3],"e":"Type 3: If + past perfect, would have + past participle."},{"q":"<p>“He said, ‘I am tired.’” Reported speech: …<\/p>","t":"s","o":["He said he is tired.","He said he was tired.","He says he was tired.","He said I am tired.","He said he be tired."],"a":[1],"e":"Present tense berubah menjadi past tense dalam reported speech."},{"q":"<p>The word “significant” is closest in meaning to …<\/p>","t":"s","o":["small","important","slow","cheap","weak"],"a":[1],"e":"Significant berarti penting atau besar pengaruhnya."},{"q":"<p>The purpose of an exposition text is to …<\/p>","t":"s","o":["entertain","persuade","describe an event","tell a story","give steps"],"a":[1],"e":"Exposition text aims to persuade using arguments."},{"q":"<p>Choose the correct passive sentence.<\/p>","t":"s","o":["The report was written by the team.","The report wrote by the team.","The report is write by the team.","The report writing by the team.","The report written by team."],"a":[0],"e":"Passive: to be + past participle."},{"q":"<p>PGK. Choose all features of academic writing.<\/p>","t":"m","o":["Formal language","Evidence and data","Objective tone","Slang expressions","Clear structure"],"a":[0,1,2,4],"e":"Academic writing avoids slang."},{"q":"<p>PGK. Choose all correct conditional sentences.<\/p>","t":"m","o":["If I had money, I would travel.","If she studies, she will pass.","If he had come, he would have seen her.","If they will come, we start.","If water is heated, it boils."],"a":[0,1,2,4],"e":"Pilihan D tidak menggunakan pola conditional yang tepat."},{"q":"<p>“I have finished my homework” menggunakan tense …<\/p>","t":"s","o":["Present perfect","Simple past","Simple present","Future","Past continuous"],"a":[0],"e":"Have finished = present perfect."},{"q":"<p>“She was reading when I called” menggunakan tense …<\/p>","t":"s","o":["Past continuous","Simple past","Present perfect","Future","Simple present"],"a":[0],"e":"Was reading = past continuous."},{"q":"<p>“If I study, I will pass” adalah …<\/p>","t":"s","o":["Conditional type 1","Type 2","Type 3","Zero conditional","Imperative"],"a":[0],"e":"Type 1: if + present, will."},{"q":"<p>“The book … by me yesterday” adalah …<\/p>","t":"s","o":["Passive voice","Active voice","Imperative","Question","Exclamation"],"a":[0],"e":"Was read = passive."},{"q":"<p>“Neither … nor” berarti …<\/p>","t":"s","o":["Tidak … dan tidak …","Baik … maupun …","Entah … atau …","Bukan hanya … tetapi juga …","Sejak"],"a":[0],"e":"Neither…nor = tidak keduanya."},{"q":"<p>“Despite” berarti …<\/p>","t":"s","o":["Meskipun","Karena","Oleh karena itu","Selain itu","Sehingga"],"a":[0],"e":"Despite = meskipun."},{"q":"<p>“Look forward to” berarti …<\/p>","t":"s","o":["Menantikan","Menolak","Menunda","Membatalkan","Menyesal"],"a":[0],"e":"Look forward to = menantikan."},{"q":"<p>“As soon as” berarti …<\/p>","t":"s","o":["Begitu","Meskipun","Karena","Oleh karena itu","Sehingga"],"a":[0],"e":"As soon as = begitu."}]}</script><script src="../assets/catalog.js"></script><script src="../assets/app.js"></script></body></html>
